<body data-logo="<?= logo ?>">

<div id="bootSplash" class="bootsplash" role="status" aria-live="polite"><div class="bs-box"><div class="bs-brand" id="bsBrand"><?= company ?></div><div class="bs-spin" aria-hidden="true"></div><p id="bsMsg">読み込んでいます…</p></div></div>
<div id="login" class="login" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-brand"><img id="loginLogo" alt="" hidden><div class="login-company" id="loginCompany"><?= company ?></div></div>
    <div>
      <h1><?= appName ?></h1>
      <div class="ver">v<?= appVersion ?></div>

    <p class="login-keep-note" id="loginKeepNote">この端末だけに効きます。ほかの人も使うパソコンでは、チェックしないでください。</p>
    <button class="btn primary" type="submit" id="loginBtn">ログイン</button>
  </form>
</div>

<div id="shell" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><img id="brandLogo" alt="" hidden><span id="brand"></span></div>
      <nav class="nav" id="nav" aria-label="画面の切り替え"></nav>
      <button class="btn small phone-only" type="button" id="topMenu" data-act="openMenu" aria-label="メニュー">☰<span class="lbl"> メニュー</span></button>
      <div class="user">
        <button class="btn small primary" type="button" data-act="quickAdd">＋ 記録</button>
      </div>
      <!-- v0.131.0：上の帯は1段。更新と、名前のメニュー（前回ログイン・読み込み時間・自分の設定・パスワード変更・ログアウト）だけ -->
      <div class="topact">
        <button class="btn small" type="button" id="refreshAll" data-act="refreshAll" title="いま見ている画面のぶんだけを、読み直します。全部を読み直すときは、名前のメニューの「すべて読み直す」を使います" aria-label="更新">⟳<span class="lbl"> 更新</span></button>
        <details class="acct" id="acct"><summary class="btn small acct-btn" title="自分の設定・ログアウト"><span class="avatar" id="acctAvatar" aria-hidden="true"></span><span class="w-msg" id="welcomeMsg"></span><span class="caret"> ▾</span></summary>
          <div class="acct-menu">
            <div class="acct-info"><span id="lastLogin"></span><span id="timingSlot"></span></div>
            <button class="btn small" type="button" data-act="openMyPrefs">自分の設定</button>
            <button class="btn small" type="button" data-act="openPassword">パスワード変更</button>
            <button class="btn small" type="button" data-act="refreshFull" title="スプレッドシートを手で直したあとなど">すべて読み直す</button>
            <button class="btn small" type="button" id="welcomeLogout" data-act="logout">ログアウト</button>
          </div></details>
      </div>
    </div>
    <div class="welcome" id="welcome" hidden></div>
  </header>
  <main id="main"></main>
  <nav id="bnav" aria-label="画面の切り替え（スマホ）"></nav>
</div>

<div id="modals"></div>
<script>
document.addEventListener('click', function (e) {
  var d = document.getElementById('acct');
  if (d && d.open && (!d.contains(e.target) || e.target.closest('.acct-menu button'))) d.open = false;
  var n = document.getElementById('navMore');
  if (n && n.open && (!n.contains(e.target) || e.target.closest('.navpop button'))) n.open = false;
}, true);
document.addEventListener('keydown', function (e) {
  var d = document.getElementById('acct'), n = document.getElementById('navMore');
  if (e.key === 'Escape') { if (d && d.open) d.open = false; if (n && n.open) n.open = false; }
});
</script>
<div id="printArea"></div>
<div id="toast" hidden role="status"></div>
