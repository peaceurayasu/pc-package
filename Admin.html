<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<?!= include_('AdminCss') ?>
</head>
<body data-logo="<?= logo ?>">
<div id="busy" hidden></div>
<div id="blocker" hidden><span>最新のデータを読み込んでいます…</span></div>

<div id="bootSplash" class="bootsplash" role="status" aria-live="polite"><div class="bs-box"><div class="bs-brand" id="bsBrand"><?= company ?></div><div class="bs-spin" aria-hidden="true"></div><p id="bsMsg">読み込んでいます…</p></div></div>
<div id="login" class="login" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-brand"><img id="loginLogo" alt="" hidden><div class="login-company" id="loginCompany"><?= company ?></div></div>
    <div>
      <h1><?= appName ?></h1>
      <div class="ver">v<?= appVersion ?></div>
    </div>
    <p class="msg" id="loginMsg" hidden></p>
    <div class="field"><label for="loginId">スタッフID</label><input type="text" id="loginId" autocomplete="username" autocapitalize="off" required></div>
    <div class="field"><label for="loginPw">パスワード</label><input type="password" id="loginPw" autocomplete="current-password" required></div>
    <label class="login-keep" for="loginKeep"><input type="checkbox" id="loginKeep"><span>ログインしたままにする（<?= rememberDays ?>日）</span></label>
    <p class="login-keep-note" id="loginKeepNote">この端末だけに効きます。ほかの人も使うパソコンでは、チェックしないでください。</p>
    <button class="btn primary" type="submit" id="loginBtn">ログイン</button>
  </form>
</div>

<div id="shell" hidden>
  <header class="top">
    <div class="top-row">
      <div class="brand"><img id="brandLogo" alt="" hidden><span id="brand"></span></div>
      <nav class="nav" id="nav" aria-label="画面の切り替え"></nav>
      <button class="btn small phone-only" type="button" id="topMenu" data-act="openMenu" aria-label="メニュー">☰ メニュー</button>
      <div class="user">
        <button class="btn small primary" type="button" data-act="quickAdd">＋ 記録</button>
        <details class="acct" id="acct"><summary class="btn small"><span class="who" id="who"></span> ▾</summary>
          <div class="acct-menu">
            <button class="btn small" type="button" data-act="openMyPrefs">自分の設定</button>
            <button class="btn small" type="button" data-act="openPassword">パスワード変更</button>
            <button class="btn small" type="button" data-act="logout">ログアウト</button>
          </div></details>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="bnav" aria-label="画面の切り替え（スマホ）"></nav>
</div>

<div id="modals"></div>
<script>
document.addEventListener('click', function (e) {
  var d = document.getElementById('acct');
  if (d && d.open && (!d.contains(e.target) || e.target.closest('.acct-menu button'))) d.open = false;
}, true);
document.addEventListener('keydown', function (e) { var d = document.getElementById('acct'); if (e.key === 'Escape' && d && d.open) d.open = false; });
</script>
<div id="printArea"></div>
<div id="toast" hidden role="status"></div>

<?!= include_('AdminJsMobile') ?>
<?!= include_('AdminJsUi') ?>
<?!= include_('AdminJsLayout') ?>
<?!= include_('AdminJsPhoto') ?>
<?!= include_('AdminJsActions') ?>
</body>
</html>
