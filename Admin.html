var DELETE_FN = { activity: 'deleteActivity', repair: 'deleteRepair', license: 'deleteLicense', credential: 'deleteCredential',
  maintenance: 'deleteMaintenance', memo: 'deleteMemo', notice: 'deleteNotice', wininfo: 'deleteWinInfo', rental: 'deleteRental', loan: 'deleteLoan' };
var FIELD_LABEL = { '顧客ID': '顧客', '機器ID': '機器', '元の対応ID': '元になった対応', '対象ID': '対象', 'レンタルID': 'レンタル機器', '修理ID': '修理案件のID' };
// 顧客を選ばなくてもよい種類で、顧客の欄に添える説明
var CUSTOMER_HINT = { memo: '選ばなければ、全体のメモになります。', notice: '選ばなければ、すべての顧客のお客様ページに出ます。', loan: '顧客でない相手に貸すときは、下の「貸出先」に書きます。' };
var WIDE = { longtext: 1, multi: 1 };
var formSeq = 0;

function findRecord(key, id) {
  var list = key === 'credential' ? ((S.creds && S.creds.list) || []) : S.D[COLLECTION[key]];
  var idField = S.D.schema[key].idField;
  var extra = key === 'activity' ? (S.custActs[S.customerId] || []) : [];
  if (key === 'activity') Object.keys(S.actRange).forEach(function (k) { if (Array.isArray(S.actRange[k])) extra = extra.concat(S.actRange[k]); });
  return list.concat(extra).filter(function (r) { return r[idField] === id; })[0] || null;
}

function fieldDefault(f) {
  if (f.def === 'today') return S.D.today;
  if (f.def === 'me') return S.D.me.name;
  return f.def || '';
}

/** 顧客を選ぶ欄の候補。何も入れていないときは、最近対応した顧客を出す */
function pickListHtml(words) {
  var live = S.D.customers.filter(function (c) { return c['状態'] === '有効'; });
  var item = function (c) {
    return '<button type="button" data-pick="' + esc(c['顧客ID']) + '">' + esc(c['顧客名']) + (c['ふりがな'] ? '<span class="minor">' + esc(c['ふりがな']) + '</span>' : '') + '</button>';
  };
  var byKana = function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); };
  if (!String(words || '').trim()) {
    var seen = {}, recent = [];
    // この端末で最近選んだ顧客を先に（スマホでは対応履歴をまだ読んでいないことがある）
    recentCustIds().forEach(function (cid) {
      var c = IDX.cust[cid];
      if (c && c['状態'] === '有効' && !seen[cid] && recent.length < 6) { seen[cid] = true; recent.push(c); }
    });
    S.D.activities.concat(S.D.repairs.slice().sort(function (a, b) { return cmp(b['受付日'], a['受付日']); })).forEach(function (r) {
      var c = IDX.cust[r['顧客ID']];
      if (c && c['状態'] === '有効' && !seen[c['顧客ID']] && recent.length < 6) { seen[c['顧客ID']] = true; recent.push(c); }
    });
    if (recent.length) return '<div class="cap">最近の顧客（名前を入れると全体から探します）</div>' + recent.map(item).join('');
    var first = live.slice().sort(byKana).slice(0, 8);
    return first.length ? '<div class="cap">顧客（' + live.length + '件）</div>' + first.map(item).join('') : '<div class="cap">顧客がまだ登録されていません。</div>';
  }
  var hits = live.filter(function (c) { return textMatch(words, [c['顧客名'], c['ふりがな']]); }).sort(byKana);
  if (!hits.length) return '<div class="cap">見つかりません。</div>';
  return '<div class="cap">' + hits.length + '件' + (hits.length > 8 ? '（先頭の8件。もう少し入れると絞れます）' : '') + '</div>' + hits.slice(0, 8).map(item).join('');
}

/** 対応の定型文（設定の「選択肢」→「対応の定型文」で足せる。まだ1つも無ければ、最初の10個を出す） */
function phraseList() {
  var have = S.D.options['対応の定型文'] || [];
  return have.length ? have.filter(function (o) { return o.active; }).map(function (o) { return o.value; }) : (S.D.phraseDefaults || []);
}
function phrasesHtml() {
  var list = phraseList();
  if (!list.length) return '';
  return '<details class="phrases"><summary>定型文から入れる（' + list.length + '）</summary><div class="chipset small">' +
    list.map(function (t) { return '<button type="button" data-act="phrase" data-text="' + esc(t) + '" aria-pressed="false">' + esc(t) + '</button>'; }).join('') + '</div></details>';
}
function chipChoices(f, value) {
  if (!f.chips) return null;
  var list = f.type === 'select' ? f.choices.slice() : f.type === 'option' ? activeOptions(f.category, value) : null;
  return list && list.length && list.length <= 8 ? list : null;
}

function fieldHtml(key, f, value, ctx) {
  var id = 'f' + ctx.seq + '_' + ctx.i;
  var name = esc(f.name);
  var label = FIELD_LABEL[f.name] || f.name;
  var req = f.required ? ' required' : '';
  var common = ' id="' + id + '" name="' + name + '"' + req;
  var input, group = false, wide = WIDE[f.type];
  var isDepSelect = f.type === 'device' || f.name === '元の対応ID' || f.name === '対象ID';
  var chips = chipChoices(f, value);
  if (isDepSelect) {
    input = '<select' + common + ' data-dep="' + name + '" data-initial="' + esc(value) + '"></select>';
  } else if (f.type === 'customer') {
    wide = true;
    if (ctx.lockCustomer) {
      input = '<input type="hidden" name="' + name + '" value="' + esc(value) + '"><input type="text" id="' + id + '" value="' + esc(custName(value)) + '" disabled>';
    } else {
      input = '<div class="picker"><input type="hidden" name="' + name + '" value="' + esc(value) + '">' +
        '<div class="picked"' + (value ? '' : ' hidden') + '><b>' + esc(custName(value)) + '</b><button type="button" class="btn small" data-act="pickerClear">変える</button></div>' +
        '<div class="pick-search"' + (value ? ' hidden' : '') + '><input type="search" id="' + id + '" placeholder="顧客名・ふりがなで探す" data-picksearch="1" autocomplete="off">' +
        '<div class="pick-list">' + pickListHtml('') + '</div></div></div>';
    }
  } else if (f.type === 'rental') {
    if (ctx.lockRental) {
      input = '<input type="hidden" name="' + name + '" value="' + esc(value) + '"><input type="text" id="' + id + '" value="' + esc((IDX.rental[value] || {})['名称'] || value) + '" disabled>';
    } else {
      var free = S.D.rentals.filter(function (r) { return r['状態'] === S.D.rentalAvailable && !IDX.openLoan[r['レンタルID']]; })
        .map(function (r) { return [r['レンタルID'], r['名称']]; });
      input = '<select' + common + '>' + optionsHtml(free, value, free.length ? '選んでください' : '（貸せる機器がありません）') + '</select>';
    }
  } else if (chips) {
    group = true; wide = true;
    input = '<input type="hidden" name="' + name + '" value="' + esc(value) + '">' +
      '<div class="chipset" id="' + id + '" role="group" aria-label="' + esc(label) + '" data-chips="' + name + '" data-required="' + (f.required ? '1' : '') + '">' +
      chips.map(function (c) { return '<button type="button" data-chip="' + esc(c) + '" aria-pressed="' + (c === value) + '">' + esc(c) + '</button>'; }).join('') + '</div>';
  } else if (f.type === 'longtext') {
    input = '<textarea' + common + (f.max ? ' maxlength="' + f.max + '"' : '') + ' rows="' + (f.name === '内容' ? 5 : 3) + '">' + esc(value) + '</textarea>' +
      (key === 'activity' && f.name === '内容' ? phrasesHtml() : '');
  } else if (f.type === 'date') {
    input = '<input type="date"' + common + ' value="' + esc(value) + '">';
  } else if (f.type === 'datetime') {
    input = '<input type="datetime-local"' + common + ' value="' + esc(String(value).replace(' ', 'T')) + '">';
  } else if (f.type === 'number') {
    input = '<input type="number" min="0" step="1" inputmode="numeric"' + common + ' value="' + esc(value) + '">';
  } else if (f.type === 'select') {
    input = '<select' + common + '>' + optionsHtml(f.choices, value, f.required ? undefined : '') + '</select>';
  } else if (f.type === 'yesno') {
    input = '<select' + common + '>' + optionsHtml(['はい', 'いいえ'], value || 'いいえ') + '</select>';
  } else if (f.type === 'option') {
    input = '<select' + common + '>' + optionsHtml(activeOptions(f.category, value), value, f.required ? '選んでください' : '') + '</select>';
  } else if (f.type === 'staff') {
    var names = S.D.staffNames.slice();
    if (value && names.indexOf(value) === -1) names.push(value);
    input = '<select' + common + '>' + optionsHtml(names, value, '') + '</select>';
  } else if (f.type === 'multi') {
    group = true;
    var picked = String(value || '').split(',');
    input = '<div class="checks" id="' + id + '">' + f.choices.map(function (c) {
      return '<label><input type="checkbox" data-multi="' + name + '" value="' + esc(c) + '"' + (picked.indexOf(c) !== -1 ? ' checked' : '') + '>' + esc(c) + '</label>';
    }).join('') + '</div>';
  } else {
    var mode = f.name === '電話' || f.name === '郵便番号' ? ' inputmode="tel"' : f.name === 'メール' ? ' inputmode="email"' : '';
    input = '<input type="text" autocomplete="off"' + mode + common + (f.max ? ' maxlength="' + f.max + '"' : '') + ' value="' + esc(value) + '"' + (f.type === 'secret' ? ' class="secret"' : '') + '>';
    if (f.suggest) {
      var tokens = splitTokens(value);
      input += '<div class="suggest" data-suggest="' + name + '">' + f.suggest.map(function (t) {
        return '<button type="button" data-token="' + esc(t) + '" aria-pressed="' + (tokens.indexOf(t) !== -1) + '">' + esc(t) + '</button>';
      }).join('') + '</div>';
      wide = true;
    }
  }
  var hint = f.name === 'ポータル表示' ? '<span class="note">お客様ページに見せる内容。「対応」と「レポート」は対応履歴の内容がそのまま見えるので、注意して選んでください。</span>'
    : f.type === 'customer' && !f.required && CUSTOMER_HINT[key] && !ctx.lockCustomer ? '<span class="note">' + CUSTOMER_HINT[key] + '</span>' : '';
  var mark = f.required ? '<span class="req">必須</span>' : '';
  var tag = group ? '<span class="lab">' + esc(label) + mark + '</span>' : '<label for="' + id + '">' + esc(label) + mark + '</label>';
  return '<div class="field' + (wide ? ' wide' : '') + '" data-field="' + name + '">' + tag + input + hint + '</div>';
}
function splitTokens(v) {
  return String(v || '').split(/\s*[,、，]\s*/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
}

/** 顧客や対象区分に合わせて、機器・元の対応・対象の選択肢を作り直す */
function refreshDependents(form) {
  var custEl = form.elements['顧客ID'];
  var cid = custEl ? custEl.value : '';
  Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) {
    var dep = sel.dataset.dep;
    var keep = sel.dataset.touched ? sel.value : sel.dataset.initial;
    var list = [], disabled = false;
    var devs = function () {
      return S.D.devices.filter(function (d) { return d['顧客ID'] === cid && (d['状況'] !== '廃棄' || d['機器ID'] === keep); })
        .map(function (d) { return [d['機器ID'], devLabel(d['機器ID']) + '（' + d['種類'] + '）']; });
    };
    if (dep === '機器ID') list = devs();
    else if (dep === '元の対応ID') {
      list = S.D.activities.filter(function (a) { return a['顧客ID'] === cid; }).slice(0, 60)
        .map(function (a) { return [a['対応ID'], a['受付日'] + ' ' + String(a['内容']).replace(/\s+/g, ' ').slice(0, 30)]; });
    } else if (dep === '対象ID') {
      var kind = form.elements['対象区分'] ? form.elements['対象区分'].value : '';
      if (kind === '機器') list = devs();
      else if (kind === 'ライセンス') list = S.D.licenses.filter(function (l) { return l['顧客ID'] === cid; }).map(function (l) { return [l['ライセンスID'], l['製品名']]; });
      else disabled = true;
    }
    if (keep && !disabled && !list.some(function (o) { return o[0] === keep; }) && !sel.dataset.touched && cid === sel.dataset.cid) list.push([keep, keep]);
    var still = list.some(function (o) { return o[0] === keep; }) ? keep : '';
    sel.innerHTML = optionsHtml(list, still, cid ? (list.length ? '（なし）' : '（選べるものがありません）') : '（先に顧客を選んでください）');
    sel.disabled = disabled;
  });
}

/** 機器の窓の「収集ツールの情報」の欄 */
/** 収集ツールのレポート（v0.25.0）を開くボタン。届いていなければ空 */
function reportBtnHtml(g) {
  if (!g || !g['レポート添付ID']) return '';
  return '<button type="button" class="btn small primary" data-act="openDiagReport" data-id="' + esc(g['レポート添付ID']) + '">レポートを見る' +
    (g['レポート受信日時'] ? '<small>（' + esc(String(g['レポート受信日時']).slice(5, 16)) + '）</small>' : '') + '</button>';
}
/** レポートを、スクリプトを動かさない枠の中に出す。印刷もできる */
function openDiagReport(id) {
  return call('getDiagReport', { id: id }).then(function (r) {
    var wrap = openModal('<header><h2>' + esc('収集ツールのレポート') + ' <span class="sub">' + esc(devLabel(r.deviceId) || r.deviceId) + '　' + esc(r.at) + '</span></h2>' +
      '<button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
      '<div class="body rptbody"><iframe class="rptframe" title="収集ツールのレポート" sandbox="allow-same-origin allow-modals"></iframe></div>' +
      '<footer><button type="button" class="btn" data-act="printDiagReport">印刷・PDFにする</button><button type="button" class="btn primary" data-act="closeModal">閉じる</button></footer>');
    wrap.querySelector('.dialog').classList.add('wide');
    // 枠の設定でスクリプトは動かないが、念のため取り除いておく（ブラウザの警告も出なくなる）
    wrap.querySelector('iframe').srcdoc = String(r.html || '').replace(/<script[\s\S]*?<\/script\s*>/gi, '').replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  });
}
function diagBoxInner(id) {
  var g = IDX.diag[id];
  if (g) {
    return '<div class="row"><div class="grow"><b>収集ツールの情報</b>　最後に届いたのは ' + esc(g['受信日時']) +
      '<div class="note">' + esc([g['コンピューター名'], g['OS']].filter(function (x) { return x; }).join(' / ')) +
      '　重大 ' + esc(g['イベント重大'] === '' ? '—' : g['イベント重大']) + '件・エラー ' + esc(g['イベントエラー'] === '' ? '—' : g['イベントエラー']) + '件' +
      (g['Cドライブ空き'] !== '' && g['Cドライブ空き'] !== undefined ? '・Cドライブ空き ' + esc(g['Cドライブ空き']) + 'GB' : '') + '</div></div>' +
      reportBtnHtml(g) +
      '<button type="button" class="btn small" data-act="showDiag" data-id="' + esc(id) + '">くわしく見る</button></div>';
  }
  return '<span class="note">' + (S.ready ? '収集ツールからの情報は、まだ届いていません。' : S.restFailed ? '収集ツールの情報を読み込めませんでした。' : '収集ツールの情報を読み込んでいます…') + '</span>';
}
function openForm(key, rec, preset) {
  var schema = S.D.schema[key];
  S.openRec = rec && schema && rec[schema.idField] ? key + ':' + rec[schema.idField] : '';
  saveLocSoon();
  var isNew = !rec;
  // いまある記録を開くとき・ほかの一覧から選ぶ欄がある種類は、残りのデータが要る（スマホでは、ここで読み始める）
  if (!S.ready && (rec || key === 'repair' || key === 'credential' || key === 'loan')) ensureRest();
  var seq = ++formSeq;
  var fields = schema.fields.filter(function (f) { return !f.adminOnly || S.D.me.isAdmin; });
  var lockCustomer = (!isNew && (key === 'device' || key === 'license' || key === 'credential')) || !!(preset && preset.lockCustomer);
  var one = function (f) {
    var value = rec ? rec[f.name] : (preset && preset[f.name] !== undefined ? preset[f.name] : fieldDefault(f));
    return fieldHtml(key, f, value === undefined ? '' : value, { seq: seq, i: fields.indexOf(f), lockCustomer: lockCustomer, lockRental: key === 'loan' && (!isNew || !!(preset && preset.lockRental)) });
  };
  // よく使う項目だけ先に出し、残りは「詳しい項目」にたたむ（編集のときは最初から開く）
  var hasQuick = fields.some(function (f) { return f.quick; });
  var quick = fields.filter(function (f) { return !hasQuick || f.quick; });
  var rest = fields.filter(function (f) { return hasQuick && !f.quick; });
  var html = '<div class="grid2">' + quick.map(one).join('') + '</div>' +
    (rest.length ? '<details class="rest"' + (isNew ? '' : ' open') + '><summary>詳しい項目（' + rest.map(function (f) { return FIELD_LABEL[f.name] || f.name; }).slice(0, 3).join('・') + ' など）</summary><div class="grid2">' + rest.map(one).join('') + '</div></details>' : '');
  var id = rec ? rec[schema.idField] : '';
  var canDelete = !isNew && S.D.me.isAdmin && DELETE_FN[key];
  var extra = '';
  if (key === 'device' && !isNew) {
    extra = '<div class="row"><button type="button" class="btn small" data-act="recordFor" data-key="activity" data-device="' + esc(id) + '">この機器の対応を記録</button>' +
      '<button type="button" class="btn small" data-act="recordFor" data-key="repair" data-device="' + esc(id) + '">修理を受け付け</button>' +
      (S.D.me.isAdmin ? '<button type="button" class="btn small" data-act="moveDevice" data-id="' + esc(id) + '">別の顧客へ移す</button>' : '') + '</div>' +
      '<div class="box" id="diagBox">' + diagBoxInner(id) + '</div>';
  }
  if (key === 'license' && S.D.canReveal) extra = licCredBoxHtml(isNew);
  // 同じ種類（同じ記録）の入力しかけが残っていたら、窓の上で知らせる
  var offer = draftOpening ? null : draftsAll().filter(function (d) { return d.key === key && d.id === (id || ''); })[0];
  var offerHtml = offer ? '<div class="draft-offer"><span class="t">入力しかけの内容があります（' + esc(draftWhen(offer)) + '）</span>' +
    '<button type="button" class="btn small primary" data-act="draftOpen" data-draft="' + esc(offer.did) + '">続きから</button>' +
    '<button type="button" class="btn small" data-act="draftDrop" data-draft="' + esc(offer.did) + '">捨てる</button></div>' : '';
  var wrap = openModal(
    '<header><h2>' + esc(schema.label) + (isNew ? 'を追加' : 'を編集') + (id ? ' <span class="sub">' + esc(id) + '</span>' : '') + '</h2>' +
    '<button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
    '<form data-form="' + key + '" data-id="' + esc(id) + '" data-lock="' + (preset && preset.lockCustomer ? '1' : '') + '" data-lockr="' + (preset && preset.lockRental ? '1' : '') +
    '" data-base="' + esc(rec && rec['更新日時'] ? rec['更新日時'] : '') + '" novalidate>' +
    '<div class="body"><p class="msg" hidden></p>' + offerHtml + html + extra + (PHOTO_LABEL[key] && S.D.photoKinds.indexOf(key) !== -1 ? photoBoxHtml(key, id) : '') +
    (rec && rec['更新日時'] ? '<p class="note">最後の更新：' + esc(rec['更新日時']) + '</p>' : '') + '</div>' +
    '<footer>' + (canDelete ? '<button type="button" class="btn danger" data-act="deleteRecord" data-key="' + key + '" data-id="' + esc(id) + '">削除</button>' : '') +
    '<span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button>' +
    (key === 'device' && isNew ? '<button type="button" class="btn" data-act="saveNext">保存して次の機器</button>' : '') +
    '<button type="submit" class="btn primary">保存</button></footer></form>');
  var form = wrap.querySelector('form');
  var custEl = form.elements['顧客ID'];
  Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.cid = custEl ? custEl.value : ''; });
  refreshDependents(form);
  initPhotos(form, key, id);
  form._initial = formSnapshot(form);     // 開いたときの中身（ここから変わっていたら「入力の途中」）
  if (key === 'license' && S.D.canReveal && !isNew) loadLicCred(form, id, rec['顧客ID']);
  return wrap;
}

// ---- ライセンスの ID・パスワード・シリアルキー（v0.15.0）。入れ先は「認証情報」（対象区分＝ライセンス）
//   パスワードとシリアルキーは、画面に読み込まない（空のままなら今のまま）。下書きにも残さない。
var LIC_CRED = [['loginId', 'ログインID', 'text'], ['password', 'パスワード', 'password'], ['serialKey', 'シリアルキー', 'password']];
function licCredBoxHtml(isNew) {
  return '<div class="box credbox" id="licCredBox"><b>ID・パスワード</b> <span class="note">「認証情報」に入ります。パスワードは保存のあと「認証情報」のタブで表示できます。</span>' +
    '<div class="grid2">' + LIC_CRED.map(function (c) {
      return '<div class="field"><label for="lc_' + c[0] + '">' + c[1] + '</label><input type="text" id="lc_' + c[0] + '" data-cred="' + c[0] + '" data-orig="" autocomplete="off"' + (c[2] === 'password' ? ' class="secret"' : '') + ' maxlength="' + (c[0] === 'serialKey' ? 300 : 200) + '"' +
        (isNew ? '' : ' disabled') + '></div>';
    }).join('') + '</div><p class="note" id="licCredNote">' + (isNew ? '' : '読み込んでいます…') + '</p></div>';
}
function loadLicCred(form, licenseId, customerId) {
  call('listCredentials', { customerId: customerId, audit: false }, true).then(function (r) {
    if (!form.isConnected) return;
    var all = r.credentials.filter(function (c) { return c['対象区分'] === 'ライセンス' && c['対象ID'] === licenseId; });
    var c = all[0] || null;
    var inputs = form.querySelectorAll('[data-cred]');

      : { '顧客ID': d['顧客ID'], '機器ID': id, '実施日': S.D.today, '種別': S.D.maintKindRegular, '内容': note, '担当スタッフ': S.D.me.name };

    upsert(S.D.maintenances, '実施ID', prov);

    else if (to === 'lastmonth') p.month = addMonths(today.slice(0, 7), -1);
    else if (to === 'd30') { p.from = addDays(today, -29); p.to = today; }
    else if (to === 'd90') { p.from = addDays(today, -89); p.to = today; }

  },
  deleteRecord: function (el) {
    var key = el.dataset.key, id = el.dataset.id, schema = S.D.schema[key];
    confirmDialog(schema.label + 'を削除', id + ' を削除します。元には戻せません。\n（削除した内容は、変更履歴シートに残ります）', '削除する', true).then(function (yes) {
      if (!yes) return;
      var idField = schema.idField;
      if (key === 'credential') {
        // 認証情報は、返事を待ってから消す
        call(DELETE_FN[key], { id: id }).then(function () {
          if (S.creds) S.creds.list = S.creds.list.filter(function (c) { return c[idField] !== id; });
          closeModal(el); toast('削除しました'); S.alertsStale = true; render();
        }).catch(failToast);
        return;
      }
      // ---- 先に画面から消す。サーバーでだめだったら、元の場所に戻す
      var listNow = function () { return S.D[COLLECTION[key]]; };
      var list = listNow();
      var at = -1, rec = null;
      for (var i = 0; i < list.length; i++) if (list[i][idField] === id) { at = i; rec = list[i]; break; }
      var kept = { custActs: [], allocations: null };
      if (at !== -1) list.splice(at, 1);
      if (key === 'activity') {
        S.D.activityTotal -= 1;
        Object.keys(S.custActs).forEach(function (c) {
          var l = S.custActs[c];
          for (var j = l.length - 1; j >= 0; j--) if (l[j][idField] === id) kept.custActs.push([c, j, l.splice(j, 1)[0]]);
        });
      }
      if (key === 'license') { kept.allocations = S.D.allocations; S.D.allocations = S.D.allocations.filter(function (a) { return a['ライセンスID'] !== id; }); }
      reindex();
      // 削除する記録の窓は、下書きに残さない（その記録の下書きがあれば、それも消す）
      var dwrap = el.closest('.overlay');
      if (dwrap) dwrap._noDraft = true;
      draftsAll().forEach(function (d) { if (d.key === key && d.id === id) draftDropId(d.did); });
      closeModal(el);
      render();
      call(DELETE_FN[key], { id: id }).then(function (r) {
        if (!S.D) return;
        if (key === 'activity') {
          S.actRange = {};
          (r.clearedRepairIds || []).forEach(function (rid) { var rep = findRecord('repair', rid); if (rep) rep['元の対応ID'] = ''; });
        }
        S.alertsStale = true;
        if (PHOTO_LABEL[key]) { if (photoCount(key, id)) S.files = null; delete S.D.photoCounts[photoCountKey(key, id)]; }
        toast('削除しました');
        softRender();
      }).catch(function (e) {
        if (!S.D) return;
        if (rec && at !== -1 && !listNow().some(function (r) { return r[idField] === id; })) listNow().splice(Math.min(at, listNow().length), 0, rec);
        if (key === 'activity') {
          S.D.activityTotal += 1;
          kept.custActs.forEach(function (k) { if (S.custActs[k[0]]) S.custActs[k[0]].splice(Math.min(k[1], S.custActs[k[0]].length), 0, k[2]); });
        }
        if (kept.allocations) S.D.allocations = kept.allocations;
        reindex();
        softRender();
        if (e && e.error === 'unauthorized') return;
        toast('削除できませんでした。' + ((e && e.message) || ''), true);
      });
    });
  },

};

document.addEventListener('click', function (e) {
  var chip = e.target.closest('[data-chip]');
  if (chip) {
    var set = chip.closest('.chipset'), cform = chip.closest('form');
    var hidden = cform.elements[set.dataset.chips];
    var on = chip.getAttribute('aria-pressed') === 'true';
    clearFormMsg(cform);
    if (on && set.dataset.required) return;          // 必須の項目は、選び直しだけ（外せない）
    hidden.value = on ? '' : chip.dataset.chip;
    Array.prototype.forEach.call(set.querySelectorAll('[data-chip]'), function (b) { b.setAttribute('aria-pressed', String(!on && b === chip)); });
    if (set.dataset.chips === '対象区分') {
      Array.prototype.forEach.call(cform.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
      refreshDependents(cform);
    }
    return;
  }
  var pick = e.target.closest('[data-pick]');
  if (pick) {
    var picker = pick.closest('.picker'), pform = pick.closest('form');
    picker.querySelector('input[type="hidden"]').value = pick.dataset.pick;
    picker.querySelector('.picked b').textContent = custName(pick.dataset.pick);
    picker.querySelector('.picked').hidden = false;
    picker.querySelector('.pick-search').hidden = true;
    clearFormMsg(pform);
    Array.prototype.forEach.call(pform.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
    refreshDependents(pform);
    var nextEl = pform.querySelector('select[data-dep]:not(:disabled), [data-chip], textarea');
    if (nextEl) nextEl.focus();
    return;
  }
  var tok = e.target.closest('[data-token]');
  if (tok) {
    var sug = tok.closest('.suggest');
    var inputEl = tok.closest('form').elements[sug.dataset.suggest];
    var list = splitTokens(inputEl.value), at = list.indexOf(tok.dataset.token);
    if (at === -1) list.push(tok.dataset.token); else list.splice(at, 1);
    inputEl.value = list.join('、');
    tok.setAttribute('aria-pressed', String(at === -1));
    return;
  }
  // 行の中のリンク（「開く」など）を押したときは、行を押した扱いにしない
  var anchor = e.target.closest('a[href]');
  if (anchor && !anchor.dataset.act) return;
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var parts = el.dataset.act.split(':');
  var fn = ACT[parts[0]];
  if (fn) fn(el, parts[1]);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('modals').children.length) { closeModal(null); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.click')) e.target.click();
  // レイアウト図：選んだ図形を、キーで消す・少し動かす。Ctrl+A で全部を選ぶ（文字を打っている間は効かせない）
  if (L && L.edit && L.data && !$('modals').children.length && !(e.target.matches && e.target.matches('input, textarea, select'))) {
    var move = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault();
      L.sels = L.data.elements.map(function (x, i) { return i; }); L.pt = -1;
      drawLayoutBox();
    } else if (e.key === 'Escape' && L.sels.length) { ACT.layoutSelectNone(); }
    else if (L.sels.length && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); ACT.layoutRemove(); }
    else if (L.sels.length && move) {
      e.preventDefault();
      var picked = L.sels.map(function (i) { return L.data.elements[i]; });
      var origs = picked.map(layClone);
      var wasSnap = L.snap; L.snap = true;            // キーは、いつも1マスずつ
      var m = layGroupDelta(origs, move[0], move[1]);
      L.snap = wasSnap;
      if (!m[0] && !m[1]) return;
      layoutPushUndo();
      picked.forEach(function (x, n) { layShift(x, origs[n], m[0], m[1]); });
      layoutChanged();
    }
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.picksearch) {
    e.preventDefault();
    var only = e.target.parentNode.querySelectorAll('[data-pick]');
    if (only.length === 1) only[0].click();   // 候補が1件に絞れていたら、それを選ぶ
  }
});

// 絞り込み
function clearFormMsg(form) {
  var m = form && form.dataset && form.dataset.form ? form.querySelector('.msg') : null;
  if (m) m.hidden = true;
}
function onFilter(e) {
  var t = e.target;
  if (t.dataset && t.dataset.q) {
    // 同じ値なら作り直さない。入力欄からカーソルが外れたときの change で一覧を作り直すと、
    // そのとき押していた行が差し替わって、1回目のクリックが効かなくなる
    if (q(t.dataset.q, null) === t.value) return;
    S.q[t.dataset.q] = t.value; refreshList(); return;
  }
  if (t.dataset && (t.dataset.permonth || t.dataset.perfrom || t.dataset.perto)) {
    if (e.type !== 'change') return;                 // 打っている途中では動かさない
    var per = perState(t.dataset.permonth || t.dataset.perfrom || t.dataset.perto);
    if (t.dataset.permonth) { if (/^\d{4}-\d{2}$/.test(t.value)) per.month = t.value; }
    else if (isYmd(t.value)) { if (t.dataset.perfrom) per.from = t.value; else per.to = t.value; }
    render();
    return;
  }
  if (t.dataset && t.dataset.layprop && L.data && L.data.elements[L.sel]) {
    if (L.textUndo !== L.sel) { layoutPushUndo(); L.textUndo = L.sel; }   // 1つの図形の文字を打っている間は、元に戻す1回ぶん
    L.data.elements[L.sel].text = t.value;
    if (!L.dirty) { L.dirty = true; var saveBtn = document.querySelector('[data-act="layoutSave"]'); if (saveBtn) saveBtn.disabled = false; }
    drawLayoutCanvas();
    return;
  }
  if (t.dataset && t.dataset.reportnote) {
    S.reportNote = t.value;
    var sheet = $('reportSheet');
    if (sheet && S.report && S.report.data) sheet.innerHTML = reportHtml(S.report.data, S.reportNote);
    return;
  }
  if (e.type === 'input') clearFormMsg(t.form);
  if (t.dataset && t.dataset.picksearch) {
    t.parentNode.querySelector('.pick-list').innerHTML = pickListHtml(t.value);
    return;
  }
  if (t.name === '預かり品' && t.form) {
    var tokens = splitTokens(t.value);
    Array.prototype.forEach.call(t.form.querySelectorAll('.suggest[data-suggest="預かり品"] [data-token]'), function (b) {
      b.setAttribute('aria-pressed', String(tokens.indexOf(b.dataset.token) !== -1));
    });
  }
}
document.addEventListener('input', onFilter);
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.dataset && t.dataset.homeq) { S.homeQ = t.value; drawHomeHits(); }
  if (t && t.dataset && t.dataset.pq) { var pst = pState(t.dataset.pq); pst.q = t.value; pst.n = P_STEP; pDraw(t.dataset.pq); }
  if (t && t.dataset && t.dataset.mtgmemo) mtgState().memos[mtgMemoKey()] = t.value;
  if (t && t.dataset && t.dataset.mmq) { S.mm.q = t.value; var box = $('mmCustList'); if (box) box.innerHTML = mmCustListHtml(); }
  if (t && t.dataset && t.dataset.mmnote) S.mm.notes[t.dataset.mmnote] = t.value;
});
// 入力の途中の内容を、端末に下書きとして残す（打つ・選ぶ・押すのあと、少し待ってから）
['input', 'change', 'click'].forEach(function (type) {
  document.addEventListener(type, function (e) {
    var form = e.target && e.target.closest ? e.target.closest('form[data-form]') : null;
    if (form) draftLater(form);
  });
});
// ページが隠れる・閉じられる前に、待っている下書きをすぐ書く（スマホは、ほかのアプリに切り替えるとページが捨てられることがある）
window.addEventListener('pagehide', draftFlush);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') draftFlush(); });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset && (t.dataset.q || t.dataset.permonth || t.dataset.perfrom || t.dataset.perto)) { onFilter(e); return; }
  if (t.dataset && t.dataset.optcat) { S.optCat = t.value; render(); return; }
  if (t.dataset && t.dataset.photofile) { onPhotoFiles(t); return; }
  if (t.dataset && t.dataset.scanfile) { var sf = t.files && t.files[0]; t.value = ''; scanUseFile(sf); return; }
  if (t.id === 'logoFile') {
    var logoFile = t.files && t.files[0];
    t.value = '';
    if (!logoFile) return;
    shrinkLogo(logoFile).then(function (dataUrl) { return call('saveLogo', { dataUrl: dataUrl }); }).then(function (r) {
      S.D.logo = r.logo; showBrand(); toast('ロゴを入れました'); render();
    }).catch(failToast);
    return;
  }
  if (t.id === 'layImage') {
    var file = t.files && t.files[0];
    if (!file) return;
    if (['image/png', 'image/jpeg', 'image/gif', 'image/webp'].indexOf(file.type) === -1) { toast('背景に使える画像は PNG・JPEG・GIF・WebP です。', true); return; }
    if (file.size > S.D.layoutImageMaxBytes) { toast('画像が大きすぎます。' + Math.floor(S.D.layoutImageMaxBytes / 1024 / 1024) + 'MBまでにしてください。', true); return; }
    var layoutId = L.id;
    readFileBase64(file).then(function (base64) { return call('saveLayoutImage', { layoutId: layoutId, mimeType: file.type, base64: base64 }); }).then(function (r) {
      if (L.id !== layoutId) return;
      L.data.imageBase64 = r.imageBase64; L.data.imageMimeType = r.imageMimeType; L.data.imageMissing = false;
      var cur = L.list.filter(function (l) { return l['レイアウトID'] === layoutId; })[0]; if (cur) cur.hasImage = true;
      toast('背景の画像を入れました'); drawLayoutBox(); measureLayoutImage();
    }).catch(failToast);
    return;
  }
  if (t.dataset && t.dataset.reportmonth) {
    if (/^\d{4}-\d{2}$/.test(t.value) && t.value <= S.D.today.slice(0, 7)) { S.reportMonth = t.value; $('reportBox').innerHTML = reportBoxHtml(); loadReport(); }
    return;
  }
  var form = t.form;
  if (form && form.dataset.form && S.D.schema[form.dataset.form]) {
    if (t.dataset.dep) t.dataset.touched = '1';
    if (t.name === '対象区分') {
      Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
      refreshDependents(form);
    }
    // 修理：機器を選んだら、空いている型番とシリアルを台帳から入れる
    if (t.name === '機器ID' && form.dataset.form === 'repair' && IDX.dev[t.value]) {
      var picked = IDX.dev[t.value];
      if (form.elements['型番'] && !form.elements['型番'].value) form.elements['型番'].value = picked['機種名'] || '';
      if (form.elements['シリアル'] && !form.elements['シリアル'].value) form.elements['シリアル'].value = picked['シリアル'] || '';
    }
  }
});

document.addEventListener('submit', function (e) {
  var form = e.target;
  if (form.id === 'loginForm') return;
  e.preventDefault();
  if (form.classList.contains('settings-form')) {
    var values = {};
    Array.prototype.forEach.call(form.querySelectorAll('[data-setting]'), function (el) { values[el.dataset.setting] = el.value; });
    var catBoxes = form.querySelectorAll('input[data-alertcat]');
    if (catBoxes.length) values['要対応に出さない種類'] = Array.prototype.filter.call(catBoxes, function (x) { return !x.checked; }).map(function (x) { return x.dataset.alertcat; }).join(',');
    call('saveSettings', { values: values }).then(function (r) {
      var D = S.D;
      D.settings = r.settings;
      D.licenseWarnDays = Number(r.settings['ライセンス期限の手前日数']);
      D.warrantyWarnDays = Number(r.settings['保証期限の手前日数']);
      D.canReveal = D.me.isAdmin || r.settings['スタッフに認証情報を見せる'] !== 'いいえ';
      showBrand();
      D.rentalOn = r.settings['レンタル機器を使う'] !== 'いいえ';
      D.repairLongDays = Number(r.settings['修理の長期化の日数']) || 0;
      if (!D.me.startView) D.startView = START_KEY[r.settings['開いた直後の画面']] ? r.settings['開いた直後の画面'] : D.startViews[0];
      S.alertsStale = true; S.files = null;
      // 配信フォルダーを入れた・変えたときは、すぐ確かめにいく
      var feedWas = D.feed && D.feed.on;
      D.feed = { on: !!r.settings['配信フォルダー'], status: D.feed ? D.feed.status : null, hours: (function (h) { h = parseInt(h, 10); return h >= 1 && h <= 6 ? h : 6; })(r.settings['配信を確かめる間隔（時間）']) };
      toast(form.dataset.done); render();
      if (D.feed.on && (!feedWas || form.id === 'settingsForm')) checkFeed(false);
    }).catch(failToast);
    return;
  }
  if (form.id === 'releaseForm') {
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    call('saveToolRelease', { file: $('relFile').value, version: $('relVersion').value, notes: $('relNotes').value }).then(function (r) {
      S.release = r.release || null; if (r.release) toast('v' + r.release.version + ' を登録しました');
      var box = $('releaseBox'); if (box) box.innerHTML = releaseHtml();
    }).catch(function (e) { btn.disabled = false; failToast(e); });
    return;
  }
  if (form.id === 'optionForm') {
    var value = $('optValue').value;
    call('addOption', { category: S.optCat || S.D.optionCategories[0], value: value }).then(function (r) {
      S.D.options = r.options; toast('足しました'); render();
    }).catch(failToast);
    return;
  }
  var kind = form.dataset.form;
  var msg = form.querySelector('.msg');
  var showErr = function (err) { if (err && err.error === 'unauthorized') return; msg.textContent = (err && err.message) || 'うまくいきませんでした。'; msg.hidden = false; };
  if (kind === 'staff') {
    var isNew = form.dataset.new === '1';
    var data = { 'スタッフID': form.elements['スタッフID'].value, '表示名': form.elements['表示名'].value, '権限': form.elements['権限'].value, '有効': form.elements['有効'].value };
    call('saveStaff', { isNew: isNew, data: data }).then(function (r) {
      closeModal(form);
      if (S.staff) upsert(S.staff, 'スタッフID', r.staff);
      S.D.staffNames = (S.staff || []).filter(function (s) { return s['有効'] === 'はい'; }).map(function (s) { return s['表示名']; });
      render();
      if (r.tempPassword) tempPasswordDialog(r.staff['スタッフID'], r.tempPassword); else toast('保存しました');
    }).catch(showErr);
    return;
  }
  if (kind === 'printcustomer') {
    var popt = {};
    ['info', 'devices', 'licenses', 'layouts', 'gone', 'notes'].forEach(function (n) { popt[n] = form.querySelector('[name="' + n + '"]').checked; });
    if (!popt.info && !popt.devices && !popt.licenses && !popt.layouts) { showErr({ message: '印刷するものを、1つは選んでください。' }); return; }
    var pid = S.customerId;
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    (popt.layouts ? loadLayoutsForPrint(pid) : Promise.resolve([])).then(function (layouts) {
      if (S.customerId !== pid || !IDX.cust[pid]) return;
      if (popt.layouts && !layouts.length && !popt.info && !popt.devices && !popt.licenses) { submitBtn.disabled = false; showErr({ message: 'この顧客には、レイアウト図がまだありません。' }); return; }
      closeModal(form);
      printHtml(customerPrintHtml(pid, popt, layouts));
    }).catch(function (e) { submitBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'wininfopaste') {
    var pasteBtn = form.querySelector('button[type="submit"]');
    if (pasteBtn.disabled) return;
    pasteBtn.disabled = true;
    // 送った時点の行（返事の行番号は、これに対するもの）
    var lines = $('wi_text').value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l && l.charAt(0) !== '#'; });
    call('importWinInfo', { text: lines.join('\n') }).then(function (r) {
      pasteBtn.disabled = false;
      S.D.wininfo = r.wininfo;
      if (r.errors.length) {
        // 読めなかった行だけを残して、理由を出す（直して、もう一度「登録する」）
        $('wi_text').value = r.errors.map(function (e) { return lines[e.line - 1] || ''; }).join('\n');
        showErr({ message: r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : '') + '。読めなかった ' + r.errors.length + '行を残しています：' + r.errors.map(function (e) { return e.message; }).filter(function (m, i, all) { return all.indexOf(m) === i; }).join(' ／ ') });
        S.renderPending = true;
        return;
      }
      closeModal(form);
      toast(r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : ''));
      render();
    }).catch(function (e) { pasteBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'myprefs') {
    call('saveMyStartView', { startView: $('my_start').value }).then(function (r) {
      var D = S.D;
      D.me.startView = r.startView;
      D.startView = r.startView || (START_KEY[D.settings['開いた直後の画面']] ? D.settings['開いた直後の画面'] : D.startViews[0]);
      closeModal(form); toast('保存しました。次に開いたときは「' + D.startView + '」から始まります');
    }).catch(showErr);
    return;
  }
  if (kind === 'password') {
    if ($('pw_new').value !== $('pw_new2').value) { showErr({ message: '新しいパスワードが2回で違っています。' }); return; }
    call('changeMyPassword', { current: $('pw_cur').value, next: $('pw_new').value, remember: rememberNow(), ticket: S.ticket || '' }).then(function (r) {
      if (r && r.resume) { urlTicketWrite(r.resume); ticketAt = Date.now(); }
      closeModal(form); toast('パスワードを変更しました');
    }).catch(showErr);
    return;
  }
  if (S.D && S.D.schema[kind]) submitRecordForm(form, false);
});

// ===========================================================================
// 起動
// ===========================================================================
(function start() {
  showBrand();
  var saved = '';
  try { saved = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { saved = ''; }
  fillLoginForm();
  if (/^[0-9a-f]{64}$/.test(saved)) {
    // セッションが切れていたら、call() の中で自動ログイン（覚えてあれば）かログイン画面に進む
    // URLの券を先に読んでから始める（読む前に終わってログイン画面になると、古い券が残るため）
    urlTicketRead(function (t) {
      S.ticket = t;
      boot(saved).catch(function () { if (!autoBusy && !resumeBusy) toLogin(''); });
    });
  } else {
    // 画面の中の保存が使えない・消えていたら、URLの券で戻す（v0.19.0）
    urlTicketRead(function (ticket) {
      if (ticket) { resumeFromTicket(ticket); return; }
      if (!autoLogin()) { toLogin(''); ($('loginId').value ? $('loginPw') : $('loginId')).focus(); }
    });
  }
})();
</script>
