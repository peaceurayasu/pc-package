<script>
'use strict';
var FILE_VERSION_ADMINMODALS = '@file-version 0.135.0';   // このファイルの版（差し替え漏れの確かめ。GAS はコメントを消すので、文字で持つ。v0.111.1）
// ===========================================================================
// 重ねる窓
// ===========================================================================
function openModal(html, narrow, sheet) {
  var wrap = document.createElement('div');
  wrap.className = 'overlay' + (sheet ? ' sheet' : '');
  wrap.innerHTML = '<div class="dialog' + (narrow ? ' narrow' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  $('modals').appendChild(wrap);
  // スマホでは、開いた瞬間にキーボードを出さない（候補やボタンが隠れるので）。押したところから打ち始める
  var first = wrap.querySelector(isPhone() ? 'button.primary' : 'input:not([type="hidden"]):not(:disabled), select:not(:disabled), textarea, button.primary');
  if (first && !isPhone()) first.focus();
  armBack();
  linkPreviewAll(wrap);
  setTimeout(function () { linkPreviewAll(wrap); }, 0);
  if (typeof addVoiceButtons === 'function') addVoiceButtons(wrap);
  return wrap;
}
/** 入力欄にリンクが入っているとき、欄の下に「押せるリンク」の見え方を出す（v0.103.0） */
function linkPreviewOne(el) {
  if (!el || !el.matches || !el.matches('textarea, input[type="text"]')) return;
  if (!el.closest('form') || LINK_SKIP_NAMES[el.name] || el.closest('[data-nolink]') || el.id === 'askInput' || el.id === 'linkLabel' || el.id === 'linkUrl') return;
  var has = /\]\(https?:\/\/|https?:\/\//.test(el.value);
  var prev = el.nextElementSibling && el.nextElementSibling.classList.contains('linkprev') ? el.nextElementSibling : null;
  if (!has) { if (prev) prev.remove(); return; }
  if (!prev) { prev = document.createElement('div'); prev.className = 'linkprev'; el.parentNode.insertBefore(prev, el.nextSibling); }
  prev.innerHTML = '<span class="minor">リンクの見え方：</span>' + linkify(el.value);
}
function linkPreviewAll(root) {
  var els = root.querySelectorAll('form textarea, form input[type="text"]');
  for (var i = 0; i < els.length; i++) linkPreviewOne(els[i]);
}
document.addEventListener('input', function (e) { linkPreviewOne(e.target); });
function closeModal(el) {
  var wrap = el && el.closest ? el.closest('.overlay') : null;
  if (!wrap) { var all = $('modals').children; wrap = all[all.length - 1]; }
  if (wrap && wrap.querySelector('form[data-form]')) { S.openRec = ''; saveLocSoon(); }
  if (wrap && wrap.classList.contains('scanwrap') && SCAN && SCAN.pages && SCAN.pages.length && !wrap._confirmed) { ACT.scanClose(); return; }   // 撮りためたページがあれば、確かめてから
  if (wrap && wrap.classList.contains('scanwrap')) closeScanner();     // カメラを止める
  if (wrap && wrap._blobUrl) { try { URL.revokeObjectURL(wrap._blobUrl); } catch (e) { /* そのまま */ } }
  if (wrap && VOICE.rec && VOICE.btn && wrap.contains(VOICE.btn)) voiceStop();   // 音声入力を止める（v0.117.0）
  if (wrap) {
    // 入力の途中で閉じたときは、下書きに残す（まちがって「やめる」や「戻る」を押しても、打ち直さなくてよいように）
    var dform = wrap.querySelector('form[data-form]');
    if (dform && !wrap._noDraft && S.D && S.D.schema[dform.dataset.form] && draftable(dform) && formDirty(dform)) {
      draftPut(dform);
      if (dform._draftId && draftById(dform._draftId)) {
        toast('下書きに残しました（上の「続きから」で戻せます' + (dform._photos && dform._photos.length ? '。添付ファイルは残りません' : '') + '）');
        S.renderPending = true;
      }
    }
    wrap.remove();
  }
  // 窓を開いている間に届いたデータは、閉じたときに画面へ出す
  if (S.renderPending && S.D && !$('modals').children.length) render();
}
function confirmDialog(title, message, okLabel, danger, noLabel) {
  return new Promise(function (resolve) {
    var wrap = openModal('<header><h2>' + esc(title) + '</h2></header><div class="body"><p style="margin:0;white-space:pre-wrap">' + esc(message) + '</p></div>' +
      '<footer><span class="grow"></span><button type="button" class="btn" data-answer="no">' + esc(noLabel || 'やめる') + '</button><button type="button" class="btn ' + (danger ? 'danger' : 'primary') + '" data-answer="yes">' + esc(okLabel) + '</button></footer>', true, true);
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-answer]');
      if (!b) return;
      wrap.remove();
      resolve(b.dataset.answer === 'yes');
      // 窓を開いている間に届いたデータは、閉じたときに画面へ出す（closeModal と同じ）
      setTimeout(function () { if (S.renderPending && S.D && !$('modals').children.length) render(); }, 0);
    });
  });
}
function infoDialog(title, bodyHtml) {
  openModal('<header><h2>' + esc(title) + '</h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header><div class="body">' + bodyHtml + '</div>' +
    '<footer><span class="grow"></span><button type="button" class="btn primary" data-act="closeModal">閉じる</button></footer>', true, true);
}


// ===========================================================================
// 印刷（ブラウザの印刷でPDFにする）。印刷するものを #printArea に写し、ほかは印刷のときだけ隠す
// ===========================================================================
function printHtml(html, opt) {
  opt = opt || {};
  // v0.127.2：bare のときは、上下の余白を「毎ページくり返す表の見出し・足」で取る（用紙の余白が0なので、
  //   2ページめ以降は上下の端まで印刷され、プリンターが刷れない端の項目が切れて見えなくなっていた）
  $('printArea').innerHTML = opt.bare
    ? '<table class="pbare"><thead><tr><td><div class="pbare-sp top"></div></td></tr></thead>' +
      '<tfoot><tr><td><div class="pbare-sp bot"></div></td></tr></tfoot><tbody><tr><td>' + html + '</td></tr></tbody></table>'
    : html;
  document.body.classList.add('printing');
  // v0.124.0：bare … 用紙の余白を0にして、ブラウザが上下に付ける日付・ページ名・URLを出さない（余白は中身の側で取る）
  var st = null, oldTitle = document.title;
  if (opt.bare) {
    st = document.createElement('style'); st.id = 'printBare';
    st.textContent = '@page { size: A4 portrait; margin: 0; } @media print { #printArea { padding: 0 14mm; } html, body { background: #fff !important; } }';
    document.head.appendChild(st);
    document.body.classList.add('printbare');
  }
  if (opt.title) { try { document.title = opt.title; } catch (e) { /* そのまま */ } }
  var done = function () {
    document.body.classList.remove('printing');
    document.body.classList.remove('printbare');
    if (st && st.parentNode) st.parentNode.removeChild(st);
    if (opt.title) { try { document.title = oldTitle; } catch (e) { /* そのまま */ } }
    $('printArea').innerHTML = '';
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  window.print();
}

// ---- 顧客ごとの印刷（会社の情報・機器の一覧・ライセンス・レイアウト図）
//   認証情報（ID・パスワード）は入れない。備考は、選んだときだけ入れる（社内用）。
/** 印刷用の表。どの行も空の列は出さない（No. は残す）。tight に入れた見出しの列は折り返さない */
function ptableHtml(headers, rows, tight, loose) {
  var keep = headers.map(function (h, i) { return i === 0 || rows.some(function (r) { return r[i] !== '' && r[i] !== null && r[i] !== undefined; }); });
  // nw … 折り返さない列（日付・種類など短いもの）。brk … 文字の途中でも折り返してよい列（シリアルなど、空白の無い長い文字）
  var cls = function (i) { return tight && tight.indexOf(headers[i]) !== -1 ? ' class="nw"' : loose && loose.indexOf(headers[i]) !== -1 ? ' class="brk"' : ''; };
  return '<table class="ptable"><thead><tr>' + headers.map(function (h, i) { return keep[i] ? '<th>' + esc(h) + '</th>' : ''; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + r.map(function (v, i) { return keep[i] ? '<td' + cls(i) + '>' + esc(v) + '</td>' : ''; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
}
/**
 * 印刷する中身を作る。
 * opt: {info, devices, licenses, notes（備考も入れる）, gone（廃棄した機器も入れる）}、layouts: [{name, data, ratio}]
 */
function customerPrintHtml(customerId, opt, layouts) {
  var D = S.D, c = IDX.cust[customerId];
  var mine = function (r) { return r['顧客ID'] === customerId; };
  var html = '<h1 class="ptitle">' + printLogoHtml() + esc(c['顧客名']) + ' 様　<small>' + esc(D.settings['自社名']) + '　' + esc(D.today) + ' 時点</small></h1>';
  if (opt.info) {
    var rows = [['ふりがな', c['ふりがな']], ['住所', [c['郵便番号'] ? '〒' + c['郵便番号'] : '', c['住所']].filter(function (x) { return x; }).join(' ')], ['電話', c['電話']], ['メール', c['メール']],
      ['ご担当者', c['先方担当者']], ['保守契約', c['保守契約']], ['最後の保守', IDX.lastMaint[customerId] || '']];
    if (opt.notes) rows.push(['備考', c['備考']]);
    html += '<section class="psec" id="pInfo"><h2>会社の情報</h2><table class="ptable pinfo"><tbody>' +
      rows.filter(function (r) { return r[1]; }).map(function (r) { return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></section>';
  }
  if (opt.devices) {
    var devs = D.devices.filter(mine).filter(function (d) { return opt.gone || d['状況'] !== '廃棄'; })
      .sort(function (a, b) { return cmp(a['設置場所'], b['設置場所']) || cmp(a['部署'], b['部署']) || cmp(a['ふりがな'] || a['利用者'], b['ふりがな'] || b['利用者']) || cmp(a['機器ID'], b['機器ID']); });
    var kinds = {};
    devs.forEach(function (d) { var k = d['種類'] || '（種類なし）'; kinds[k] = (kinds[k] || 0) + 1; });
    var head = ['No.', '利用者', '部署', '設置場所', '種類', 'メーカー・機種', 'シリアル', 'コンピューター名', 'OS', 'キッティング日／購入日', '保証期限', '状況'];
    if (opt.notes) head.push('備考');
    html += '<section class="psec" id="pDevices"><h2>機器の一覧　' + devs.length + '台' +
      (devs.length ? '<small>（' + Object.keys(kinds).sort(function (a, b) { return kinds[b] - kinds[a]; }).map(function (k) { return esc(k) + ' ' + kinds[k]; }).join('、') + '）</small>' : '') + '</h2>' +
      (devs.length ? ptableHtml(head, devs.map(function (d, i) {
        var g = IDX.diag[d['機器ID']] || {};
        var row = [i + 1, d['利用者'], d['部署'], d['設置場所'], d['種類'], [d['メーカー'], d['機種名']].filter(function (x) { return x; }).join(' '), d['シリアル'], g['コンピューター名'] || '', String(g['OS'] || '').replace(/^Microsoft\s+/i, ''), d['購入日'], d['保証期限'], d['状況']];
        if (opt.notes) row.push(d['備考']);
        return row;
      }), ['No.', '種類', 'OS', 'キッティング日／購入日', '保証期限', '状況'], ['シリアル', 'コンピューター名']) : '<p class="pnote">機器は登録されていません。</p>') + '</section>';
  }
  if (opt.licenses) {
    var lics = D.licenses.filter(mine).sort(function (a, b) { return cmp(a['製品名'], b['製品名']) || cmp(a['有効期限'], b['有効期限']); });
    var lhead = ['No.', '製品名', '契約期間', '数量', '割当', '有効期限', '使っている機器'];
    if (opt.notes) lhead.push('備考');
    html += '<section class="psec" id="pLicenses"><h2>ライセンス　' + lics.length + '件</h2>' +
      (lics.length ? ptableHtml(lhead, lics.map(function (l, i) {
        var al = IDX.alloc[l['ライセンスID']] || [];
        var n = daysUntil(l['有効期限']);
        var row = [i + 1, l['製品名'], l['契約期間'], l['数量'], al.length, l['有効期限'] ? l['有効期限'] + (n !== null && n < 0 ? '（期限切れ）' : '') : '', al.map(function (a) { return devLabel(a['機器ID']); }).join('、')];
        if (opt.notes) row.push(l['備考']);
        return row;
      }), ['No.', '数量', '割当', '有効期限']) : '<p class="pnote">ライセンスは登録されていません。</p>') + '</section>';
  }
  (layouts || []).forEach(function (l, i) {
    html += '<section class="psec play" id="pLayout' + i + '"><h2>レイアウト図　' + esc(l.name) + '</h2>' +
      layoutCanvasHtml(l.data, { edit: false, sels: [], ratio: l.ratio, id: 'layPrint' + i }) + '</section>';
  });
  return '<div class="cprint">' + html + '</div>';
}
/** レイアウト図を全部読む（背景の画像の縦横比も測る）。→ [{name, data, ratio}] */
function loadLayoutsForPrint(customerId) {
  return call('listLayouts', { customerId: customerId }).then(function (r) {
    var out = [];
    return r.layouts.reduce(function (chain, l) {
      return chain.then(function () { return call('getLayout', { layoutId: l['レイアウトID'] }); }).then(function (res) {
        var data = res.layout;
        return new Promise(function (resolve) {
          var push = function (ratio) { out.push({ name: l['名前'], data: data, ratio: ratio }); resolve(); };
          if (!data.imageBase64) { push(4 / 3); return; }
          var img = new Image();
          img.onload = function () { push(img.naturalWidth && img.naturalHeight ? Math.min(4, Math.max(0.4, img.naturalWidth / img.naturalHeight)) : 4 / 3); };
          img.onerror = function () { push(4 / 3); };
          img.src = 'data:' + data.imageMimeType + ';base64,' + data.imageBase64;
        });
      });
    }, Promise.resolve()).then(function () { return out; });
  });
}

function fileSizeText(n) {
  if (typeof n !== 'number') return '';
  return n >= 1024 * 1024 ? (Math.round(n / 1024 / 1024 * 10) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}
function loadAttachments() {
  var id = S.customerId;
  if (S.files && S.files.customerId === id) return;
  S.files = null;
  call('listAttachments', { customerId: id }).then(function (r) {
    S.files = { customerId: id, list: r.attachments, shared: r.shared };
    var el = $('filesBox');
    if (el && S.customerId === id) el.innerHTML = filesBoxHtml();
  }).catch(failToast);
}
function filesBoxHtml() {
  var f = S.files;
  if (!f || f.customerId !== S.customerId) return '<p class="empty">読み込んでいます…</p>';
  return '<div class="pad"><div class="filerow"><input type="file" id="attachFile" aria-label="添付するファイル" style="max-width:100%">' +
      '<button type="button" class="btn primary" data-act="uploadAttachment">添付する</button></div>' +
      '<p class="note" style="margin-top:6px">' + Math.floor(S.D.attachMaxBytes / 1024 / 1024) + 'MBまで。使える種類：' + esc(S.D.attachExtensions.join('・')) + '</p>' +
      (f.shared ? '' : '<p class="note">設定「添付をリンクで共有する」が「いいえ」なので、開けるのはドライブの権限がある人だけです。お客様ページには出せません。</p>') + '</div>' +
    tableHtml('cFiles', [
      { label: 'ファイル', cls: 'title strong', html: function (a) {
        if (a['対象区分'] === '収集レポート') return '<button type="button" class="link" data-act="openDiagReport" data-id="' + esc(a['添付ID']) + '">' + esc(a['ファイル名']) + '</button><span class="minor">収集ツールのレポート（' + esc(devLabel(a['対象ID']) || a['対象ID']) + '）</span>';
        return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a['ファイル名']) + '</a>' + (a['対象区分'] ? '<span class="minor">' + esc(a['対象区分'] + ' ' + a['対象ID']) + ' の添付' + '</span>' : ''); }, key: function (a) { return a['ファイル名']; } },
      { label: '大きさ', cls: 'nowrap', html: function (a) { return esc(fileSizeText(a['サイズ'])); } },
      { label: '登録', cls: 'nowrap', ml: '登録', html: function (a) { return esc(String(a['登録日時']).slice(0, 10)) + '<span class="minor">' + esc(a['登録者']) + '</span>'; }, key: function (a) { return a['登録日時']; } },
      { label: 'お客様ページ', cls: 'nowrap', html: function (a) {
        var on = a['お客様に見せる'] === 'はい';
        if (a['対象区分'] === '収集レポート') return pill('社内だけ');
        return (on ? pill('見せる', 'ok') : pill('見せない')) + (f.shared ? ' <button type="button" class="btn small" data-act="toggleAttachment" data-id="' + esc(a['添付ID']) + '" data-on="' + (on ? '1' : '') + '">' + (on ? '見せないにする' : '見せるにする') + '</button>' : '');
      } },
      { label: '', cls: 'nowrap', html: function (a) { return S.D.me.isAdmin || (a['対象区分'] && a['自分のもの']) ? '<button type="button" class="btn small danger" data-act="deleteAttachment" data-id="' + esc(a['添付ID']) + '">削除</button>' : ''; } }
    ], f.list, { empty: '添付はまだありません。' }) +
    '<p class="more">「見せる」にした添付は、顧客の「ポータル表示」で「資料」を選んでいると、お客様ページに出ます。</p>';
}
/** ロゴにする画像を、決めた大きさ（文字数）に収まるまで小さくする。透明なところは残す（PNG）。だめなら白地の JPEG */
function shrinkLogo(file) {
  return loadImageFile(file).then(function (img) {
    var sides = [360, 280, 220, 160, 120], i, url;
    for (i = 0; i < sides.length; i++) {
      url = drawImage(img, sides[i], 'image/png');
      if (safeImage(url) && url.length <= S.D.logoMaxChars) return url;
    }
    for (i = 0; i < sides.length; i++) {
      url = drawImage(img, sides[i], 'image/jpeg', 0.85, '#ffffff');
      if (safeImage(url) && url.length <= S.D.logoMaxChars) return url;
    }
    throw { message: 'この画像は、ロゴ用に小さくできませんでした。別の画像で試してください。' };
  });
}
/** ファイルを読み、Base64にして返す */
function readFileBase64(file) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { var str = String(fr.result); resolve(str.slice(str.indexOf(',') + 1)); };
    fr.onerror = function () { reject({ message: 'ファイルを読めませんでした。' }); };
    fr.readAsDataURL(file);
  });
}

// ===========================================================================
// 月次レポート
// ===========================================================================
function loadReport() {
  var id = S.customerId;
  if (!S.reportMonth) S.reportMonth = S.D.today.slice(0, 7);
  var month = S.reportMonth;
  if (S.report && S.report.customerId === id && S.report.month === month) return;
  S.report = null;
  call('getMonthlyReport', { customerId: id, month: month }).then(function (r) {
    S.report = { customerId: id, month: month, data: r.report, published: r.published || null, portal: !!r.portalReport };
    if (r.published) S.reportNote = r.published.note || '';      // 公開している月は、そのときのひとことにする（打っていたものは、公開していない月だけ残す）
    var ta = $('reportNote'); if (ta && S.customerId === id && S.reportMonth === month) ta.value = S.reportNote;
    var el = $('reportBox');
    if (el && S.customerId === id && S.reportMonth === month) el.innerHTML = reportBoxHtml();
  }).catch(function (e) {
    failToast(e);
    S.report = { customerId: id, month: month, data: null };
    var el = $('reportBox'); if (el) el.innerHTML = reportBoxHtml();
  });
}
function reportBoxHtml() {
  var head = '<div class="pad"><div class="row"><div class="field" style="flex:0 1 200px"><label for="reportMonth">月</label>' +
    '<input type="month" id="reportMonth" data-reportmonth="1" max="' + esc(S.D.today.slice(0, 7)) + '" value="' + esc(S.reportMonth || S.D.today.slice(0, 7)) + '"></div>' +
    '<button type="button" class="btn primary" data-act="printReport" style="align-self:flex-end">印刷・PDFにする</button></div>' +
    '<div class="field" style="margin-top:10px"><label for="reportNote">ひとこと（レポートの最後に入ります。お客様ページに出すときは一緒に残ります）</label>' +
    '<textarea id="reportNote" rows="2" data-reportnote="1" maxlength="' + (S.D.reportNoteMax || 300) + '">' + esc(S.reportNote) + '</textarea></div>' +
    '<p class="note" style="margin-top:6px">お客様に渡す用です。備考・社内メモ・認証情報・修理の内容は入りません。対応の内容はそのまま入るので、渡す前に目を通してください。</p></div>';
  var r = S.report;
  if (!r || r.customerId !== S.customerId || r.month !== S.reportMonth) return head + '<p class="empty">読み込んでいます…</p>';
  if (!r.data) return head + '<p class="empty">このレポートは作れませんでした。月を選び直してください。</p>';
  return head + reportPubHtml(r) + '<div class="scroll" style="border-top:1px solid var(--line-soft)"><div id="reportSheet">' + reportHtml(r.data, S.reportNote) + '</div></div>';
}
/** お客様ページに出す・出さない（v0.30.0） */
function reportPubHtml(r) {
  var onlyPub = S.D.settings['レポートは公開した月だけ見せる'] !== 'いいえ';
  var body;
  if (!r.portal) body = '<span class="note">お客様ページに月次レポートは出していません（顧客の情報を編集して、「ポータル表示」で「レポート」にチェックすると出せます）。</span>';

/** 顧客を選ぶ欄の候補。何も入れていないときは、最近対応した顧客を出す */
function pickListHtml(words) {
  var live = S.D.customers.filter(function (c) { return c['状態'] === '有効'; });
  var item = function (c) {
    return '<button type="button" data-pick="' + esc(c['顧客ID']) + '">' + esc(c['顧客名']) + (c['ふりがな'] ? '<span class="minor">' + esc(c['ふりがな']) + '</span>' : '') + '</button>';
  };
  var byKana = function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); };
  if (!String(words || '').trim()) {
    var seen = {}, recent = [];
    // この端末で最近選んだ顧客を先に（スマホでは対応履歴をまだ読んでいないことがある）
    recentCustIds().forEach(function (cid) {
      var c = IDX.cust[cid];
      if (c && c['状態'] === '有効' && !seen[cid] && recent.length < 6) { seen[cid] = true; recent.push(c); }
    });
    S.D.activities.concat(S.D.repairs.slice().sort(function (a, b) { return cmp(b['受付日'], a['受付日']); })).forEach(function (r) {
      var c = IDX.cust[r['顧客ID']];
      if (c && c['状態'] === '有効' && !seen[c['顧客ID']] && recent.length < 6) { seen[c['顧客ID']] = true; recent.push(c); }
    });
    if (recent.length) return '<div class="cap">最近の顧客（名前を入れると全体から探します）</div>' + recent.map(item).join('');
    var first = live.slice().sort(byKana).slice(0, 8);
    return first.length ? '<div class="cap">顧客（' + live.length + '件）</div>' + first.map(item).join('') : '<div class="cap">顧客がまだ登録されていません。</div>';
  }
  var hits = live.filter(function (c) { return textMatch(words, [c['顧客名'], c['ふりがな']]); }).sort(byKana);
  if (!hits.length) return '<div class="cap">見つかりません。</div>';
  return '<div class="cap">' + hits.length + '件' + (hits.length > 8 ? '（先頭の8件。もう少し入れると絞れます）' : '') + '</div>' + hits.slice(0, 8).map(item).join('');
}

/** 顧客や対象区分に合わせて、機器・元の対応・対象の選択肢を作り直す */

  var custEl = form.elements['顧客ID'];
  var cid = custEl ? custEl.value : '';
  Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) {
    var dep = sel.dataset.dep;
    var keep = sel.dataset.touched ? sel.value : sel.dataset.initial;
    var list = [], disabled = false;

      return S.D.devices.filter(function (d) { return d['顧客ID'] === cid && (d['状況'] !== '廃棄' || d['機器ID'] === keep); })
        .map(function (d) { return [d['機器ID'], devLabel(d['機器ID']) + '（' + d['種類'] + '）']; });
    };
    if (dep === '機器ID') list = devs();

    } else if (dep === '対象ID') {

}

/** 今の日時 'yyyy-MM-dd HH:mm'（この端末の時計） */

    if (p.kind === 'file') return '<span class="ptile pfile"><span class="ficon">📎</span><span class="fname">' + esc(shortFileName(p.name)) + '</span><button type="button" class="px" data-act="dropPhoto" data-i="' + i + '" aria-label="これをやめる">×</button></span>';
    return '<span class="ptile' + (p.kind === 'pdf' ? ' ppdf' : '') + '"><img src="' + esc(p.thumb) + '" alt="これから付ける' + (p.kind === 'pdf' ? 'PDF' : '写真') + '">' + (p.kind === 'pdf' ? '<span class="pdfmark">PDF ' + p.pages + '枚</span>' : '') + '<button type="button" class="px" data-act="dropPhoto" data-i="' + i + '" aria-label="これをやめる">×</button></span>';
  });

  for (var i = 0; i < form._sending; i++) waits.push('<span class="ptile wait">送って<br>います…</span>');
  for (var j = 0; j < (form._preparing || 0); j++) waits.push('<span class="ptile wait">準備して<br>います…</span>');
  var total = saved.length + pending.length + waits.length;
  grid.innerHTML = saved.concat(pending, waits).join('') +

}
/** 画像ファイルを読み込む（読めない形式なら失敗する） */
function loadImageFile(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject({ message: '「' + file.name + '」は画像として読めませんでした。' }); };
    img.src = url;
  });
}
/** 長辺が side 以下になるように描いて、data URL にする（もとより大きくはしない）。bg を渡すと、その色で下を塗る */
function drawImage(img, side, mime, quality, bg) {
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!w || !h) throw { message: '画像の大きさが分かりませんでした。' };
  var k = Math.min(1, side / Math.max(w, h));
  var cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  var cx = cv.getContext('2d');
  if (bg) { cx.fillStyle = bg; cx.fillRect(0, 0, cv.width, cv.height); }
  cx.drawImage(img, 0, 0, cv.width, cv.height);

}
function dataUrlBytes(url) { var b = url.slice(url.indexOf(',') + 1); return Math.floor(b.length * 3 / 4); }
/** 写真を小さくする。→ {base64, thumb, bytes} */
function shrinkPhoto(file) {
  return loadImageFile(file).then(function (img) {
    // 大きさと画質を、目安の容量に収まるまで順に下げる
    var steps = [[PHOTO_SIDE, 0.82], [PHOTO_SIDE, 0.7], [1280, 0.7], [1280, 0.55], [1024, 0.55], [800, 0.5]];
    var url = '';
    for (var i = 0; i < steps.length; i++) {
      url = drawImage(img, steps[i][0], 'image/jpeg', steps[i][1], '#ffffff');
      if (dataUrlBytes(url) <= PHOTO_TARGET_BYTES) break;
    }
    if (url.indexOf('data:image/jpeg;base64,') !== 0 || dataUrlBytes(url) > S.D.photoMaxBytes) throw { message: '「' + file.name + '」を小さくできませんでした。' };
    var thumb = drawImage(img, THUMB_SIDE, 'image/jpeg', 0.6, '#ffffff');
    if (thumb.length > S.D.photoThumbMaxChars) thumb = drawImage(img, 96, 'image/jpeg', 0.5, '#ffffff');

}
/** 写真を選んだとき */
function onPhotoFiles(input) {

  var files = Array.prototype.slice.call(input.files || []);

}
/** ファイルを選んだとき（社内メモ。PDF・Excel・Word など） */
function onAttachFiles(input) {
  var form = input.form, box = input.closest('.photos');
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  files.forEach(function (file) {
    var dot = file.name.lastIndexOf('.'), ext = dot > 0 ? file.name.slice(dot + 1).toLowerCase() : '';
    if (S.D.attachExtensions.indexOf(ext) === -1) { toast('「' + file.name + '」は添付できない種類です。使えるのは ' + S.D.attachExtensions.join('・') + ' です。', true); return; }
    if (file.size > S.D.attachMaxBytes) { toast('「' + file.name + '」が大きすぎます。' + Math.floor(S.D.attachMaxBytes / 1024 / 1024) + 'MBまでにしてください。', true); return; }
    readFileBase64(file).then(function (b64) {
      addPreparedItem(form, box, { kind: 'file', name: file.name, mimeType: file.type, base64: b64, bytes: file.size });
    }).catch(failToast);

}
/** 写真を足す（選んだ写真・スキャンしたページ）。足した枚数を返す */
function addPhotoFiles(form, box, files) {

  var key = box.dataset.photokey, id = box.dataset.photoid;
  var room = S.D.photoMax - form._saved.length - form._photos.length - form._sending - (form._preparing || 0);
  if (files.length > room) { toast('添付ファイルは1つの記録に' + S.D.photoMax + '件までです。' + (room > 0 ? '最初の' + room + '件だけ付けます。' : ''), true); files = files.slice(0, Math.max(0, room)); }
  // 1枚ずつ順に（まとめて処理すると、スマホではメモリが足りなくなる）

    chain = chain.then(function () { return shrinkPhoto(file); }).then(function (p) {
      form._preparing--;

      form._sending++; drawPhotos(form);
      return call('uploadPhoto', { target: key, targetId: id, base64: p.base64, thumb: p.thumb }, true).then(function (r) {
        form._sending--; form._saved.push(r.photo); bumpPhotoCount(key, id, 1); S.files = null;
        drawPhotos(form); softRender();      // 窓を閉じたあとに送り終わっても、一覧の「写真N」が変わるように
      }, function (e) { form._sending--; drawPhotos(form); throw e; });
    }, function (e) { form._preparing--; drawPhotos(form); throw e; }).catch(failToast);
  });

  return files.length;
}
/** 新しい記録の写真：保存の返事でIDが決まってから、順に送る */
function takePendingPhotos(form) { return ((form && form._photos) || []).slice(); }
function restorePendingPhotos(form, photos) { if (form && form.querySelector('.photos')) { form._photos = photos.slice(); drawPhotos(form); } }
function uploadPhotos(key, rec, photos) {
  var id = rec[S.D.schema[key].idField], done = 0, failed = 0, why = '';
  var chain = Promise.resolve();
  photos.forEach(function (p) {
    chain = chain.then(function () {
      return call('uploadPhoto', { target: key, targetId: id, base64: p.base64, thumb: p.thumb, kind: p.kind || '', pages: p.pages || 0, name: p.name || '', mimeType: p.mimeType || '' }, true).then(function () { done++; bumpPhotoCount(key, id, 1); },
        function (e) { failed++; why = (e && e.message) || ''; });
    });
  });
  return chain.then(function () {
    if (!S.D) return;
    S.files = null;
    if (failed) toast('添付 ' + failed + '件を付けられませんでした。記録を開いて、もう一度付けてください。' + (why ? '（' + why + '）' : ''), true);
    else toast('添付ファイルを' + done + '件付けました');
    softRender();
  });
}

var MPLAN = null;

      '<td><b>' + esc(x.name) + '</b><span class="minor">' + esc(x.area) + (x.prev ? '・先月 ' + esc(x.prev) : '') + '</span></td>' +

    '<p><button type="button" class="btn small' + (r.month === cur ? ' primary' : '') + '" data-act="maintPlanMonth" data-month="' + cur + '">今月</button> <button type="button" class="btn small' + (r.month === next ? ' primary' : '') + '" data-act="maintPlanMonth" data-month="' + next + '">来月</button></p>' +
    (r.holidaysOk ? '' : '<p class="note bad">祝日のカレンダーを読めませんでした。祝日を除けていないので、日付を確かめてください。</p>') +
    (r.holidays && r.holidays.length ? '<p class="minor">除いた祝日：' + esc(r.holidays.join('、')) + '</p>' : '') +
    (r.plan.length ? '<p class="row" id="mplanSel"><button type="button" class="btn small" data-act="maintPlanAll" data-on="1">すべて選択</button> <button type="button" class="btn small" data-act="maintPlanAll" data-on="">すべて解除</button> <span class="minor" id="mplanCount">' + r.plan.length + ' / ' + r.plan.length + '社を登録</span></p>' : '') +
    (r.plan.length ? '<div class="tblwrap"><table class="mtbl" id="mplanTbl"><thead><tr><th></th><th>日付</th><th>時刻</th><th>顧客</th><th>台数</th><th>カレンダー</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="mempty">入れる顧客はありません。</p>') +
    (r.skipped.length ? '<details><summary>入れなかった顧客（' + r.skipped.length + '社）</summary><ul>' + r.skipped.map(function (x) { return '<li>' + esc(x.name) + '：' + esc(x.reason) + '</li>'; }).join('') + '</ul></details>' : '') +

  var ta = $('lbKeys'), cnt = $('lbCount');

// ---- 音声入力（v0.117.0）：入力窓の長い文の欄に🎤。話した言葉を、いまの文の後ろに足す
var VOICE = { rec: null, el: null };
function voiceSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function addVoiceButtons(root) {
  if (!voiceSupported() || !root) return;
  root.querySelectorAll('form textarea').forEach(function (ta) {
    if (ta.dataset.novoice || ta.dataset.voice) return;
    ta.dataset.voice = '1';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn small voicebtn'; b.dataset.act = 'voiceInput'; b.title = '話して入力'; b.setAttribute('aria-label', '話して入力');
    b.textContent = '🎤 話して入力';
    ta.parentNode.insertBefore(b, ta.nextSibling);
  });
}
function voiceStop() {
  if (VOICE.rec) { try { VOICE.rec.stop(); } catch (e) { /* そのまま */ } }
}
function voiceStart(btn) {
  var ta = btn.previousElementSibling;
  while (ta && ta.tagName !== 'TEXTAREA') ta = ta.previousElementSibling;
  if (!ta) return;
  if (VOICE.rec) { var same = VOICE.btn === btn; voiceStop(); if (same) return; }
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = new R();
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
  var base = ta.value, finalText = '';
  rec.onresult = function (ev) {
    var interim = '';
    for (var i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript; else interim += ev.results[i][0].transcript;
    }
    ta.value = base + (base && !/\n$/.test(base) ? '\n' : '') + finalText + interim;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = function (ev) {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('マイクを使う許可がありません。ブラウザの設定でマイクを許可してください。', true);
    else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('音声を文字にできませんでした（' + ev.error + '）', true);
  };
  rec.onend = function () { btn.classList.remove('on'); btn.textContent = '🎤 話して入力'; if (VOICE.rec === rec) { VOICE.rec = null; VOICE.btn = null; } };
  try { rec.start(); } catch (e) { toast('音声入力を始められませんでした。', true); return; }
  VOICE.rec = rec; VOICE.btn = btn;
  btn.classList.add('on'); btn.textContent = '⏹ 止める';
}

// v0.122.0：購入元が自社（EN・GROW）で保証期限が空なら、キッティング日から1年（1年後の前日）を入れる
function isOwnSource(v) {
  v = String(v || '').trim();
  if (!v) return false;
  var own = String((S.D && S.D.settings && S.D.settings['自社名']) || '').replace(/[\s・･.]/g, '').toLowerCase();
  var x = v.replace(/[\s・･.]/g, '').toLowerCase();
  return v === '自社' || /engrow/.test(x) || (own && x.indexOf(own) !== -1);
}
function warrantyFromKitting(ymd) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ymd || '')) return '';
  var d = new Date(+ymd.slice(0, 4) + 1, +ymd.slice(5, 7) - 1, +ymd.slice(8, 10) - 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function autoWarranty(form) {
  if (!form || !form.elements['保証期限'] || !form.elements['購入日']) return;
  var w = form.elements['保証期限'], src = form.elements['購入元'];
  var srcVal = src && src.value !== undefined ? src.value : '';
  if (!isOwnSource(srcVal) || (w.value && !w.dataset.auto)) return;
  var v = warrantyFromKitting(form.elements['購入日'].value);
  if (!v) return;
  w.value = v; w.dataset.auto = '1';
}
document.addEventListener('change', function (e) {
  var f = e.target && e.target.form;
  if (!f || !f.elements['保証期限']) return;
  if (e.target.name === '保証期限') { delete e.target.dataset.auto; return; }
  if (e.target.name === '購入日' || e.target.name === '購入元') autoWarranty(f);
});

// v0.126.0：機器を別の顧客へ移したあと、手元のデータだけ直す（前は全部を読み直していて、移すたびに待たされた）
function applyMovedDevice(fromCust, toCust, r) {
  if (!S.D || !r) return;
  upsert(S.D.devices, '機器ID', r.record);
  var setCust = function (list, idf, ids) {
    if (!list || !ids || !ids.length) return;
    var want = {}; ids.forEach(function (x) { want[x] = true; });
    list.forEach(function (x) { if (want[x[idf]]) x['顧客ID'] = toCust; });
  };
  var m = r.moved || {};
  setCust(S.D.activities, '対応ID', m.activities);
  setCust(S.D.repairs, '修理ID', m.repairs);
  setCust(S.D.maintenances, '実施ID', m.maintenances);
  if (S.custActs) { delete S.custActs[fromCust]; delete S.custActs[toCust]; }
  if (r.allocIds && r.allocIds.length && S.D.allocations) {
    var gone = {}; r.allocIds.forEach(function (x) { gone[x] = true; });
    S.D.allocations = S.D.allocations.filter(function (a) { return !gone[a['割当ID']]; });
  }
  (r.clearedRepairIds || []).forEach(function (id) { var x = findRecord('repair', id); if (x) x['元の対応ID'] = ''; });
  (r.clearedLoanIds || []).forEach(function (id) { var x = (S.D.loans || []).filter(function (l) { return l['貸出ID'] === id; })[0]; if (x) x['修理ID'] = ''; });
  S.creds = null; S.files = null; S.alertsStale = true;
  reindex();
  render();
}
