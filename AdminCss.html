<style>
:root { --file-version: "@file-version 0.127.2"; }
/* 配置の考え方：上に固定の帯（名前・画面の切り替え・利用者）、その下は1本の列。一覧は表、編集は重ねた窓。 */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #18222d; --muted: #5b6876; --line: #dde3ea; --line-soft: #edf0f4;
  --brand: #17508f; --brand-soft: #e6eef8; --brand-ink: #ffffff;
  --ok: #17703f; --ok-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbf0d9; --danger: #b3261e; --danger-soft: #fbe6e4;
  --idle: #4a5562; --idle-soft: #e9edf1;
  --radius: 8px; --font: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.35; }

/* ログイン */
.bootsplash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--bg, #f3f5f8); }
.bootsplash[hidden] { display: none; }
.bs-box { text-align: center; color: var(--muted); }
.bs-brand { font-weight: 700; font-size: 18px; color: var(--ink); margin-bottom: 14px; }
.bs-spin { width: 34px; height: 34px; margin: 0 auto 12px; border: 3px solid #d6dde6; border-top-color: var(--brand); border-radius: 50%; animation: bsspin .9s linear infinite; }
@keyframes bsspin { to { transform: rotate(360deg); } }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.login-box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.login-box h1 { font-size: 20px; }
.login-box .ver { color: var(--muted); font-size: 12px; }
.login-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.login-brand img { max-height: 56px; max-width: 220px; object-fit: contain; display: block; }
.login-brand .login-company { font-weight: 700; font-size: 15px; }
.login-brand .login-company:empty { display: none; }

/* 上の帯 */
.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-row { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 16px; min-height: 52px; }
.brand { font-weight: 700; font-size: 15px; white-space: nowrap; min-width: 0; display: flex; align-items: center; gap: 8px; }
.brand span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand img { height: 28px; max-width: 120px; object-fit: contain; flex: none; display: block; }
/* 会社のロゴ（設定） */
.logo-set { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line-soft); }
.logo-preview { min-width: 120px; min-height: 56px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--panel); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.logo-preview img { max-height: 56px; max-width: 220px; object-fit: contain; display: block; }
/* 記録に付ける写真 */
.photos { border-top: 1px solid var(--line-soft); padding-top: 12px; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.photos-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile.stat[aria-pressed="true"] { border-color: var(--moss, #1f4d3d); box-shadow: 0 0 0 2px rgba(31,77,61,.18); }
button.tile.stat { cursor: pointer; text-align: left; font: inherit; }
.warnbar { background: #FFF6E5; border-color: #EAD3A0; }
.warnbar .btn { margin-left: 10px; }
.regh { padding: 5px 12px; border-radius: 10px; background: var(--rg-bg, #eef3f9); border-left: 4px solid var(--rg-bd, #c9d6e6); }
.ccards.rg { background: var(--rg-bg, transparent); border-radius: 12px; margin: 0 14px 10px; padding: 10px; }
.rg0 { --rg-bg: #EAF3EE; --rg-bd: #A9CDB8; } .rg1 { --rg-bg: #EAF1FA; --rg-bd: #A8C4E6; } .rg2 { --rg-bg: #FBF2E4; --rg-bd: #E6CC9A; }
.rg3 { --rg-bg: #F4ECF8; --rg-bd: #CDB2DC; } .rg4 { --rg-bg: #FBEBEB; --rg-bd: #E3B1B1; } .rg5 { --rg-bg: #E9F6F6; --rg-bd: #9FD0D0; }
.rg6 { --rg-bg: #F6F4E4; --rg-bd: #D6D09A; } .rgx { --rg-bg: #F1F3F5; --rg-bd: #CBD2D9; }
.regh { margin: 14px 0 6px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.regh .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.pv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0 0 12px; }
.pv-row { background: #f8fafc; border-radius: 10px; padding: 8px 12px; min-width: 0; }
.pv-row.wide { grid-column: 1 / -1; }
.pv-row dt { font-size: 12px; color: #64748b; margin: 0 0 2px; }
.pv-row dd { margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 600px) { .pv { grid-template-columns: 1fr; } }
.photo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.ptile { position: relative; width: 76px; height: 76px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 1.3; color: var(--muted); }
.ptile img { width: 100%; height: 100%; object-fit: cover; display: block; }
button.ptile:hover { border-color: var(--brand); }
.ptile.pfile { flex-direction: column; gap: 2px; padding: 4px; text-align: center; }
.ptile.pfile .ficon { font-size: 22px; line-height: 1; }
.ptile.pfile .fname { font-size: 10px; line-height: 1.2; overflow-wrap: anywhere; color: var(--text); }
.ptile.add { border-style: dashed; color: var(--brand); font-weight: 700; background: var(--panel); }
.ptile.wait { opacity: .6; }
.ptile .pdfmark { position: absolute; left: 3px; bottom: 3px; background: #b3261e; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
.scanpdf[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.ptile .px { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(24, 34, 45, .72); color: #fff; font-size: 15px; line-height: 1; padding: 0; }
.pmark { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--idle-soft); color: var(--idle); font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: 1px; }
.photo-view img { max-width: 100%; max-height: 68vh; display: block; margin: 0 auto; border-radius: 4px; }
.nav { display: flex; gap: 2px; flex: 1; min-width: 0; }
/* あまり使わない画面（レンタル・お知らせ・設定）は「その他」にまとめる（v0.37.0） */
.navmore { position: relative; }
.navmore > summary { list-style: none; cursor: pointer; padding: 15px 12px 13px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
.navmore > summary::-webkit-details-marker { display: none; }
.navmore > summary:hover, .navmore[open] > summary { color: var(--ink); }
.navmore.on > summary { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
.navpop { position: absolute; left: 0; top: 100%; z-index: 30; display: flex; flex-direction: column; min-width: 150px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.nav .navpop button { padding: 9px 12px; border: 0; border-radius: 6px; text-align: left; color: var(--ink); }
.nav .navpop button:hover { background: var(--brand-soft); color: var(--brand); }
.nav .navpop button[aria-current="page"] { color: var(--brand); font-weight: 700; background: var(--brand-soft); }
.nav button { border: 0; background: none; padding: 15px 12px 13px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
.user { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.user .who { color: var(--ink); font-size: 13px; }
/* 自分のメニュー（名前を押すと開く。v0.23.0 で上のメニューの場所をあけた） */
.acct { position: relative; }
.acct > summary { list-style: none; cursor: pointer; }
.acct > summary::-webkit-details-marker { display: none; }
.acct-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; display: flex; flex-direction: column; gap: 4px; min-width: 160px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.acct-menu .btn { justify-content: flex-start; text-align: left; border: 0; }
.acct-menu .btn:hover { background: var(--brand-soft); }
@media (max-width: 760px) {
  .top-row { flex-wrap: wrap; gap: 0 12px; }
  .brand { flex: 1; padding-top: 8px; }
  .user { padding-top: 8px; }
  .user .who { display: inline-block; max-width: 5em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .nav { order: 3; flex-basis: 100%; }
  .nav button { padding: 10px 10px 8px; }
  .navmore > summary { padding: 10px 10px 8px; }
}

main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h1 { font-size: 20px; flex: 1 1 240px; min-width: 0; }
.head .pill { flex: none; }
.sub { color: var(--muted); font-size: 13px; }

/* ボタン */
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; line-height: 1.4; white-space: nowrap; }
.btn:hover { border-color: #b9c3cf; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }
.btn.primary:hover { background: #123f73; }
.btn.danger { color: var(--danger); border-color: #e7b9b5; }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }

/* 入力 */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; }
input[type="text"], input[type="search"], input[type="password"], input[type="date"], input[type="month"], input[type="number"], input[type="datetime-local"], select, textarea {
  border: 1px solid #c3ccd6; border-radius: 6px; padding: 7px 10px; background: var(--panel); width: 100%; min-width: 0; }
.toolbar select, .toolbar input[type="month"] { width: auto; }
textarea { resize: vertical; min-height: 96px; }
input:disabled, select:disabled { background: var(--line-soft); color: var(--muted); }

/* 表 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.panel > h2 { font-size: 15px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; }
.panel > h2 .grow { flex: 1; }
.panel .pad { padding: 14px 16px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; background: #f8fafc; }
th .th { border: 0; background: none; padding: 0; color: inherit; font-weight: inherit; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #f6f9fd; }
/* 仮受付（未割り当て）の機器は、背景に色を付けて目立たせる（v0.80.0） */
tr.unassigned td { background: #FFF1CC; }
tr.unassigned:hover td { background: #FFE7A3; }
.hits button.unassigned { background: #FFF1CC; border-color: #E8C766; }
td.nowrap, th.nowrap { white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; }
td .minor { color: var(--muted); font-size: 12px; font-weight: 400; display: block; }
td.clamp { max-width: 420px; min-width: 12em; }
td.cname { min-width: 9em; }
td.title { min-width: 8em; }
td.clamp > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 20px 16px; margin: 0; }
.more { color: var(--muted); font-size: 12px; padding: 8px 16px; margin: 0; border-top: 1px solid var(--line-soft); }

/* 印 */
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--idle-soft); color: var(--idle); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.hits button.fresh0 { border-left: 4px solid var(--ok); background: var(--ok-soft); }
.hits button.fresh7 { border-left: 4px solid var(--brand); }
.dupd { white-space: nowrap; }
.dupd .minor { display: block; }

/* ダッシュボード */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: #b9c3cf; }
.dash { color: var(--muted); }
.tile b { font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 12px; }
.tile.attn b { color: var(--danger); }
/* 設定の画面（v0.27.0）：左に目次、右にまとまりごとの項目 */
.setwrap { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; align-items: start; }
.setnav { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
.setnav button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; color: var(--ink); }
.setnav button:hover { background: var(--brand-soft); color: var(--brand); }
.setnav button.sub { padding: 5px 10px 5px 22px; font-size: 12px; color: var(--muted); }
.setfind { flex: 1 1 220px; max-width: 360px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; }
.optgroup { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 64px; }
.optgroup[hidden], .optblock[hidden], .setgrp[hidden] { display: none; }
.optgroup > h3 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.optblock { background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.opthead .minor, .optgroup > h3 .minor { font-size: 12px; font-weight: 400; color: var(--muted); }
.optform .optvalue { max-width: 320px; }
.opthead { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.optnote { margin: 0; }
.optform { gap: 6px; }
.optform .optvalue { min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; }
.chip.locked { cursor: default; }
.setmain { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.setmain > .panel { scroll-margin-top: 64px; }
.settings-form { display: flex; flex-direction: column; gap: 14px; }
.setgrp { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px 14px; margin: 0; min-width: 0; }
.setgrp > legend { font-weight: 700; padding: 0 6px; }
.setgrp > summary { font-weight: 700; cursor: pointer; padding: 2px 0; }
.setgrp[open] > summary { margin-bottom: 6px; }
.bnavpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bnavpick select { min-width: 0; }
.setgrp-note { margin: 0 0 10px; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 16px; }
.setgrid .field input[type="number"] { max-width: 160px; }
.setsave { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line); padding: 12px 0 0; }
@media (max-width: 900px) {
  .setwrap { grid-template-columns: 1fr; }
  .setnav { position: static; flex-direction: row; flex-wrap: wrap; }
  .setnav button.sub { display: none; }
}
/* ライセンス：会社 → ソフト（v0.25.0） */
.lnote { margin: 0; padding: 8px 14px 6px; }
@media (min-width: 761px) {
  .lgroup table { table-layout: fixed; width: 100%; }
  .lgroup th:nth-child(1) { width: 46%; } .lgroup th:nth-child(2) { width: 14%; } .lgroup th:nth-child(3) { width: 28%; } .lgroup th:nth-child(4) { width: 12%; }
}
.lgroup { border-top: 1px solid var(--line); }
.lgroup > summary { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; background: var(--bg, #f6f8fa); list-style: none; }
.lgroup > summary::-webkit-details-marker { display: none; }
.lgroup > summary::before { content: '▸'; color: var(--muted); transition: transform .15s; }
.lgroup[open] > summary::before { transform: rotate(90deg); }
.lgroup > summary b { font-size: 15px; }
.hits .cap.pgrp { margin-top: 10px; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.lgroup .lcount { color: var(--muted); font-size: 12px; margin-right: 4px; }
/* 収集ツールのレポート（v0.25.0） */
.dialog.wide { max-width: min(1000px, 96vw); width: 96vw; }
.rptbody { padding: 0; }
.rptframe { display: block; width: 100%; height: 70vh; border: 0; background: #fff; }
.tile.attn { border-color: #e9b4b0; box-shadow: inset 3px 0 0 var(--danger); }
.tile .tsub { font-size: 12px; } .tile .tsub.hot { color: var(--danger); font-weight: 700; }
.acust { display: inline-block; margin-right: 8px; color: var(--muted); font-size: 12px; }
.acust::after { content: '｜'; margin-left: 8px; color: var(--line); }
/* 推移の小さいグラフ（v0.22.0） */
.spark { color: var(--brand); display: block; overflow: visible; }
.ttrend { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.ttrend em { font-style: normal; margin-left: 4px; color: var(--muted); }
.ttrend em.up { color: var(--danger); } .ttrend em.down { color: #2f7d4f; }
.mspark { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
/* 1年の振り返り */
.ynote { margin: 0 0 10px; color: var(--muted); }
.ytbl { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.ytbl th, .ytbl td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; font-size: 13px; }
.ytbl thead th small { display: block; color: var(--muted); font-weight: 400; font-size: 10px; }
.ytbl tbody th { text-align: left; white-space: nowrap; }
.ytbl td { vertical-align: bottom; height: 58px; }
.ytbl td i { display: block; width: 14px; margin: 0 auto 2px; border-radius: 2px 2px 0 0; background: var(--brand); }
.ytbl td.ysum { font-weight: 700; vertical-align: middle; }
.ydetail { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.ydetail h3 { font-size: 14px; margin: 0 0 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; align-items: start; }
.cols > * { min-width: 0; }
/* ミーティングの① は、週が上の見出しと同じなので、画面では出さない（印刷には残す。v0.40.0） */
.mtg h2 .sub.mtgweek { display: none; }
@media print { .mtg h2 .sub.mtgweek { display: inline; } }
/* PC管理の上：左に要対応、右に定期保守と社内メモを重ねる（v0.38.0） */
.cols.todo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols.todo > #maintPanel { grid-column: 1 / -1; }
@media (max-width: 900px) { .cols.todo { grid-template-columns: minmax(0, 1fr); } }
/* 閉じた要約カード（要対応・今月の定期保守・社内メモ。v0.45.0） */
.cols.todo > .panel.fold.open { grid-column: 1 / -1; }
.panel.fold > h2 { cursor: pointer; user-select: none; border-bottom: 0; }
.panel.fold.open > h2 { border-bottom: 1px solid var(--line-soft); }
.panel.fold > h2 .chev::before { content: "▸"; color: var(--muted); font-size: 12px; margin-left: 4px; }
.panel.fold.open > h2 .chev::before { content: "▾"; }
.panel.fold > .fsum { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px; }
.panel.fold.open > .fsum { display: none; }
.panel.fold:not(.open) > :not(h2):not(.fsum):not(.mbar) { display: none; }
.panel.fold.hot:not(.open) { background: #FDECEA; border-color: #F0B9B2; }
.fchips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--panel); border: 1px solid #EAD3A0; font-size: 13px; }
.fchip .fn { font-weight: 700; }
.fchip.ok { border-color: #B6D6C0; } .fchip.warn { border-color: #EAD3A0; } .fchip.idle { border-color: var(--line); color: var(--muted); }
.fright { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 600; }
@media (max-width: 980px) { .cols.todo { grid-template-columns: 1fr; } .cols.todo > #alertPanel { grid-row: auto; } }
.mbar { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 6px; font-size: 12px; color: var(--muted); }
.panel > .mbar { display: flex; grid-template-columns: none; width: auto; }
.mbar .mtrack { flex: 1; min-width: 0; height: 8px; border-radius: 999px; background: var(--idle-soft); overflow: hidden; }
.mbar .mtrack i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.alldone { margin: 0; padding: 14px 16px 18px; color: var(--ok); font-weight: 700; }
/* 顧客のカード（v0.38.0） */
.ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px 14px 14px; }
.ccard { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.ccard.click { cursor: pointer; }
.ccard.click:hover, .ccard.click:focus-visible { border-color: var(--brand); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
.ccard.pending { opacity: .6; }
.cc-name b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.cc-name .minor { display: block; }
.cc-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cc-dev { color: var(--muted); font-size: 12px; }
.cc-alert { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cc-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 84px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; }
.bar i { display: block; height: 10px; border-radius: 5px; background: var(--brand); min-width: 2px; }
.bar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }

/* 顧客の詳細 */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: 12px; }
.facts dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
.secret { font-family: ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }

/* 重ねる窓 */
.overlay { position: fixed; inset: 0; background: rgba(20, 30, 42, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 32px 12px; overflow-y: auto; }
.dialog { background: var(--panel); border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 16px 48px rgba(20, 30, 42, .25); }
.dialog.narrow { max-width: 440px; }
.dialog > header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.dialog > header h2 { font-size: 16px; flex: 1; }
.dialog .body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.dialog > footer, .dialog form > footer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.dialog footer .grow { flex: 1; }
.x { border: 0; background: none; font-size: 20px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.grid2 .wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > .lab { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .req { color: var(--danger); margin-left: 4px; }
.checks { display: flex; gap: 6px 16px; flex-wrap: wrap; }
.checks label { display: flex; gap: 6px; align-items: center; }
.msg { margin: 0; padding: 9px 12px; border-radius: 6px; background: var(--danger-soft); color: var(--danger); white-space: pre-wrap; }
.note { margin: 0; color: var(--muted); font-size: 13px; }
/* Tips（いちばん上の1行） */
.tipsbar { display: flex; gap: 10px; align-items: center; background: var(--brand-soft); border: 1px solid #c9daf0; border-radius: var(--radius); padding: 4px 6px 4px 10px; font-size: 13px; }
.tipsbar .tip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tipsbar .btn.small { padding: 2px 8px; }
.tipsbar .tag { flex: none; background: var(--brand); color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; }
.tipsbar .tip { flex: 1; min-width: 0; line-height: 1.5; }
.tipsbar .tip b { margin-right: 8px; white-space: nowrap; }
.tipsbar .btn.small { flex: none; background: var(--panel); }
.tipsbar .x { flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; }
.tipsbar .tip { overflow-wrap: anywhere; }
/* 使い方 */
.help-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.help-list li { line-height: 1.6; }
/* 顧客ごとにまとめた表の、見出しの行 */
tr.grp td { background: #eef3f9; font-weight: 700; padding: 6px 12px; border-bottom: 1px solid var(--line); }
tr.grp td span { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
/* 定型文 */
details.phrases { margin-top: 6px; }
details.phrases summary { cursor: pointer; color: var(--brand); font-size: 13px; font-weight: 600; }
details.phrases .chipset { margin-top: 8px; }
details.phrases .chipset button { text-align: left; white-space: normal; border-radius: 8px; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: #f8fafc; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 12px; }
.chip.off { color: var(--muted); text-decoration: line-through; background: var(--line-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
/* 収集ツールの情報の欄：文章を先に1行ぶん広く取り、ボタンは下に回す（狭い画面で1文字ずつ折れないように。v0.80.0） */
.diagrow > .grow { flex: 1 1 100%; }

/* 選択ボタン（プルダウンの代わり） */
/* 期間を選ぶ帯・報告の数字・縦の棒グラフ（対応履歴・修理履歴） */
.period { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; }
.per-nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.per-nav .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.per-nav input { width: auto; }
.per-label { min-width: 190px; text-align: center; font-size: 14px; }
.btn.on { border-color: var(--brand); color: var(--brand); font-weight: 700; }
.filters { display: flex; flex-direction: column; gap: 10px; }
#custChips { display: flex; flex-direction: column; gap: 10px; }
/* PC管理の顧客の一覧は、枠の中で送る（下の要対応などに、すぐ届くように） */
#custPanel #list .scroll { max-height: min(62vh, 640px); overflow-y: auto; }
#custPanel #list thead th { position: sticky; top: 0; z-index: 1; }
/* レイアウト図のテンプレートを選ぶ窓 */
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tpl-grid .btn { text-align: left; padding: 10px 12px; white-space: normal; line-height: 1.4; }
.tpl-grid .btn span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; white-space: normal; }
.tpl-gen { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: flex-end; }
.tpl-gen .field { width: auto; min-width: 110px; }
.tpl-gen input[type="number"] { width: 90px; }
.frow { display: flex; gap: 10px; align-items: flex-start; }
.flabel { flex: none; width: 34px; color: var(--muted); font-size: 12px; padding-top: 6px; }
.tiles.stats { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile.stat { cursor: default; }
.tile.stat b small { font-size: 13px; font-weight: 600; margin-left: 2px; color: var(--muted); }
.tile.stat .sub2 { color: var(--muted); font-size: 12px; }
.tile.stat.attn b { color: var(--danger); }
.stack { display: flex; flex-direction: column; gap: 16px; }
h2.sect { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 8px; }
.vbars { display: flex; align-items: stretch; gap: 6px; height: 170px; }
.vbars.dense { gap: 2px; }
.vcol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.vpair { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 2px; border-bottom: 1px solid var(--line); min-height: 0; }
.vb { flex: 1 1 0; max-width: 30px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.vb i { display: block; width: 100%; background: var(--brand); border-radius: 4px 4px 0 0; }
.vb.s2 i { background: #c2600a; }
.vb i.zero { height: 0; }
.vb em { font-style: normal; font-size: 11px; line-height: 1.5; color: var(--ink); font-variant-numeric: tabular-nums; }
.vb em.zero { color: #9aa5b1; }
.vb:hover i { filter: brightness(1.15); }
.vlab { display: block; text-align: center; font-size: 11px; line-height: 1.3; color: var(--muted); padding-top: 4px; white-space: nowrap; overflow: hidden; min-height: 30px; }
.vlab small { display: block; font-size: 10px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .k1 { background: var(--brand); } .legend .k2 { background: #c2600a; }
.bars.wide .bar { grid-template-columns: minmax(120px, 40%) 1fr 36px; }
.bars.wide .bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 10px; border-radius: 5px; background: var(--line-soft); overflow: hidden; margin: 10px 0; }
.meter i { display: block; height: 100%; background: var(--ok); }
.timing { color: #8a94a0; font-size: 11px; text-align: right; margin: 0; }
.timing button { border: 0; background: none; padding: 0 0 0 8px; font: inherit; color: var(--brand); text-decoration: underline; cursor: pointer; }
.login-keep { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; cursor: pointer; }
.login-keep input { width: 18px; height: 18px; flex: none; }
.login-keep-note { color: var(--muted); font-size: 12px; margin: -10px 0 0; }
.cols > .panel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media (max-width: 760px) {
  .tiles.stats { grid-template-columns: 1fr 1fr; }
  .per-label { min-width: 0; }
  .period { padding: 8px; }
}

tr.pending { opacity: .55; }
tr.pending td:first-child::after { content: " 保存中…"; color: var(--muted); font-size: 11px; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chipset button { border: 1px solid #c3ccd6; background: var(--panel); border-radius: 8px; padding: 7px 14px; min-height: 38px; }
.chipset button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }
.chipset.small button { padding: 3px 12px; min-height: 30px; border-radius: 999px; font-size: 13px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px dashed #b3bfcc; background: var(--panel); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
.suggest button[aria-pressed="true"] { border-style: solid; border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
/* 顧客の選択 */
.picker .picked { display: flex; align-items: center; gap: 8px; border: 1px solid #b9cbe2; border-radius: 6px; padding: 5px 6px 5px 12px; background: var(--brand-soft); }
.picker .picked b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pick-list { display: flex; flex-direction: column; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.pick-list .cap { font-size: 12px; color: var(--muted); padding: 5px 12px; background: #f8fafc; }
.pick-list button { text-align: left; border: 0; border-top: 1px solid var(--line-soft); background: var(--panel); padding: 9px 12px; }
.pick-list button:hover { background: #f6f9fd; }
.pick-list button .minor { color: var(--muted); font-size: 12px; margin-left: 8px; }
details.rest { border-top: 1px solid var(--line-soft); padding-top: 8px; }
details.rest > summary { cursor: pointer; color: var(--brand); font-weight: 600; padding: 6px 0; }
details.rest[open] > summary { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: minmax(90px, 150px) 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.diagmore { margin-top: 6px; font-size: 13px; }
.diagmore summary { cursor: pointer; padding: 4px 0; }
.diagmore pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow-y: auto; font: inherit; background: var(--bg, #f6f7f9); padding: 8px; border-radius: 6px; }
.kv dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow-y: auto; }
.sheet-list { display: flex; flex-direction: column; gap: 8px; }
.sheet-list .btn { text-align: left; padding: 13px 16px; font-size: 15px; }
.sheet-list .btn span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.sheet-list .btn.primary span { color: #d5e3f5; }
#bnav { display: none; }
/* 入力の画面（スマホで最初に出る）・下書き */
.hgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hbtn { display: flex; flex-direction: column; gap: 3px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 16px 14px; min-height: 84px; }
.hbtn b { font-size: 16px; }
.hbtn span { font-size: 12px; color: var(--muted); }
.hbtn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.hbtn.primary span { color: #d5e3f5; }
.hpad { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.hpad input[type="search"] { width: 100%; }
.hits { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.hits .cap { font-size: 12px; color: var(--muted); padding: 6px 12px; background: #f8fafc; }
.hits button { text-align: left; border: 0; border-top: 1px solid var(--line-soft); background: var(--panel); padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; }
.hits button b { overflow-wrap: anywhere; }
.hits button.pallocbtn { border: 1px solid var(--line); border-radius: 8px; flex-direction: row; align-self: flex-start; margin: 2px 12px 10px; padding: 6px 12px; font-size: 13px; min-height: 36px; }
.hits button span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.draftbar { display: flex; flex-direction: column; gap: 6px; border: 1px solid #e3c98f; background: var(--warn-soft); border-radius: var(--radius); padding: 10px 12px; }
.draftbar .cap { font-size: 13px; font-weight: 700; color: var(--warn); }
.draftbar .d { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.draftbar .d .t { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.draftbar .d .t small { color: var(--muted); margin-left: 6px; }
.draftbar .d .t small.sent { display: block; margin: 2px 0 0; color: var(--danger); }
.draft-note { border: 1px solid #e3c98f; background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; font-size: 13px; }
.draft-offer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid #e3c98f; background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 13px; }
.draft-offer .t { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }

/* スマホ幅：下にメニュー、入力は画面いっぱい、一覧はカード */
@media (max-width: 760px) {
  body { font-size: 15px; }
  input[type="text"], input[type="search"], input[type="password"], input[type="date"], input[type="month"], input[type="number"], input[type="datetime-local"], select, textarea {
    font-size: 16px; min-height: 46px; padding: 9px 12px; }
  .btn { min-height: 44px; padding: 9px 16px; }
  .btn.small { min-height: 36px; padding: 5px 12px; }
  .chipset button { min-height: 44px; padding: 9px 16px; font-size: 15px; }
  .suggest button { min-height: 36px; padding: 5px 14px; font-size: 14px; }
  .chipset.small button { min-height: 36px; padding: 5px 14px; font-size: 14px; }
  .pick-list button { padding: 13px 12px; }
  .nav, .user { display: none; }
  .top-row { min-height: 46px; }
  .brand { padding-top: 0; }
  main { padding: 14px 12px 104px; }
  #toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }      /* ＋ボタンと下のメニューに重ならない（v0.107.0） */
  #bnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #bnav button { border: 0; background: none; color: var(--muted); font-size: 12px; min-height: 58px; padding: 6px 2px; }
  #bnav button[aria-current="page"] { color: var(--brand); font-weight: 700; box-shadow: inset 0 2px 0 var(--brand); }
  #bnav button.add { color: var(--brand); font-weight: 700; }
  #bnav button.add i { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -22px auto 2px;
    border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-style: normal; font-size: 26px; line-height: 1; box-shadow: 0 4px 12px rgba(23, 80, 143, .35); }
  .overlay { padding: 0; align-items: flex-start; }   /* stretch にすると、長いフォームが窓の白地からはみ出して、下の画面が透ける */
  .dialog, .dialog.narrow { max-width: none; min-height: 100%; border-radius: 0; display: flex; flex-direction: column; }
  .dialog form { display: flex; flex-direction: column; flex: 1; }
  .dialog .body { flex: 1; }
  .dialog > header { position: sticky; top: 0; z-index: 2; background: var(--panel); }
  .dialog > footer, .dialog form > footer { position: sticky; bottom: 0; background: var(--panel); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .dialog footer .btn.primary { flex: 1; }
  .dialog footer .grow { display: none; }
  .overlay.sheet { align-items: flex-end; }
  .overlay.sheet .dialog { min-height: 0; border-radius: 16px 16px 0 0; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .draftbar .d .t { flex-basis: 100%; }
  .hits button { padding: 13px 12px; }
  .head .btn.primary.wide-only { display: none; }
  /* 一覧をカードに */
  .scroll table.cards, .scroll table.cards tbody, .scroll table.cards tr, .scroll table.cards td { display: block; }
  .scroll table.cards thead { display: none; }
  .scroll table.cards tr[data-memo]:not(.pending)::after { content: "💬 " attr(data-memo); flex: 1 0 100%; font-size: 13px; color: var(--muted); }
  .scroll table.cards tr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
  .scroll table.cards tbody tr:last-child { border-bottom: 0; }
  .scroll table.cards tr.grp { padding: 0; }
  .scroll table.cards tr.grp td { width: 100%; padding: 7px 14px; }
  .tipsbar { flex-wrap: wrap; }
  .tipsbar .tip { flex-basis: 100%; order: 3; }
  .tipsbar .tag { order: 1; }
  .tipsbar .btn.small { order: 2; margin-left: auto; }
  .tipsbar .x { order: 2; }
  .scroll table.cards td { padding: 0; border: 0; min-width: 0; max-width: none; text-align: left; white-space: normal; }
  .scroll table.cards td:empty, .scroll table.cards td:has(> .dash:only-child) { display: none; }
