function $(id) { return document.getElementById(id); }
/** 「備考」があるとき、行やカードに付ける属性（カーソルを当てると吹き出しで出る。v0.103.0。v0.127.0 で「ひとこと」から「備考」に） */
function memoText(rec) {
  if (!rec) return '';
  var m = String(rec['備考'] || '').trim() || String(rec['ひとこと'] || '').trim();      // 備考が無い種類・前に入れたひとことは、そのまま出す
  return m.length > 300 ? m.slice(0, 300) + '…' : m;
}
function memoAttr(rec) {
  var m = memoText(rec);
  return m ? ' data-memo="' + esc(m) + '"' : '';
}
/** 種類（editRecord の key）とIDから、レコードを探す（ひとこと用） */
function memoOfRec(key, id) {
  var pick = function (list, f) { for (var i = 0; i < (list || []).length; i++) if (list[i][f] === id) return list[i]; return null; };
  var D = S.D;
  switch (key) {
    case 'license': return IDX.lic[id];
    case 'device': return IDX.dev[id];
    case 'customer': return IDX.cust[id];
    case 'repair': return pick(D.repairs, '修理ID');
    case 'activity': return pick(D.activities, '対応ID');
    case 'project': return pick(D.projects, '案件ID');
    case 'rental': return pick(D.rentals, 'レンタルID');

  }
}
/** 文章の中のリンクを、押せる形にする（v0.99.0）。[表示名](https://…) と、そのまま書いた https://… だけ。http・https 以外は出さない */
var LINK_RE = /\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]{1,500})\)|(https?:\/\/[^\s<>"'）」』]{1,500})/g;
function linkParts(text) {
  var s = String(text === null || text === undefined ? '' : text), parts = [], last = 0, m;
  LINK_RE.lastIndex = 0;
  while ((m = LINK_RE.exec(s))) {

    if (!m[2]) { var t = /[.,;:!?、。]+$/.exec(url); if (t) { tail = t[0]; url = url.slice(0, -tail.length); } }
    parts.push({ t: s.slice(last, m.index) }, { url: url, label: label || url }, { t: tail });

function linkify(text) {
  return linkParts(text).map(function (p) {

  }).join('');
}
/** ボタンやカードの中に出す文字用：リンクは表示名だけにする */
function plainLinks(text) {
  return linkParts(text).map(function (p) { return p.url ? p.label : p.t; }).join('');
}
/** ピン留めの印（どの画面も同じ 📌 に揃える） */

function esc(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {

}
function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

  if (!ymd) return null;
  var a = S.D.today.split('-'), b = String(ymd).split('-');
  return Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000);
}
var DASH = '<span class="dash">—</span>';
/** 機器のいちばん新しい更新（機器の更新日時と、収集ツールの受信日時の新しいほう。v0.35.0） */
function devStamp(d) {
  var a = String(d['更新日時'] || ''), b = String((IDX.diag[d['機器ID']] || {})['受信日時'] || '');
  return a > b ? a : b;
}
/** 新しい順（同じなら機器ID順） */
function byDevStamp(a, b) { return cmp(devStamp(b), devStamp(a)) || cmp(a['機器ID'], b['機器ID']); }
/** 更新の新しさ：今日＝緑、7日以内＝青、それより前はそのまま */
function devUpdHtml(d) {
  var s = devStamp(d);
  if (!s) return '<span class="sub">—</span>';
  var days = daysUntil(s.slice(0, 10));
  var g = (IDX.diag[d['機器ID']] || {})['受信日時'] || '';
  var how = g && g >= String(d['更新日時'] || '') ? '収集ツール' : '';
  var badge = days === 0 ? pill('今日', 'ok') : days !== null && days < 0 && days >= -7 ? pill((-days) + '日前', 'brand') : '';
  return (badge ? badge + ' ' : '') + esc(s.slice(0, 16)) + (how ? '<span class="minor">' + how + '</span>' : '');
}
function pill(text, kind) { return '<span class="pill' + (kind ? ' ' + kind : '') + '">' + esc(text) + '</span>'; }
function expiryHtml(ymd, warnDays) {
  if (!ymd) return DASH;
  var d = daysUntil(ymd);
  if (d < 0) return esc(ymd) + ' ' + pill('期限切れ', 'danger');
  if (d <= warnDays) return esc(ymd) + ' ' + pill('あと' + d + '日', 'warn');

}
function statusPill(s) {

  if (s === '保留中') return pill(s, 'warn');      // 古い名前（初期設定で「対応中」に直る）
  if (s === '対応中' || s === '実施中') return pill(s, 'brand');
  return pill(s);
}
function contractPill(s) {

  if (s === 'スポット保守') return pill(s, 'ok');

function custName(id) { var c = IDX.cust[id]; return c ? c['顧客名'] : (id || ''); }
function devLabel(id) {
  var d = IDX.dev[id];

function isOpenActivity(a) { return a['ステータス'] !== S.D.activityDone; }
function isOpenRepair(r) { return r['ステータス'] !== S.D.repairDone; }

function reindex() {
  var D = S.D;
  IDX = { cust: {}, dev: {}, lic: {}, devCount: {}, openAct: {}, alloc: {}, diag: {}, alertCount: {}, rental: {}, openLoan: {}, lastMaint: {}, project: {} };
  D.customers.forEach(function (c) { IDX.cust[c['顧客ID']] = c; });
  D.devices.forEach(function (d) {

  });

  D.activities.forEach(function (a) { if (isOpenActivity(a)) IDX.openAct[a['顧客ID']] = (IDX.openAct[a['顧客ID']] || 0) + 1; });
  D.allocations.forEach(function (a) { (IDX.alloc[a['ライセンスID']] = IDX.alloc[a['ライセンスID']] || []).push(a); });

  (D.projects || []).forEach(function (r) { IDX.project[r['案件ID']] = r; });

}

function printLogoHtml() { var logo = currentLogo(); return logo ? '<img class="plogo" src="' + esc(logo) + '" alt="">' : ''; }

var toastTimer = null;
function toast(text, isError) {
  var t = $('toast');
  t.textContent = text; t.className = isError ? 'err' : ''; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, isError ? 6000 : 2600);
}

var busyCount = 0;
function setBusy(on, fn) {
  busyCount = Math.max(0, busyCount + (on ? 1 : -1));
  $('busy').hidden = busyCount === 0;
  // v0.123.0：データの読み込み（裏で続きを読むもの）では画面を止めない。止めると、読み込みの途中に操作できなくなる
  if (on && BUSY_NO_LOCK[fn]) { lockFree++; }
  else if (!on && fn && BUSY_NO_LOCK[fn]) { lockFree = Math.max(0, lockFree - 1); }
  busyLock(busyCount - lockFree > 0, BUSY_NO_LOCK[fn] ? '' : fn);
}
var BUSY_NO_LOCK = { __nolock: 1, warmAfterSave: 1, getBootstrap: 1, getViewChanges: 1, getChanges: 1, getAlerts: 1, loadGroupBatch: 1, getCustomerActivities: 1, listPhotos: 1 };
var lockFree = 0;
// v0.115.0：待ちが長いとき（0.6秒より長い）は、画面に「保存中…」などを出して、ほかの操作を止める（2度押し・途中の操作を防ぐ）
var busyLockTimer = null, busyLockFn = '';
function busyLabel(fn) {
  if (/^(save|delete|upload|register|move|import|add|remove|set|create|rename|resolve|unresolve|pin|issue|publish|convert|renew|reset|change)/.test(fn || '')) return '保存中…';
  if (/^(login|resume)/.test(fn || '')) return 'ログイン中…';
  if (/^(get|list|plan|reveal)/.test(fn || '')) return '読み込み中…';
  return '実行中…';
}
function busyLock(on, fn) {
  var el = document.getElementById('busyLock');
  if (!on) { clearTimeout(busyLockTimer); busyLockTimer = null; if (el) el.hidden = true; return; }
  if (fn) busyLockFn = fn;
  if (busyLockTimer || (el && !el.hidden)) return;
  busyLockTimer = setTimeout(function () {
    busyLockTimer = null;
    if (busyCount === 0) return;
    if (!el) {
      el = document.createElement('div'); el.id = 'busyLock'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
      el.innerHTML = '<div class="blbox"><span class="blspin"></span><span class="bltext"></span></div>';
      ['click', 'mousedown', 'keydown', 'touchstart', 'submit'].forEach(function (t) { el.addEventListener(t, function (e) { e.stopPropagation(); e.preventDefault(); }, true); });
      document.body.appendChild(el);
    }
    el.querySelector('.bltext').textContent = busyLabel(busyLockFn);
    el.hidden = false;
  }, window.__busyLockMs !== undefined ? window.__busyLockMs : 600);
}
// 鍵がかかっている間は、キーボードの操作（Enter で送るなど）も止める
document.addEventListener('keydown', function (e) { var el = document.getElementById('busyLock'); if (el && !el.hidden) { e.preventDefault(); e.stopPropagation(); } }, true);

/** サーバーの関数を呼ぶ。トークンは自動で付ける */
/** 裏で動いている呼び出しの数（上の帯は出さないもの）。body の data-bg に出す */
var bgCount = 0;
function setBg(on) { bgCount = Math.max(0, bgCount + (on ? 1 : -1)); document.body.dataset.bg = String(bgCount); }

var PACK_FNS = { login: 1, loginWithRemember: 1, resumeSession: 1, getBootstrap: 1, getViewChanges: 1, getChanges: 1, listActivities: 1 };
function unpackRecords(v) {
  if (Array.isArray(v)) { for (var i = 0; i < v.length; i++) v[i] = unpackRecords(v[i]); return v; }

    if (Array.isArray(v.__c) && Array.isArray(v.__r)) {

}
// quiet: true … 裏の読み込み（上の細い線だけ）／'nolock' … 先に画面へ出した保存など（待ちが長くても画面を止めない。v0.126.0）

    if (PACK_FNS[fn]) p.pack = true;
    if (quiet) busy(true); else busy(true, bname);
    google.script.run
      .withSuccessHandler(function (r) {
        if (quiet) busy(false); else busy(false, bname);
        if (r && r.ok) { if (r.warm && fn !== 'warmAfterSave') warmSoon(r.warm); resolve(PACK_FNS[fn] ? unpackRecords(r) : r); return; }

        if (r && r.error === 'unauthorized' && fn !== 'login' && fn !== 'loginWithRemember' && p.token === S.token) { sessionExpired(); }
        reject(r || { message: 'サーバーから返事がありませんでした。' });
      })
      .withFailureHandler(function () {
        if (quiet) busy(false); else busy(false, bname);

      })[fn](p);

}
// 保存のあと、サーバーの控え（一覧・要対応）の作り直しを、裏で別に頼む（v0.112.0。保存の返事を待たせない）。続けて保存したときは、まとめて1回
var warmSheets = {}, warmTimer = null;
function warmSoon(sheet) {

  clearTimeout(warmTimer);
  warmTimer = setTimeout(function () {
    var list = Object.keys(warmSheets); warmSheets = {}; warmTimer = null;
    if (!list.length || !S.token) return;
    try { google.script.run.withFailureHandler(function () {}).withSuccessHandler(function () {}).warmAfterSave({ token: S.token, sheets: list }); } catch (e) { /* 作り直せなくても、読むときに作る */ }
  }, 1500);
}
function failToast(e) { if (!e || e.error !== 'unauthorized') toast((e && e.message) || 'うまくいきませんでした。', true); }

function copyText(text) {
  var done = function () { toast('コピーしました'); };
  var fallback = function () {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var okCopy = false;
    try { okCopy = document.execCommand('copy'); } catch (e) { okCopy = false; }
    document.body.removeChild(ta);
    if (okCopy) done(); else toast('コピーできませんでした。手で選んでコピーしてください。', true);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/** 起動中・入り直し中に出す画面（ログイン画面は出さない。v0.29.0） */

/** グループを1つ読む。もう届いている・読んでいる途中なら、何もしない（約束だけ返す） */
function loadGroup(g, quiet) {
  if (!S.D) return Promise.resolve();
  if (S.have[g]) return Promise.resolve();
  if (groupBusy[g]) return groupBusy[g];
  var token = S.token, epoch = S.epoch, asked = Date.now();
  S.asked[g] = asked;
  var mine = call('getBootstrap', { part: 'rest', groups: [g] }, quiet).then(function (rest) {
    if (groupBusy[g] === mine) delete groupBusy[g];
    if (S.D && S.token === token && S.epoch === epoch && !S.have[g]) applyRest(rest, asked, [g]);
  }, function (e) {
    if (groupBusy[g] === mine) delete groupBusy[g];
    groupFailed(g, e, token, epoch, quiet);
  });
  groupBusy[g] = mine;
  return mine;
}
/**
 * いくつかのグループを、1回の呼び出しでまとめて読む（v0.109.0）。
 * パソコンの裏の先読みは、前は1グループずつ順に（間を0.7秒あけて）読んでいたので、全部そろうまでに時間がかかった。
 */
function loadGroupBatch(list, quiet) {
  if (!S.D) return Promise.resolve();
  var want = list.filter(function (g) { return !S.have[g] && !groupBusy[g]; });
  var waits = list.filter(function (g) { return groupBusy[g]; }).map(function (g) { return groupBusy[g]; });
  if (!want.length) return Promise.all(waits);
  if (want.length === 1) return Promise.all(waits.concat([loadGroup(want[0], quiet)]));
  var token = S.token, epoch = S.epoch, asked = Date.now();
  want.forEach(function (g) { S.asked[g] = asked; });
  var mine = call('getBootstrap', { part: 'rest', groups: want }, quiet).then(function (rest) {
    want.forEach(function (g) { if (groupBusy[g] === mine) delete groupBusy[g]; });
    if (!(S.D && S.token === token && S.epoch === epoch)) return;
    var fresh = want.filter(function (g) { return !S.have[g]; });
    if (fresh.length) applyRest(rest, asked, fresh);
  }, function (e) {
    want.forEach(function (g) { if (groupBusy[g] === mine) delete groupBusy[g]; groupFailed(g, e, token, epoch, quiet); });
  });
  want.forEach(function (g) { groupBusy[g] = mine; });
  return Promise.all(waits.concat([mine]));
}
function groupFailed(g, e, token, epoch, quiet) {
  if (!S.D || S.token !== token || S.epoch !== epoch) return;
  if (quiet) prefetchFails[g] = (prefetchFails[g] || 0) + 1;
  if (quiet && !groupWanted(g)) return;       // 裏の先読みが失敗しただけなら、黙っておく（要るときに、もう一度読む）
  S.restFailed = true; S.failFor = S.view + '/' + S.sub;
  if (!$('modals').children.length) render();

}
function loadGroups(list, quiet) { return Promise.all(list.map(function (g) { return loadGroup(g, quiet); })); }
/** 足りないグループだけ読む */
function ensureGroups(list) {
  if (!S.D) return Promise.resolve();
  var miss = list.filter(function (g) { return !S.have[g]; });
  return miss.length ? loadGroups(miss) : Promise.resolve();
}
/** いまの画面に要るぶん（と、あれば出るぶん）を読む */
function ensureView() { return ensureGroups(viewNeed(S.view, S.sub).concat(viewSoft(S.view, S.sub))); }
/** 全部が要るとき（記録を開く窓・印刷など）に呼ぶ。もう全部あれば、何もしない */
function ensureRest() { return S.all ? Promise.resolve() : loadGroupBatch(ALL_GROUPS.filter(function (g) { return !S.have[g]; })); }
/** パソコンだけ：残りを、裏で1つずつ先読みする（開くたびに待たなくて済むように）。画面を動かすのを邪魔しないよう、間をあける */
function schedulePrefetch() {
  if (prefetchTimer || isPhone() || !S.D || S.all || window.__noPrefetch) return;     // __noPrefetch はテスト用
  prefetchTimer = setTimeout(function () {
    prefetchTimer = null;
    if (!S.D || S.all || isPhone()) return;
    if (refreshBusy || Object.keys(groupBusy).length) { schedulePrefetch(); return; }     // ほかを読んでいる間は待つ
    // 残りを全部、1回でまとめて読む（v0.109.0。前は1つずつ順に読んでいた）
    var rest = PREFETCH_ORDER.filter(function (g) { return !S.have[g] && (prefetchFails[g] || 0) < 2; });
    if (!rest.length) return;
    var token = S.token, epoch = S.epoch;
    loadGroupBatch(rest, true).then(function () { if (S.D && S.token === token && S.epoch === epoch) schedulePrefetch(); });
  }, 700);
}
/** ログインしたまま開き直したとき：core と、パソコンの最初の画面（PC管理）に要るグループを、同時に呼ぶ（待ち時間が短いほうに合う） */
function boot(token) {
  S.token = token;
  S.timing = { t0: Date.now() };
  groupBusy = {}; prefetchFails = {}; S.epoch++;
  var epoch = S.epoch;
  // 前回のデータが残っていれば、最初の画面のグループも先に読まない（届いた core のあとで、差分だけ受ける。v0.112.0）
  var hasSnap = false;
  if (!window.__noSnap) { try { var so = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null'); hasSnap = !!(so && Date.now() - so.at < SNAP_MAX_AGE); } catch (e) { hasSnap = false; } }
  var early = isPhone() || hasSnap ? [] : viewNeed('customers', 'devices');
  var coreOk = null, coreDone = new Promise(function (resolve) { coreOk = resolve; });
  early.forEach(function (g) {
    var asked = Date.now();
    var mine = call('getBootstrap', { part: 'rest', groups: [g] }).then(function (rest) {
      return coreDone.then(function (ok) {
        if (groupBusy[g] === mine) delete groupBusy[g];
        if (ok && S.D && S.token === token && S.epoch === epoch && !S.have[g]) applyRest(rest, asked, [g]);
      });
    }, function (e) {
      return coreDone.then(function (ok) {
        if (groupBusy[g] === mine) delete groupBusy[g];
        if (ok) groupFailed(g, e, token, epoch, false);
      });
    });
    groupBusy[g] = mine;
  });
  return call('getBootstrap', { part: 'core' }).then(function (core) {
    applyCore(core, token);
    coreOk(true);
  }, function (e) { coreOk(false); throw e; });
}
function notReadyHtml() {
  return S.restFailed
    ? '<p class="empty" id="restFailed">データを読み込めませんでした。<button type="button" class="btn small" data-act="retryRest">もう一度読み込む</button></p>'
    : '<p class="empty" id="restLoading">読み込んでいます…</p>';
}

$('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = $('loginBtn');
  btn.disabled = true;
  $('loginMsg').hidden = true;
  S.timing = { t0: Date.now() };
  var keep = $('loginKeep').checked;
  keepSet(KEEP_CHOICE_KEY, keep ? '1' : '0');
  call('login', { staffId: $('loginId').value, password: $('loginPw').value, remember: keep, prevRemember: keep ? rememberNow() : '', withRest: !isPhone() })
    .then(function (r) {
      // ログインできてから覚える（まちがえたものは覚えない）。チェックを外して入ったら、前に覚えたものも消す
      rememberSet(keep && r.remember ? r.remember : '');
      keepSet(LOGIN_ID_KEY, keep ? r.me.id : '');
      afterLogin(r);
      if (S.timing) S.timing.loginSrv = r.srvMs;
      if (r.rememberFailed) toast('ログインはできましたが、「ログインしたまま」は保存できませんでした。次に開いたときは、もう一度ログインしてください。', true);
    })
    .catch(function (err) {
      S.token = '';
      var m = $('loginMsg'); m.textContent = (err && err.message) || 'ログインできませんでした。'; m.hidden = false;
    })
    .then(function () { btn.disabled = false; });
});
