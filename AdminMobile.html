<script>
'use strict';
var FILE_VERSION_ADMINMOBILE = '@file-version 0.137.0';   // このファイルの版（差し替え漏れの確かめ。GAS はコメントを消すので、文字で持つ。v0.111.1）
// ===========================================================================
// スマホの一覧（v0.16.0）
//   スマホでは、数字のタイル・グラフ・Windows情報・Tips などのダッシュボードは出さない。
//   探す欄と、押しやすいカードの一覧だけ。押すと、これまでと同じ編集の窓（顧客は顧客の画面）が開く。
// ===========================================================================
var P_STEP = 50;
var P_DEF = { cust: '', dev: '', pcmode: 'dev', act: 'open', rep: 'open', lic: 'soon' };
function pState(key) {
  S.p = S.p || {};
  if (!S.p[key]) S.p[key] = { f: P_DEF[key], q: '', n: P_STEP };
  return S.p[key];
}
function pHead(title, addKey, addLabel) {
  return '<div class="head"><h1>' + esc(title) + '</h1>' + (addKey ? '<button type="button" class="btn primary small" data-act="quickNew" data-key="' + addKey + '">＋ ' + esc(addLabel) + '</button>' : '') + '</div>';
}
function pSearch(key, placeholder) {
  return '<input type="search" id="pq_' + key + '" data-pq="' + key + '" autocomplete="off" placeholder="' + esc(placeholder) + '" value="' + esc(pState(key).q) + '">';
}
function pChips(key, list) {
  var st = pState(key);
  return '<div class="chipset small" id="pf_' + key + '">' + list.map(function (c) {
    return '<button type="button" data-act="pFilter" data-key="' + key + '" data-f="' + c[0] + '" aria-pressed="' + (st.f === c[0]) + '">' + esc(c[1]) + '</button>';
  }).join('') + '</div>';
}
function pCard(act, id, row1, title, body2, cls, memo) {
  return '<button type="button"' + (cls ? ' class="' + cls + '"' : '') + ' data-act="' + act + '" data-id="' + esc(id) + '"><span class="row1">' + row1 + '</span><b>' + esc(plainLinks(title)) + '</b>' +
    (body2 ? '<span class="body2">' + esc(plainLinks(body2)) + '</span>' : '') + (memo ? '<span class="body2 pmemo">💬 ' + esc(plainLinks(memo)) + '</span>' : '') + '</button>';
}
function pListHtml(key) {
  var st = pState(key), rows = P_ROWS[key](st), shown = rows.slice(0, st.n);
  var cards = shown.map(P_CARD[key]).join('');
  var html = rows.length ? '<div class="hits"><div class="cap">' + rows.length + '件' + (rows.length > shown.length ? '（先頭の' + shown.length + '件）' : '') + '</div>' + cards + '</div>'
    : '<p class="empty">' + (st.q ? '見つかりません。' : '当てはまるものがありません。') + '</p>';
  if (rows.length > shown.length) html += '<button type="button" class="btn" data-act="pMore" data-key="' + key + '">もっと見る（あと' + (rows.length - shown.length) + '件）</button>';
  return html;
}
function pDraw(key) { var box = $('plist_' + key); if (box) box.innerHTML = pListHtml(key); }
function pBody(key, placeholder, chips) {
  return '<section class="panel plist"><div class="hpad">' + pSearch(key, placeholder) + (chips ? pChips(key, chips) : '') +
    '<div id="plist_' + key + '">' + pListHtml(key) + '</div></div></section>';
}
var P_ROWS = {
  cust: function (st) {
    var t = st.q.trim();
    return S.D.customers.filter(function (c) { return c['状態'] !== '無効' || t; })
      .filter(function (c) { return !t || textMatch(t, [c['顧客名'], c['ふりがな'], c['顧客ID'], c['先方担当者'], c['電話']]); })
      .sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
  },
  dev: function (st) {
    var t = st.q.trim();
    return S.D.devices.filter(function (d) {
      return d['状況'] !== '廃棄' && !d._pending && textMatch(t, [d['利用者'], d['ふりがな'], d['機種名'], d['メーカー'], d['シリアル'], d['設置場所'], d['部署'], (IDX.diag[d['機器ID']] || {})['コンピューター名'], custWords(d['顧客ID']), d['機器ID']]);
    }).sort(byDevStamp);      // 更新の新しい順
  },
  act: function (st) {
    var t = st.q.trim(), from = st.f === 'month' ? addDaysYmd(S.D.today, -30) : '';
    return S.D.activities.filter(function (a) {
      if (a._pending) return true;
      if (st.f === 'open' && !isOpenActivity(a)) return false;
      if (from && a['受付日'] < from) return false;
      return !t || textMatch(t, [a['内容'], custWords(a['顧客ID']), a['先方担当者'], a['受付スタッフ'], a['対応種別'], devLabel(a['機器ID'])]);
    }).sort(function (a, b) { return cmp(b['受付日'] + b['対応ID'], a['受付日'] + a['対応ID']); });
  },
  rep: function (st) {
    var t = st.q.trim();
    return S.D.repairs.filter(function (r) {
      if (st.f === 'open' && !isOpenRepair(r)) return false;
      return !t || textMatch(t, [r['件名'], r['内容'], custWords(r['顧客ID']), r['型番'], r['シリアル'], r['預かり品'], devLabel(r['機器ID'])]);
    }).sort(function (a, b) { return cmp(b['受付日'] + b['修理ID'], a['受付日'] + a['修理ID']); });
  },
  lic: function (st) {
    var t = st.q.trim(), warn = S.D.licenseWarnDays;
    return S.D.licenses.filter(function (l) {
      if (st.f === 'soon') { if (l['不使用'] === 'はい') return false; var d = daysUntil(l['有効期限']); if (d === null || d > warn) return false; }
      return !t || textMatch(t, [l['製品名'], l['契約期間'], custWords(l['顧客ID']), l['備考']]);
    }).sort(function (a, b) {
      if (st.f === 'soon') return cmp(a['有効期限'], b['有効期限']);
      return cmp(custName(a['顧客ID']) + a['製品名'], custName(b['顧客ID']) + b['製品名']);
    });
  }
};
var P_CARD = {
  cust: function (c) {
    var id = c['顧客ID'], al = IDX.alertCount[id] || 0;
    return pCard('openCustomer', id,
      (c['保守契約'] && c['保守契約'] !== 'なし' ? pill(c['保守契約'], 'brand') : '') + (al ? pill('要対応 ' + al, 'danger') : '') + (c['状態'] === '無効' ? pill('無効') : ''),
      c['顧客名'], ['機器 ' + (IDX.devCount[id] || 0) + '台', IDX.lastMaint[id] ? '前回の保守 ' + IDX.lastMaint[id] : '', c['電話']].filter(function (x) { return x; }).join('・'), '', memoText(c));
  },
  dev: function (d) {
    var id = d['機器ID'];
    return pCard('editRecord:device', id, (d['種類'] ? pill(d['種類'], 'brand') : '') + (isPendingCust(d['顧客ID']) ? pill('仮受付', 'warn') : '') + (d['状況'] === '未使用' ? pill('未使用') : ''),
      devLabel(id) || id, [custName(d['顧客ID']), d['設置場所'], d['利用者']].filter(function (x) { return x; }).join('・'), isPendingCust(d['顧客ID']) ? 'unassigned' : '', memoText(d));
  },
  act: function (a) {
    return pCard('editRecord:activity', a['対応ID'], esc(a['受付日']) + ' ' + statusPill(a['ステータス']) + quickDoneHtml('activity', a, 'span') + (a._pending ? ' ' + pill('保存中…', 'warn') : '') + (a['対応種別'] ? ' ' + esc(a['対応種別']) : '') + (a['会議で共有'] === 'はい' ? ' ' + pill('共有', 'brand') : '') + photoMark('activity', a['対応ID']),
      custName(a['顧客ID']) + (a['機器ID'] ? '　' + devLabel(a['機器ID']) : ''), a['内容'], '', memoText(a));
  },
  rep: function (r) {
    return pCard('editRecord:repair', r['修理ID'], esc(r['受付日']) + ' ' + statusPill(r['ステータス']) + quickDoneHtml('repair', r, 'span') + (r._pending ? ' ' + pill('保存中…', 'warn') : '') + (r['種別'] ? ' ' + esc(r['種別']) : '') + photoMark('repair', r['修理ID']),
      r['件名'], [custName(r['顧客ID']), r['預かり品'], r['型番']].filter(function (x) { return x; }).join('・'), '', memoText(r));
  },
  lic: function (l) {
    // 割当（どの機器で使っているか）も出す。「割当」ボタンで、割り当て・外しができる（v0.98.0）
    var id = l['ライセンスID'], al = IDX.alloc[id] || [];
    var names = al.slice(0, 3).map(function (a) { return devLabel(a['機器ID']) || a['機器ID']; });
    var use = '割当 ' + al.length + ' / ' + (l['数量'] === '' ? '—' : l['数量']) + (names.length ? '（' + names.join('、') + (al.length > names.length ? ' ほか' : '') + '）' : '');
    return pCard('editRecord:license', id, (l['不使用'] === 'はい' ? pill('不使用') + ' ' : '') + (l['有効期限'] ? '期限 ' + expiryHtml(l['有効期限'], S.D.licenseWarnDays) : '期限なし') + photoMark('license', id),
      l['製品名'], [custName(l['顧客ID']), use, l['契約期間']].filter(function (x) { return x; }).join('・'), '', memoText(l)) +
      '<button type="button" class="btn small pallocbtn" data-act="openAlloc" data-id="' + esc(id) + '">割当を開く</button>';
  }
};
function addDaysYmd(ymd, n) {
  var p = String(ymd).split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}
/** スマホの要対応の一覧（ボトムシートの中身。v0.134.0）。種類で絞れる。1件ずつ「開く」「対応済み」 */
function pAlertSheetInner() {
  var all = pcAlerts(), cat = S.pAlertCat || '';
  var counts = {};
  all.forEach(function (a) { counts[a.category] = (counts[a.category] || 0) + 1; });
  if (cat && !counts[cat]) cat = S.pAlertCat = '';
  var list = all.filter(function (a) { return !cat || a.category === cat; });
  var chips = '<div class="chipset small pacats"><button type="button" data-act="pAlertCat" data-cat="" aria-pressed="' + !cat + '">すべて ' + all.length + '</button>' +
    S.D.alertCategories.filter(function (c) { return counts[c[0]]; }).map(function (c) {
      return '<button type="button" data-act="pAlertCat" data-cat="' + esc(c[0]) + '" aria-pressed="' + (cat === c[0]) + '">' + esc(c[1]) + ' ' + counts[c[0]] + '</button>';
    }).join('') + '</div>';
  if (!list.length) return chips + '<p class="empty">要対応はありません。</p>';
  return chips + '<div class="palist">' + list.map(function (a) {
    return '<div class="paitem' + (a.level === 'danger' ? ' hot' : '') + '">' +
      '<div class="pai-top">' + pill(a.label, a.level) + '<span class="pai-cust">' + esc(custName(a.customerId)) + '</span></div>' +
      '<b>' + esc(a.title) + '</b>' + (a.detail ? '<span class="pai-detail">' + esc(a.detail) + '</span>' : '') +
      '<div class="pai-btns"><button type="button" class="btn small" data-act="pAlertOpen" data-id="' + esc(a.key) + '">開く</button>' +
      '<button type="button" class="btn small" data-act="resolveAlert" data-key="' + esc(a.key) + '">対応済みにする</button></div></div>';
  }).join('') + '</div>';
}
var PHONE_VIEWS = {
  customers: function () {
    var alerts = '';
    if (S.have.alert) {
      // v0.134.0：上には1行の帯だけ。押すと、下から一覧（ボトムシート）が出る（前は、PC用の枠が中に開いて崩れていた）
      var pa = pcAlerts(), n = pa.length, urgent = pa.filter(function (a) { return a.level === 'danger'; }).length;
      alerts = n
        ? '<button type="button" class="palertbar' + (urgent ? ' hot' : '') + '" id="pAlertBox" data-act="pAlerts"><span class="pab-ico" aria-hidden="true">⚠️</span>' +
            '<span class="pab-txt"><b>要対応 ' + n + '件</b>' + (urgent ? '<span>うち急ぎ ' + urgent + '件</span>' : '') + '</span><span class="pab-go">一覧 ›</span></button>'
        : '<p class="palertnone" id="pAlertBox">✓ 要対応はありません</p>';
    } else if (S.restFailed) {
      alerts = '<p class="note">要対応を読み込めませんでした。<button type="button" class="btn small" data-act="retryRest">もう一度読み込む</button></p>';
    } else alerts = '<p class="note" id="pAlertWait">要対応を読み込んでいます…</p>';
    // 開いたら、すべての機器を新しい順に出す。顧客から探すときは「顧客から」を押す（v0.78.0）
    var byCust = pState('pcmode').f === 'cust';
    return pHead('顧客情報') + pChips('pcmode', [['dev', 'すべての機器'], ['cust', '顧客から']]) + alerts +
      (byCust ? pBody('cust', '顧客名・ふりがな・電話で探す', null) : pBody('dev', '利用者・機種・シリアル・顧客名で探す（ひらがな可）', null));
  },
  activities: function () {
    return pHead('対応', 'activity', '対応を記録') + pBody('act', '内容・顧客名・担当で探す（ひらがな可）', [['open', '未完了'], ['month', '直近30日'], ['all', 'すべて']]) +
      '<p class="note">' + (S.D.activityTotal > S.D.activities.length ? 'スマホでは、完了していない対応と、直近90日の対応だけを読んでいます（軽くするため）。それより前は、顧客の画面か、パソコンの「対応」で見られます。' : '') + '</p>';
  },
  repairs: function () {
    if (pState('rep').f === 'all') ensureFullRepairs();
    return pHead('修理', 'repair', '修理を受け付け') + pBody('rep', '件名・顧客名・型番・預かり品で探す', [['open', '進行中'], ['all', 'すべて']]) +
      (S.repLite ? '<p class="note">スマホでは、終わっていない修理と、直近90日の修理だけを読んでいます（軽くするため）。「すべて」を選ぶと、残りも読みます。</p>' : '');
  },
  licenses: function () {
    return pHead('ライセンス', 'license', 'ライセンスを追加') + pBody('lic', '製品名・顧客名で探す（ひらがな可）', [['soon', '期限が近い・切れた'], ['all', 'すべて']]);
  }
};

// ===========================================================================
// 保守（スマホ向け・v0.15.0）
//   ① 顧客を選ぶ → ② 収集ツールの受信日時が新しい順にPCを並べる → ③ 1台ずつ確認して、備考を書いて「この台は完了」
//   （その機器の保守の記録を1件作る）→ ④ 最後に、紙の報告書を写真で撮って、顧客の保守の記録に付ける。
// ===========================================================================
var MM_SECURITY = /eset|イーセット|ウイルス|ウィルス|セキュリティ|security|antivirus|anti-virus|norton|ノートン|trend ?micro|トレンドマイクロ|mcafee|マカフィー|kaspersky|カスペルスキー|avast|bitdefender|sophos|defender/i;
var MM_PC_KIND = /ノート|デスクトップ|^PC$|パソコン/;
function mmDevices(customerId) {
  // v0.127.0：保守で見るのはPC（ノート・デスクトップ）だけ。「未使用」は出さない
  return S.D.devices.filter(function (d) { return d['顧客ID'] === customerId && d['状況'] !== '廃棄' && d['状況'] !== '未使用' && MM_PC_KIND.test(String(d['種類'] || '')) && !d._pending; })
    .sort(byDevStamp);      // 更新（機器を直した日時・収集ツールの受信日時の新しいほう）が新しい順（v0.36.0）
}
/** その機器の、今日の保守の記録（あれば） */
function mmDoneRec(deviceId) {
  var today = S.D.today;
  return S.D.maintenances.filter(function (m) { return m['機器ID'] === deviceId && m['実施日'] === today; })[0] || null;
}
function mmAgo(stamp) {
  if (!stamp) return '';
  var d = daysUntil(String(stamp).slice(0, 10));
  if (d === null || isNaN(d)) return '';
  return d === 0 ? '今日' : d === -1 ? '昨日' : d < 0 ? (-d) + '日前' : '';
}
VIEWS.mmaint = function () {
  var head = function (title, right) { return '<div class="head mmhead"><h1>' + title + '</h1>' + (right || '') + '</div>'; };
  if (!S.ready) return head('保守') + notReadyHtml();
  if (S.mm.cust && !IDX.cust[S.mm.cust]) { S.mm.cust = ''; S.mm.dev = ''; }
  if (!S.mm.cust) {
    return head('保守', '<span class="sub">顧客を選ぶ</span>') +
      '<section class="panel"><div class="hpad">' +
      '<input type="search" id="mmQ" data-mmq="1" autocomplete="off" placeholder="顧客名・ふりがなで探す" value="' + esc(S.mm.q) + '">' +
      '<div id="mmCustList">' + mmCustListHtml() + '</div></div></section>';
  }
  var cname = custName(S.mm.cust);
  if (S.mm.dev && IDX.dev[S.mm.dev]) return mmDeviceHtml(S.mm.dev, cname, head);
  S.mm.dev = '';
  var devs = mmDevices(S.mm.cust);
  var todayCount = devs.filter(function (d) { return mmAgo((IDX.diag[d['機器ID']] || {})['受信日時']) === '今日'; }).length;
  var doneCount = devs.filter(function (d) { return mmDoneRec(d['機器ID']); }).length;
  var list = devs.length ? '<div class="hits" id="mmDevList">' + devs.map(function (d) {
    var id = d['機器ID'], g = IDX.diag[id] || null, done = mmDoneRec(id);
    var when = g ? mmAgo(g['受信日時']) : '';
    var st = devStamp(d), fromTool = g && String(g['受信日時'] || '') >= String(d['更新日時'] || '');
    var sub = [g ? g['コンピューター名'] : '', st ? '更新 ' + st.slice(0, 16) + (fromTool ? '（収集ツール）' : '') : '', g ? '' : '収集ツールの情報なし',
      g && g['イベント重大'] !== '' ? '重大 ' + g['イベント重大'] : '', g && g['イベントエラー'] !== '' ? 'エラー ' + g['イベントエラー'] : ''].filter(function (x) { return x; }).join('・');
    var ago = g ? daysUntil(String(g['受信日時']).slice(0, 10)) : null;
    var cls = [done ? 'mmdone' : '', ago === 0 ? 'fresh0' : ago !== null && ago < 0 && ago >= -7 ? 'fresh7' : ''].filter(function (x) { return x; }).join(' ');
    return '<button type="button" data-act="mmDev" data-id="' + esc(id) + '"' + (cls ? ' class="' + cls + '"' : '') + '><b>' + (done ? '✓ ' : '') + esc(devLabel(id) || id) +
      (when === '今日' ? ' ' + pill('今日', 'ok') : ago !== null && ago < 0 && ago >= -7 ? ' ' + pill(when, 'brand') : '') + (g && Number(g['イベント重大']) > 0 ? ' ' + pill('重大あり', 'danger') : '') + '</b><span>' + esc(sub) + '</span></button>';
  }).join('') + '</div>' : '<p class="empty">この顧客には、使っている機器がありません。</p>';
  return head('保守', '<button type="button" class="btn small" data-act="mmCust" data-id="">顧客を変える</button>') +
    '<section class="panel"><h2>' + esc(cname) + '</h2><div class="hpad">' +
      '<div class="mmsum" id="mmSum">PC ' + devs.length + '台・今日の受信 ' + todayCount + '台・完了 ' + doneCount + '台</div>' + list + '</div></section>' +
    '<section class="panel"><h2>終わったら</h2><div class="hpad"><p class="note">紙の報告書を写真で撮って、この顧客の保守の記録に付けます。</p>' +
      '<button type="button" class="btn primary" id="mmReport" data-act="mmReport">報告書を撮って終わる</button></div></section>';
};
function mmCustListHtml() {
  var text = String(S.mm.q || '').trim();
  var recent = recentCustIds();
  var all = S.D.customers.filter(function (c) { return c['状態'] !== '無効' || recent.indexOf(c['顧客ID']) !== -1; });
  var rows, month = String(S.D.today).slice(0, 7);
  // 今月もう保守をした顧客は、ふだんの一覧には出さない（名前で探せば出る。v0.35.0）
  var doneThisMonth = function (c) { return String(IDX.lastMaint[c['顧客ID']] || '').slice(0, 7) === month; };
  var hiddenN = 0;
  if (text) rows = all.filter(function (c) { return textMatch(text, [c['顧客名'], c['ふりがな'], c['顧客ID']]); });
  else {
    // 「最近選んだ顧客」は出さない（v0.36.0）。保守契約のある顧客を、ふりがな順に
    // スポット保守の顧客は出さない（名前で探せば出る。v0.98.0）
    var rest = all.filter(function (c) { return c['保守契約'] && c['保守契約'] !== 'なし' && c['保守契約'] !== 'スポット保守'; })
      .sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
    rows = rest.filter(function (c) { if (doneThisMonth(c)) { hiddenN++; return false; } return true; });
  }
  var hiddenNote = hiddenN ? '<p class="note" id="mmHidden">今月の保守が済んだ ' + hiddenN + '社は出していません（名前で探すと出ます）。</p>' : '';
  if (!rows.length) return hiddenNote + '<p class="note">' + (text ? '見つかりません。' : hiddenN ? '今月の保守は、全部済んでいます。' : '定期保守の顧客がありません。スポット保守の顧客は、名前で探してください。') + '</p>';
  return hiddenNote + '<div class="hits"><div class="cap">' + (text ? '見つかった顧客 ' + rows.length + '件' : '定期保守の顧客（今月まだのところ）') + '</div>' +

  var targets = D.customers.filter(function (c) { return c['状態'] === '有効' && c['保守契約'] === D.maintKindRegular; })
    .sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
  if (!targets.length) return '';
  var done = {};
  D.maintenances.forEach(function (m) { if (m['種別'] === D.maintKindRegular && String(m['実施日']).slice(0, 7) === month) done[m['顧客ID']] = m['実施日']; });
  var left = targets.filter(function (c) { return !done[c['顧客ID']]; });
  var n = targets.length - left.length, pct = Math.round(n * 100 / targets.length);
  // 全社おわったら、ねぎらいの言葉だけ（数字・棒・印を重ねて出さない）
  var mTitle = '<span class="ico">📋</span><span class="grow">' + Number(D.today.slice(5, 7)) + '月の定期保守 実施状況</span>';
  // v0.119.0：見出しに出す。今月もう日程を入れたら出さない（月に1回）
  var planBtn = D.settings['定期保守のカレンダーID'] && D.maintPlanRan !== D.today.slice(0, 7) ? '<button type="button" class="btn small" id="maintPlanBtn" data-act="maintPlan">🗓 日程を自動で作る</button>' : '';
  if (!left.length) return '<section class="panel" id="maintPanel"><h2>' + mTitle + '<span class="sub">' + n + ' / ' + targets.length + '社（100%）</span>' + planBtn + '</h2><p class="alldone" id="maintDone">全社おわりました。お疲れ様でした！</p></section>';
  // 出すのは、まだの顧客だけ。「まだ」の印は全行同じなので付けず、進み具合は棒の長さと数字1つで
  return '<section class="panel fold' + (foldOpen('maint') ? ' open' : '') + '" id="maintPanel" data-act="toggleFold" data-fold="maint"><h2' + foldAttrs('maint') + '>' + mTitle + '<span class="sub">' + n + ' / ' + targets.length + '社（' + pct + '%）</span>' + planBtn + foldChev() + '</h2>' +
    '<div class="pad mbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + targets.length + '" aria-valuenow="' + n + '"><div class="mtrack"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="fsum"><div class="fchips">' + fchip('完了', n + '社', 'ok') + fchip('未実施', left.length + '社', 'warn') + '</div></div>' +
    tableHtml('dashMaint', [
      { label: '顧客', cls: 'cname', html: function (c) { return esc(c['顧客名']); } },
      { label: '前回', cls: 'nowrap', ml: '前回', html: function (c) { return IDX.lastMaint[c['顧客ID']] ? esc(IDX.lastMaint[c['顧客ID']]) : DASH; } },
      { label: '', cls: 'nowrap', html: function (c) { return '<button type="button" class="btn small" data-act="recordMaint" data-id="' + esc(c['顧客ID']) + '">実施を記録</button>'; } }
    ], left, { act: 'openCustomerMaint', id: function (c) { return c['顧客ID']; } }) + '</section>';
}

// ---- 顧客の一覧（PC管理の下半分） ----
/** 地域の名前から、いつも同じ色の番号（0〜6）を出す。並べ替えたり地域を足したりしても、色は変わらない（v0.51.0） */
function regionTone(name) {
  var h = 0, str = String(name);
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h % 7;
}
LISTS.customers = function () {
  var rows = S.D.customers.filter(function (c) { return custMatch(c); });
  rows.sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
  if (!rows.length) return '<p class="empty">' + (S.D.customers.length ? '条件に合う顧客がいません。' : 'まだ顧客がいません。「＋ 顧客を追加」から登録してください。') + '</p>';
  // 赤は「急ぎ（ディスク異常・期限切れなど）」があるときだけ。件数だけのものは落ち着いた色（v0.23.0）
  var urgent = {};
  pcAlerts().forEach(function (a) { if (a.level === 'danger') urgent[a.customerId] = (urgent[a.customerId] || 0) + 1; });
  var shown = rows.slice(0, ROW_LIMIT);
  if (custAsTable()) {
    return custTableHtml(shown, urgent) +
      (rows.length > shown.length ? '<p class="more">' + rows.length + '件のうち、先頭の' + shown.length + '件を出しています。条件を足して絞り込んでください。</p>' : '');
  }
  var cardList = shown.map(function (c) {
    var id = c['顧客ID'], n = IDX.alertCount[id] || 0, u = urgent[id] || 0;
    var attr = c._pending ? ' class="ccard pending" title="保存しています…"' : ' class="ccard click" tabindex="0" data-act="openCustomer" data-id="' + esc(id) + '"' + memoAttr(c);
    var alert = !S.ready ? '<span class="sub">…</span>' : n ? pill('要対応 ' + n + '件', u ? 'danger' : 'warn') + (u ? '<span class="minor">急ぎ ' + u + '</span>' : '') : '';
    var meta = [c['地域'], c['電話']].filter(function (x) { return x; });
    return '<div' + attr + '><div class="cc-name"><b>' + esc(c['顧客名']) + '</b>' + (c['ふりがな'] ? '<span class="minor">' + esc(c['ふりがな']) + '</span>' : '') + '</div>' +
      '<div class="cc-tags">' + contractPill(c['保守契約']) + (c['状態'] === '停止' ? ' ' + pill('停止') : '') + ' <span class="cc-dev">機器 ' + (IDX.devCount[id] || 0) + '台</span></div>' +
      (alert ? '<div class="cc-alert">' + alert + '</div>' : '') +
      (meta.length ? '<div class="cc-meta">' + esc(meta.join('・')) + '</div>' : '') + '</div>';
  });
  var cards = cardList.join('');
  // 地域で「すべて」を選んでいるとき（地域が2つ以上あれば）、地域ごとに見出しをつけて分ける（v0.49.0）
  var regionOrder = (S.D.options['地域'] || []).map(function (o) { return o.value; });
  var regs = {};
  shown.forEach(function (c) { var k = c['地域'] || '（未設定）'; (regs[k] = regs[k] || []).push(c); });
  var regKeys = regionOrder.filter(function (k) { return regs[k]; }).concat(Object.keys(regs).filter(function (k) { return regionOrder.indexOf(k) === -1 && k !== '（未設定）'; }).sort());
  if (regs['（未設定）']) regKeys.push('（未設定）');
  var body = '<div class="ccards">' + cards + '</div>';
  if (!q('cust.region') && regKeys.length > 1) {
    var byId = {};
    shown.forEach(function (c, i) { byId[c['顧客ID']] = cardList[i]; });
    body = regKeys.map(function (k, gi) {
      var tone = k === '（未設定）' ? 'rgx' : 'rg' + regionTone(k);
      return '<div class="' + tone + '"><h3 class="regh" data-region="' + esc(k) + '"><span class="ico">📍</span>' + esc(k) + '<span class="sub">' + regs[k].length + '社</span></h3>' +
        '<div class="ccards rg">' + regs[k].map(function (c) { return byId[c['顧客ID']]; }).join('') + '</div></div>';
    }).join('');
  }
  return body +
    (rows.length > shown.length ? '<p class="more">' + rows.length + '件のうち、先頭の' + shown.length + '件を出しています。条件を足して絞り込んでください。</p>' : '');
};

/**
 * 顧客の画面のタブ（v0.130.0）。よく使うものだけ並べ、残りは「その他 ▾」の中に入れる（タブが多くて探しにくかったため）。
 * いま開いているタブが「その他」の中なら、「その他」のところにその名前を出す。
 */
var CUST_TABS_MAIN = ['devices', 'activities', 'repairs', 'maint', 'licenses', 'memos'];
function custTabsHtml(tabs) {
  var btn = function (t) { return '<button type="button" role="tab" data-act="sub" data-sub="' + t[0] + '" aria-selected="' + (S.sub === t[0]) + '">' + esc(t[1]) + '</button>'; };
  var main = tabs.filter(function (t) { return CUST_TABS_MAIN.indexOf(t[0]) !== -1; });
  var more = tabs.filter(function (t) { return CUST_TABS_MAIN.indexOf(t[0]) === -1; });
  var cur = more.filter(function (t) { return t[0] === S.sub; })[0];
  return '<div class="tabs ctabs" role="tablist">' + main.map(btn).join('') + (more.length
    ? '<details class="tabmore' + (cur ? ' on' : '') + '"><summary role="tab" aria-selected="' + !!cur + '">' + (cur ? esc(cur[1]) : 'その他') + ' ▾</summary><div class="tabpop">' + more.map(btn).join('') + '</div></details>'
    : '') + '</div>';
}
// ほかのところを押したら、「その他」のタブの一覧を閉じる
document.addEventListener('click', function (e) {
  Array.prototype.forEach.call(document.querySelectorAll('details.tabmore[open]'), function (d) { if (!d.contains(e.target) || e.target.closest('.tabpop button')) d.open = false; });
}, true);

// 顧客ごとの1年の振り返り（v0.22.0）。今月を含む12か月の、対応・修理・保守の回数を月ごとに
function yearMonths() {
  var t = S.D.today, y = +t.slice(0, 4), m = +t.slice(5, 7), out = [];
  for (var i = 11; i >= 0; i--) { var mm = m - i, yy = y; while (mm < 1) { mm += 12; yy--; } out.push(yy + '-' + (mm < 10 ? '0' : '') + mm); }
  return out;
}
function yearHtml(c, acts, reps, mnts, opt) {
  opt = opt || {};
  var months = yearMonths();
  var cnt = function (list, field) {
    var o = {}; list.forEach(function (r) { var k = String(r[field] || '').slice(0, 7); o[k] = (o[k] || 0) + 1; });
    return months.map(function (k) { return o[k] || 0; });
  };
  var rows = [['対応', cnt(acts, '受付日'), 'ya'], ['修理', cnt(reps, '受付日'), 'yr'], ['保守', cnt(mnts, '実施日'), 'ym']];
  var maintRow = rows[2];
  if (opt.noMaint) rows = rows.slice(0, 2);      // v0.126.1：報告書で、定期保守の無い顧客は保守の行を出さない
  var mx = 1; rows.forEach(function (r) { r[1].forEach(function (v) { if (v > mx) mx = v; }); });
  var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
  var devs = S.D.devices.filter(function (d) { return d['顧客ID'] === c['顧客ID'] && d['状況'] === '使用中'; }).length;
  var maintMonths = maintRow[1].filter(function (v) { return v > 0; }).length;
  var head = '<p class="ynote">' + esc(months[0].replace('-', '年') + '月〜' + months[11].replace('-', '年') + '月') + '　使用中の機器 ' + devs + '台' + (opt.report ? '' : '　定期保守を実施した月：12か月のうち ' + maintMonths + 'か月') +
    (S.D.activityTotal > S.D.activities.length && !S.custActs[c['顧客ID']] ? '　<span class="note">（対応履歴をすべて読み込み中…）</span>' : '') + '</p>';
  var table = '<div class="tablewrap"><table class="ytbl"><thead><tr><th></th>' + months.map(function (k) { return '<th>' + (+k.slice(5)) + '月' + (k.slice(5) === '01' || k === months[0] ? '<small>' + k.slice(0, 4) + '</small>' : '') + '</th>'; }).join('') + '<th>合計</th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr class="' + r[2] + '"><th>' + r[0] + '</th>' + r[1].map(function (v) {
        return '<td><i style="height:' + Math.round(v / mx * 36) + 'px"></i><span>' + (v || '·') + '</span></td>';
      }).join('') + '<td class="ysum">' + sum(r[1]) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  // 内容の内訳（対応の種別・修理の内容）
  var kinds = function (list, f) { var o = {}; list.forEach(function (r) { var k = r[f] || '（未設定）'; o[k] = (o[k] || 0) + 1; }); return Object.keys(o).sort(function (a, b) { return o[b] - o[a]; }).map(function (k) { return '<span class="mchip">' + esc(k) + ' ' + o[k] + '</span>'; }).join(''); };
  var inYear = function (list, f) { return list.filter(function (r) { var k = String(r[f] || '').slice(0, 7); return k >= months[0] && k <= months[11]; }); };
  var ya = inYear(acts, '受付日'), yr = inYear(reps, '受付日');
  var detail = '<div class="ydetail"><div><h3>対応の種別</h3>' + (ya.length ? kinds(ya, '対応種別') : '<span class="note">なし</span>') + '</div>' +
    '<div><h3>修理の種別</h3>' + (yr.length ? kinds(yr, '種別') : '<span class="note">なし</span>') + '</div></div>';
  return opt.report ? head + table : head + table + detail;      // 報告書には、種別の小さな一覧（社内用）は載せない
}

      '<div class="row"><button type="submit" class="btn primary">登録する</button>' +
      (r ? '<button type="button" class="btn danger" data-act="stopRelease">配るのをやめる</button>' : '') + '</div></form>' +
    '<p class="note">ファイルを差し替えたときは、もう一度「登録する」を押してください（中身が登録のときと変わると、安全のため配りません）。</p>';
}
function loadStaff() {
  call('listStaff', {}).then(function (r) {
    S.staff = r.staff;
    var el = $('staffList'); if (el) el.innerHTML = staffHtml();
  }).catch(failToast);
}
function staffHtml() {
  if (!S.staff) return '<p class="empty">読み込んでいます…</p>';
  return tableHtml('staff', [
    { label: 'スタッフID', html: function (s) { return esc(s['スタッフID']); }, key: function (s) { return s['スタッフID']; } },
    { label: '表示名', html: function (s) { return esc(s['表示名']); }, key: function (s) { return s['表示名']; } },
    { label: '権限', html: function (s) { return s['権限'] === '管理者' ? pill('管理者', 'brand') : pill('スタッフ'); }, key: function (s) { return s['権限']; } },
    { label: '状態', html: function (s) { return s['有効'] === 'はい' ? pill('有効', 'ok') : pill('無効'); }, key: function (s) { return s['有効']; } },
    { label: '最終ログイン', html: function (s) { return s['最終ログイン'] ? esc(s['最終ログイン']) : '<span class="sub">まだ</span>'; }, key: function (s) { return s['最終ログイン']; }, cls: 'nowrap' },
    { label: '', cls: 'nowrap', html: function (s) {
      var id = esc(s['スタッフID']);
      return '<button type="button" class="btn small" data-act="editStaff" data-id="' + id + '">編集</button> <button type="button" class="btn small" data-act="resetStaff" data-id="' + id + '">パスワード再設定</button>';
    } }
  ], S.staff, {});
}

</script>
