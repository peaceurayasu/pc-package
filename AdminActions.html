var SCAN = null;

/** 四角（0〜1）→ 用紙の四隅（ピクセル）への写し方（射影変換）。Heckbert の式 */

/** 画像（img / video）を、長辺 max 以下の canvas にする */

// ---- 画面
function openScanner(form) {
  if (!form || !form.querySelector('.photos')) return;
  closeScanner();
  var box0 = form.querySelector('.photos');
  SCAN = { form: form, stream: null, timer: null, quad: null, steadySince: 0, mode: 'bw', src: null, corners: null, added: 0, live: false,
    pdf: !!(box0 && box0.dataset.photokey === 'maintenance'), pages: [] };     // 保守の報告書は、はじめから1つのPDFにまとめる（v0.30.0）
  openModal('<header><h2>書類をスキャン <span class="sub" id="scanCount"></span></h2>' +
    '<button type="button" class="btn small scanpdf" id="scanPdfBtn" data-act="scanPdfToggle" aria-pressed="' + SCAN.pdf + '">1つのPDFにまとめる</button>' +
    '<button type="button" class="x" data-act="scanClose" aria-label="閉じる">×</button></header>' +
    '<div class="body scanbody" id="scanBody"><p class="note" id="scanMsg">カメラを準備しています…</p></div>' +
    '<footer id="scanFoot"></footer>', false, false).classList.add('scanwrap');
  scanStartLive();
}
function closeScanner() {
  if (!SCAN) return;
  if (SCAN.timer) clearTimeout(SCAN.timer);
  if (SCAN.stream) SCAN.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* そのまま */ } });
  SCAN = null;
}
function scanCountText() {
  if (!SCAN) return '';
  if (SCAN.pdf) return SCAN.pages.length ? SCAN.pages.length + '枚（後でPDFにまとめます）' : '';
  return SCAN.added ? SCAN.added + '枚付けました' : '';
}
/** 撮ったページを PDF にして付けるボタン（PDF にまとめる時） */
function scanPdfButton() {
  return SCAN && SCAN.pdf && SCAN.pages.length ? '<button type="button" class="btn primary" data-act="scanPdfMake">PDFにして付ける（' + SCAN.pages.length + '枚）</button>' : '';
}
function scanCloseLabel() { return SCAN && (SCAN.added || SCAN.pages.length) ? '終わる' : 'やめる'; }
/** 端末のカメラアプリで撮る（カメラを直接使えないとき・自分で撮りたい時） */
function scanFileButtons(primary) {
  return '<label class="btn' + (primary ? ' primary' : '') + ' scanfile">カメラアプリで撮る<input type="file" accept="image/*" capture="environment" hidden data-scanfile="1"></label>' +
    '<label class="btn scanfile">写真から選ぶ<input type="file" accept="image/*" hidden data-scanfile="1"></label>';
}
function scanStartLive() {
  var body = $('scanBody'), foot = $('scanFoot');
  if (!SCAN || !body) return;
  $('scanCount').textContent = scanCountText();
  if (SCAN.stream) { SCAN.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* そのまま */ } }); SCAN.stream = null; }
  var md = navigator.mediaDevices;
  var fallback = function (why) {
    if (!SCAN || !$('scanBody')) return;
    SCAN.live = false;
    body.innerHTML = '<p class="note" id="scanMsg">' + esc(why) + '</p><p class="note">撮った後に、用紙の四隅を見つけて、まっすぐ・くっきりに直します。</p>';
    foot.innerHTML = scanFileButtons(true) + scanPdfButton() + '<span class="grow"></span><button type="button" class="btn" data-act="scanClose">' + scanCloseLabel() + '</button>';
  };
  if (!md || !md.getUserMedia) { fallback('この画面では、カメラを直接使えません。端末のカメラアプリで撮ってください。'); return; }
  var mine = SCAN, ask = (SCAN.ask = (SCAN.ask || 0) + 1);
  md.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (stream) {
    // 待っている間に閉じた・開き直した・もう一度頼んだ、なら、このカメラはすぐ止める
    if (SCAN !== mine || mine.ask !== ask || mine.stream || mine.src) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
    SCAN.stream = stream; SCAN.live = true;
    body.innerHTML = '<div class="scanstage" id="scanStage"><video id="scanVideo" playsinline muted autoplay></video><canvas id="scanOver"></canvas></div>' +
      '<p class="note" id="scanMsg">用紙を画面に入れて、少し止めてください。四隅がそろうと自動で撮ります。</p>';
    foot.innerHTML = '<button type="button" class="btn primary" id="scanShot" data-act="scanShot">撮る</button>' + scanFileButtons(false) +
      scanPdfButton() + '<span class="grow"></span><button type="button" class="btn" data-act="scanClose">' + scanCloseLabel() + '</button>';
    var video = $('scanVideo');
    video.srcObject = stream;
    var p = video.play(); if (p && p.catch) p.catch(function () { /* 自動再生できなくても、押せば撮れる */ });
    SCAN.steadySince = 0; SCAN.quad = null;
    scanLoop();

    if (SCAN !== mine || mine.ask !== ask || mine.src) return;
    fallback('この端末（または、この画面）では、カメラを直接使えませんでした。端末のカメラアプリで撮ってください。');
  });
}
function scanLoop() {

  if (vw && vh) {
    // 映像の縦横の比に、枠を合わせる（四隅の線が映像とずれないように）
    var stage = $('scanStage');
    if (stage && stage.dataset.ratio !== vw + 'x' + vh) {
      stage.dataset.ratio = vw + 'x' + vh;
      stage.style.aspectRatio = vw + ' / ' + vh;
      stage.style.maxWidth = 'calc(62vh * ' + (vw / vh).toFixed(4) + ')';
      stage.style.margin = '0 auto';
    }
    var small = scanToCanvas(video, vw, vh, SCAN_DETECT_W);
    var q = scanDetect(small.getContext('2d').getImageData(0, 0, small.width, small.height).data, small.width, small.height);
    over.width = over.clientWidth || 320; over.height = over.clientHeight || 240;

      if (msg) msg.textContent = '用紙を画面に入れてください（暗めの机の上だと見つけやすい）。見つからない時は「撮る」を押します。';

/** 今の映像を撮る */
function scanCaptureLive() {
  var video = $('scanVideo');
  if (!SCAN || !video || !video.videoWidth) return;
  if (SCAN.timer) clearTimeout(SCAN.timer);
  var src = scanToCanvas(video, video.videoWidth, video.videoHeight, SCAN_SRC_MAX);
  SCAN.live = false;
  scanEdit(src, SCAN.quad);
}
/** カメラアプリ・写真から */
function scanUseFile(file) {
  if (!SCAN || !file) return;
  var msg = $('scanMsg'); if (msg) msg.textContent = '読み込んでいます…';
  loadImageFile(file).then(function (img) {
    if (!SCAN) return;
    var src = scanToCanvas(img, img.naturalWidth || img.width, img.naturalHeight || img.height, SCAN_SRC_MAX);
    scanEdit(src, scanDetectCanvas(src));
  }).catch(failToast);
}
/** 四隅を直す画面 */
function scanEdit(src, quad) {
  if (!SCAN) return;
  if (SCAN.timer) clearTimeout(SCAN.timer);
  SCAN.live = false;
  // 四隅を直している間は、カメラを止める（電池のため。撮り直す時に開き直す）
  if (SCAN.stream) { SCAN.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* そのまま */ } }); SCAN.stream = null; }
  SCAN.src = src;

  $('scanBody').innerHTML = '<p class="note" id="scanMsg">' + (found ? '用紙の四隅を見つけました。ずれていたら、丸を動かして直してください。' : '用紙の四隅が見つかりませんでした。丸を用紙の角に動かしてください。') + '</p>' +
    '<div class="scanedit" id="scanEdit"><canvas id="scanPic"></canvas>' +
    [0, 1, 2, 3].map(function (i) { return '<span class="scanpin" data-pin="' + i + '"></span>'; }).join('') + '</div>' +
    '<div class="chipset small" id="scanModes">' + SCAN_MODES.map(function (md) {
      return '<button type="button" data-act="scanMode" data-mode="' + md[0] + '" aria-pressed="' + (SCAN.mode === md[0]) + '">' + md[1] + '</button>';
    }).join('') + '</div>';
  $('scanFoot').innerHTML = '<button type="button" class="btn" data-act="scanRetake">撮り直す</button><span class="grow"></span>' +
    '<button type="button" class="btn primary" id="scanUse" data-act="scanUse">このページを付ける</button>';
  var pic = $('scanPic');
  pic.width = src.width; pic.height = src.height;
  pic.getContext('2d').drawImage(src, 0, 0);
  scanPlacePins();
  requestAnimationFrame(scanPlacePins);
}
// 四隅の丸を、指（マウス）で動かす
var scanDrag = null;
document.addEventListener('pointerdown', function (e) {
  var pin = e.target && e.target.closest ? e.target.closest('.scanpin') : null;
  if (!pin || !SCAN || !SCAN.corners) return;
  e.preventDefault();
  scanDrag = { i: +pin.dataset.pin, id: e.pointerId };
  try { pin.setPointerCapture(e.pointerId); } catch (err) { /* そのまま */ }
});
document.addEventListener('pointermove', function (e) {
  if (!scanDrag || !SCAN || e.pointerId !== scanDrag.id) return;
  var pic = $('scanPic'); if (!pic) return;
  var r = pic.getBoundingClientRect();
  var c = SCAN.corners[scanDrag.i];
  c.x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  c.y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  scanPlacePins();
});
['pointerup', 'pointercancel'].forEach(function (type) { document.addEventListener(type, function () { scanDrag = null; }); });
window.addEventListener('resize', function () { if (SCAN && SCAN.src) scanPlacePins(); });

    obj(imgN, function () {
      add('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');

/** サーバーの返事を待つ間、画面に出しておく仮の記録。入力した値を、記録と同じ形にする */
function provisionalRecord(key, before, data) {
  var schema = S.D.schema[key], rec = {};
  if (before) Object.keys(before).forEach(function (k) { rec[k] = before[k]; });
  schema.fields.forEach(function (f) {
    var v = data[f.name];
    if (v === undefined) { if (rec[f.name] === undefined) rec[f.name] = ''; return; }
    if (Array.isArray(v)) v = v.join(',');
    else if (f.type === 'number') v = v === '' || !isFinite(Number(v)) ? '' : Number(v);
    else v = String(v).trim();
    rec[f.name] = v;
  });
  if (!before) rec[schema.idField] = 'tmp-' + (++tmpSeq);
  rec._pending = true;
  return rec;

// ---- v0.136.0：自動の更新（他の人が入れた記録を、押さなくても入れる）

var AUTO_REFRESH_MS = 5 * 60 * 1000, AUTO_AWAY_MS = 60 * 1000;

  return !!(S.D && S.ready && S.token && !refreshBusy && document.visibilityState === 'visible' && !$('modals').children.length && !typingNow() &&
    !Object.keys(S.sending || {}).length && (document.getElementById('busyLock') || { hidden: true }).hidden && !window.__noAutoRefresh);
}
function autoRefresh(force) {
  if (!autoRefreshOk()) return;

  ACT.refreshAll(null, { auto: true });
}

function autoRenderSoon() {

// ---- v0.140.0：PC のショートカットキー（文字を打っている時・窓が開いている時は効かない。Esc で窓を閉じるのは前から）

  layoutOrder: function (el) {
    // 重なり順：選んでいる図形（まとめて選んでいてもOK）を、1つ前へ／1つ後ろへ／最前面／最背面へ。並びの順がそのまま重なり順

    if (!sel.length) return;
    var isSel = function (i) { return sel.indexOf(i) !== -1; };
    var order = list.map(function (x, i) { return i; }), out;
    if (d === 'top') out = order.filter(function (i) { return !isSel(i); }).concat(order.filter(isSel));
    else if (d === 'bottom') out = order.filter(isSel).concat(order.filter(function (i) { return !isSel(i); }));
    else {
      out = order.slice();
      var step = Number(d);
      if (step > 0) { for (var i = out.length - 2; i >= 0; i--) if (isSel(out[i]) && !isSel(out[i + 1])) { var t = out[i]; out[i] = out[i + 1]; out[i + 1] = t; } }
      else { for (var k = 1; k < out.length; k++) if (isSel(out[k]) && !isSel(out[k - 1])) { var u = out[k]; out[k] = out[k - 1]; out[k - 1] = u; } }
    }
    if (out.every(function (v, i) { return v === i; })) { toast(d === 'top' || d === '1' ? 'もう一番前です' : 'もう一番後ろです'); return; }

    var before = list.slice();
    L.data.elements = out.map(function (i) { return before[i]; });
    L.sels = sel.map(function (i) { return out.indexOf(i); }).sort(function (a, b) { return a - b; });
    layoutChanged();

  if (t.dataset && t.dataset.attachfile) { onAttachFiles(t); return; }
  if (t.dataset && t.dataset.scanfile) { var sf = t.files && t.files[0]; t.value = ''; scanUseFile(sf); return; }
  if (t.id === 'logoFile') {
    var logoFile = t.files && t.files[0];
    t.value = '';
    if (!logoFile) return;
    shrinkLogo(logoFile).then(function (dataUrl) { return call('saveLogo', { dataUrl: dataUrl }); }).then(function (r) {
      S.D.logo = r.logo; showBrand(); toast('ロゴを入れました'); render();
    }).catch(failToast);
    return;
  }
  if (t.id === 'layImage') {
    var file = t.files && t.files[0];
    if (!file) return;
    if (['image/png', 'image/jpeg', 'image/gif', 'image/webp'].indexOf(file.type) === -1) { toast('背景に使える画像は PNG・JPEG・GIF・WebP です。', true); return; }
    if (file.size > S.D.layoutImageMaxBytes) { toast('画像が大きすぎます。' + Math.floor(S.D.layoutImageMaxBytes / 1024 / 1024) + 'MBまでにしてください。', true); return; }
    var layoutId = L.id;
    readFileBase64(file).then(function (base64) { return call('saveLayoutImage', { layoutId: layoutId, mimeType: file.type, base64: base64 }); }).then(function (r) {
      if (L.id !== layoutId) return;
      L.data.imageBase64 = r.imageBase64; L.data.imageMimeType = r.imageMimeType; L.data.imageMissing = false;
      var cur = L.list.filter(function (l) { return l['レイアウトID'] === layoutId; })[0]; if (cur) cur.hasImage = true;
      toast('背景の画像を入れました'); drawLayoutBox(); measureLayoutImage();
    }).catch(failToast);
    return;
  }
  if (t.dataset && t.dataset.reportmonth) {
    if (/^\d{4}-\d{2}$/.test(t.value) && t.value <= S.D.today.slice(0, 7)) { S.reportMonth = t.value; $('reportBox').innerHTML = reportBoxHtml(); loadReport(); }
    return;
  }
  var form = t.form;
  if (form && form.dataset.form && S.D.schema[form.dataset.form]) {
    if (t.dataset.dep) t.dataset.touched = '1';
    if (t.name === '対象区分') {
      Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
      refreshDependents(form);
    }
    // 修理：機器を選んだら、空いている型番とシリアルを台帳から入れる
    if (t.name === '機器ID' && form.dataset.form === 'repair' && IDX.dev[t.value]) {
      var picked = IDX.dev[t.value];
      if (form.elements['型番'] && !form.elements['型番'].value) form.elements['型番'].value = picked['機種名'] || '';
      if (form.elements['シリアル'] && !form.elements['シリアル'].value) form.elements['シリアル'].value = picked['シリアル'] || '';
    }
  }
});

/**
 * ステータスを「完了」にした時、空いていれば完了日時（対応）・完了日（修理）に今を入れる（v0.133.0）。
 * 入れた欄が「詳しい項目」の中なら、入れたことを知らせる。
 */
function autoDoneStamp(form, status) {
  var key = form && form.dataset.form;
  var target = key === 'activity' && status === S.D.activityDone ? ['完了日時', nowYmdHm()] : key === 'repair' && status === S.D.repairDone ? ['完了日', todayLocal()] : null;
  if (!target) return;
  var el = form.elements[target[0]];
  if (!el || String(el.value).trim()) return;
  el.value = target[1];
  el.classList.remove('bad');
  el.dispatchEvent(new Event('input', { bubbles: true }));
  toast(target[0] + 'に ' + target[1] + ' を入れました（「詳しい項目」で直せます）');
}

document.addEventListener('submit', function (e) {
  var form = e.target;
  if (form.id === 'loginForm') return;
  e.preventDefault();
  if (form.classList.contains('settings-form')) {
    var values = {};
    Array.prototype.forEach.call(form.querySelectorAll('[data-setting]'), function (el) { values[el.dataset.setting] = el.value; });
    var catBoxes = form.querySelectorAll('input[data-alertcat]');
    if (catBoxes.length) values['要対応に出さない種類'] = Array.prototype.filter.call(catBoxes, function (x) { return !x.checked; }).map(function (x) { return x.dataset.alertcat; }).join(',');
    call('saveSettings', { values: values }).then(function (r) {
      var D = S.D;
      D.settings = r.settings;
      D.licenseWarnDays = Number(r.settings['ライセンス期限の手前日数']);
      D.warrantyWarnDays = Number(r.settings['保証期限の手前日数']);
      D.canReveal = D.me.isAdmin || r.settings['スタッフに認証情報を見せる'] !== 'いいえ';
      showBrand();
      D.rentalOn = r.settings['レンタル機器を使う'] !== 'いいえ';
      D.bizOn = r.settings['営業・案件ツール（テスト版）を使う'] !== 'いいえ';
      D.repairLongDays = Number(r.settings['修理の長期化の日数']) || 0;
      D.staleDays = r.settings['放置の目安の日数'] === undefined ? 3 : Number(r.settings['放置の目安の日数']) || 0;
      if (!D.me.startView) D.startView = START_KEY[r.settings['開いた直後の画面']] ? r.settings['開いた直後の画面'] : D.startViews[0];
      S.alertsStale = true; S.files = null; S.cal = null;
      // RSS の設定を保存した時の表示（読みにいくのは、毎朝の処理か「いますぐ更新」）
      D.feed = { rss: { on: r.settings['RSSで自動取得する'] !== 'いいえ' && r.settings['Windows情報を取り込む'] !== 'いいえ', status: D.feed && D.feed.rss ? D.feed.rss.status : null }, hours: (function (h) { h = parseInt(h, 10); return h >= 1 && h <= 6 ? h : 6; })(r.settings['配信を確かめる間隔（時間）']) };
      toast(form.dataset.done); render();
    }).catch(failToast);
    return;
  }
  if (form.id === 'releaseForm') {
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    call('saveToolRelease', { file: $('relFile').value, version: $('relVersion').value, notes: $('relNotes').value }).then(function (r) {
      S.release = r.release || null; if (r.release) toast('v' + r.release.version + ' を登録しました');
      var box = $('releaseBox'); if (box) box.innerHTML = releaseHtml();
    }).catch(function (e) { btn.disabled = false; failToast(e); });
    return;
  }
  if (form.classList.contains('optform')) {
    var value = form.querySelector('.optvalue').value;
    call('addOption', { category: form.dataset.cat, value: value }).then(function (r) {
      S.D.options = r.options; toast('足しました'); keepScroll(render);
    }).catch(failToast);
    return;
  }
  var kind = form.dataset.form;
  var msg = form.querySelector('.msg');
  var showErr = function (err) { if (err && err.error === 'unauthorized') return; msg.textContent = (err && err.message) || 'うまくいきませんでした。'; msg.hidden = false; };
  if (kind === 'staff') {
    var isNew = form.dataset.new === '1';
    var data = { 'スタッフID': form.elements['スタッフID'].value, '表示名': form.elements['表示名'].value, '権限': form.elements['権限'].value, '有効': form.elements['有効'].value };
    call('saveStaff', { isNew: isNew, data: data }).then(function (r) {
      closeModal(form);
      if (S.staff) upsert(S.staff, 'スタッフID', r.staff);
      S.D.staffNames = (S.staff || []).filter(function (s) { return s['有効'] === 'はい'; }).map(function (s) { return s['表示名']; });
      render();
      if (r.tempPassword) tempPasswordDialog(r.staff['スタッフID'], r.tempPassword); else toast('保存しました');
    }).catch(showErr);
    return;
  }
  if (kind === 'printcustomer') {
    var popt = {};
    ['info', 'devices', 'licenses', 'layouts', 'gone', 'notes'].forEach(function (n) { popt[n] = form.querySelector('[name="' + n + '"]').checked; });
    if (!popt.info && !popt.devices && !popt.licenses && !popt.layouts) { showErr({ message: '印刷するものを、1つは選んでください。' }); return; }
    var pid = S.customerId;
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    (popt.layouts ? loadLayoutsForPrint(pid) : Promise.resolve([])).then(function (layouts) {
      if (S.customerId !== pid || !IDX.cust[pid]) return;
      if (popt.layouts && !layouts.length && !popt.info && !popt.devices && !popt.licenses) { submitBtn.disabled = false; showErr({ message: 'この顧客には、レイアウト図がまだありません。' }); return; }
      closeModal(form);
      printHtml(customerPrintHtml(pid, popt, layouts));
    }).catch(function (e) { submitBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'wininfopaste') {
    var pasteBtn = form.querySelector('button[type="submit"]');
    if (pasteBtn.disabled) return;
    pasteBtn.disabled = true;
    // 送った時点の行（返事の行番号は、これに対するもの）
    var lines = $('wi_text').value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l && l.charAt(0) !== '#'; });
    call('importWinInfo', { text: lines.join('\n') }).then(function (r) {
      pasteBtn.disabled = false;
      S.D.wininfo = r.wininfo;
      if (r.errors.length) {
        // 読めなかった行だけを残して、理由を出す（直して、もう一度「登録する」）
        $('wi_text').value = r.errors.map(function (e) { return lines[e.line - 1] || ''; }).join('\n');
        showErr({ message: r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : '') + '。読めなかった ' + r.errors.length + '行を残しています：' + r.errors.map(function (e) { return e.message; }).filter(function (m, i, all) { return all.indexOf(m) === i; }).join(' ／ ') });
        S.renderPending = true;
        return;
      }
      closeModal(form);
      toast(r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : ''));
      render();
    }).catch(function (e) { pasteBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'myprefs') {
    call('saveMyStartView', { startView: $('my_start').value }).then(function (r) {
      var D = S.D;
      D.me.startView = r.startView;
      S.q['pref.confirm'] = $('my_confirm').value;
      S.q['pref.intro'] = $('my_intro').value;
      var picked = []; [0, 1, 2, 3].forEach(function (i) { var v = $('my_b' + i).value; if (v && picked.indexOf(v) === -1) picked.push(v); });
      S.q['pref.bnav'] = picked.join(','); sendView(); render();
      D.startView = r.startView || (START_KEY[D.settings['開いた直後の画面']] ? D.settings['開いた直後の画面'] : D.startViews[0]);
      closeModal(form); toast('保存しました。次に開いた時は「' + startLabel(D.startView) + '」から始まります');
    }).catch(showErr);
    return;
  }
  if (kind === 'password') {
    if ($('pw_new').value !== $('pw_new2').value) { showErr({ message: '新しいパスワードが2回で違っています。' }); return; }
    call('changeMyPassword', { current: $('pw_cur').value, next: $('pw_new').value, remember: rememberNow(), ticket: S.ticket || '', keep: keepGet(KEEP_CHOICE_KEY) === '1' }).then(function (r) {
      if (r && r.resume) { urlTicketWrite(r.resume); ticketAt = Date.now(); }
      if (S.D) S.D.mustChangePassword = false;
      closeModal(form); toast('パスワードを変更しました');
    }).catch(showErr);
    return;
  }
  if (S.D && S.D.schema[kind]) submitRecordForm(form, false);
});

// ===========================================================================
// 起動
// ===========================================================================
(function start() {
  showBrand();
  var saved = '';
  try { saved = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { saved = ''; }
  fillLoginForm();
  if (/^[0-9a-f]{64}$/.test(saved)) {
    // セッションが切れていたら、call() の中で自動ログイン（覚えてあれば）かログイン画面に進む
    // URLの券を先に読んでから始める（読む前に終わってログイン画面になると、古い券が残るため）
    urlTicketRead(function (t) {
      S.ticket = t;
      boot(saved).catch(function () { if (!autoBusy && !resumeBusy && !autoLogin()) toLogin(''); });
    });
  } else {
    // 画面の中の保存が使えない・消えていたら、URLの券で戻す（v0.19.0）
    urlTicketRead(function (ticket) {
      if (ticket) { resumeFromTicket(ticket); return; }
      if (!autoLogin()) { toLogin(''); ($('loginId').value ? $('loginPw') : $('loginId')).focus(); }
    });
  }
})();
</script>

<script>
/** 選んでいる図形の「ロック」「隠す」を、まとめて入れ替える（全部が入っていたら外す。回線は対象外） */
function layoutFlag(key) {
  var list = L.data.elements, ids = L.sels.filter(function (i) { return list[i] && list[i].type !== 'link'; });
  if (!ids.length) return;
  var allOn = ids.every(function (i) { return list[i][key]; });
  layoutPushUndo();
  ids.forEach(function (i) { if (allOn) delete list[i][key]; else list[i][key] = true; });
  layoutChanged();
  toast(key === 'lock' ? (allOn ? 'ロックを外しました' : 'ロックしました。図の上では動かせません（一覧から外せます）') : (allOn ? '表示しました' : '隠しました。編集の画面には薄く出ます'));
}
</script>
