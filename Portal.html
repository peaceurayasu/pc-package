<!DOCTYPE html>
<html lang="ja">
<meta name="file-version" content="@file-version 0.122.0">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
/* 配置の考え方：見出し（お客様の名前）→ 切り替え → 1つの表。読むだけの画面なので操作は切り替えだけ。 */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #18222d; --muted: #5b6876; --line: #dde3ea; --line-soft: #edf0f4;
  --brand: #17508f; --brand-soft: #e6eef8;
  --ok: #17703f; --ok-soft: #e3f3ea; --warn: #9a5b00; --warn-soft: #fbf0d9; --danger: #b3261e; --danger-soft: #fbe6e4;
  --idle: #4a5562; --idle-soft: #e9edf1;
  --font: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 16px; }
header .provider { color: var(--muted); font-size: 13px; }
header img.logo { max-height: 48px; max-width: 220px; object-fit: contain; display: block; margin-bottom: 6px; }
header h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.35; }
header .date { color: var(--muted); font-size: 13px; }
.notice { display: flex; flex-direction: column; gap: 6px; }
.notice p { margin: 0; padding: 9px 12px; border-radius: 6px; }
.notice .danger { background: var(--danger-soft); color: var(--danger); }
.notice .warn { background: var(--warn-soft); color: var(--warn); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; background: #f8fafc; }
tbody tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
td .minor { color: var(--muted); font-size: 12px; display: block; }
td.body { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 220px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--idle-soft); color: var(--idle); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.empty { color: var(--muted); padding: 20px 16px; margin: 0; }
.state { text-align: center; padding: 64px 16px; color: var(--muted); }
.state h1 { color: var(--ink); font-size: 20px; margin: 0 0 8px; }
.notice .info { background: var(--brand-soft); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.notice .info.important { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.notice .info small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.pad { padding: 14px 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chipset { display: flex; flex-wrap: wrap; gap: 6px; }
.chipset button { border: 1px solid #c3ccd6; background: var(--panel); border-radius: 999px; padding: 5px 14px; min-height: 36px; }
.chipset button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; min-height: 38px; }
select { font: inherit; border: 1px solid #c3ccd6; border-radius: 6px; padding: 7px 10px; background: var(--panel); min-height: 38px; }
/* レイアウト図（管理画面と同じ描き方） */
.lay-canvas { position: relative; width: 100%; aspect-ratio: 4 / 3; border: 1px solid #c3ccd6; background: #fff; overflow: hidden; container-type: inline-size; isolation: isolate; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.lay-canvas > img.lay-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
.lay-canvas > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lay-el { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; color: #18222d; line-height: 1.25; font-size: 1.3cqw; }
.lay-el.t-rect { border: 0.22cqw solid #5b6876; }
.lay-el.t-circle { border: 0.22cqw solid #5b6876; border-radius: 50%; }
.lay-el.t-desk { border: 0.18cqw solid #8a6a3a; background: #f3e6cf; border-radius: 0.4cqw; }
.lay-el.t-chair { border: 0.18cqw solid #5b6876; border-top-width: 0.75cqw; background: #dfe6ee; border-radius: 35%; }
.lay-el.t-shelf { border: 0.18cqw solid #6b5a3c; background-color: #efe6d6; background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(25% - 0.16cqw), #6b5a3c calc(25% - 0.16cqw), #6b5a3c 25%); }
.lay-el.t-rack { border: 0.18cqw solid #2f3a46; background-color: #c9d1da; background-image: repeating-linear-gradient(0deg, transparent 0, transparent 0.9cqw, rgba(47, 58, 70, .4) 0.9cqw, rgba(47, 58, 70, .4) 1.1cqw); }
.lay-el.t-counter { border: 0.18cqw solid #5b6876; background-color: #e9edf2; border-radius: 1.2cqw; }
.lay-el.t-copier { border: 0.18cqw solid #3d4854; background-color: #d5dbe2; border-radius: 0.5cqw; box-shadow: inset 0 0.9cqw 0 #aab4bf; }
.lay-el.t-text { white-space: nowrap; justify-content: flex-start; }
.lay-el.t-pin.k-net { background: #b36b00; }
.lay-el.t-pin.k-srv { background: #3d4854; }
.lay-el.t-pin.k-prn { background: #7a5c2e; }
.lay-el.t-net { transform: translate(-50%, -50%); flex-direction: column; white-space: nowrap; gap: 0.12em; }
.lay-el.t-net .nb { background: var(--nc, #5b6876); color: #fff; font-weight: 700; border-radius: 0.35em; padding: 0.28em 0.65em; min-width: 2.2em; text-align: center; line-height: 1.1; border: 0.08em solid rgba(255, 255, 255, .75); box-shadow: 0 0.1em 0.25em rgba(20, 30, 42, .3); }
.lay-el.t-net .nn { font-size: 0.62em; font-weight: 600; background: rgba(255, 255, 255, .88); padding: 0 0.3em; border-radius: 0.3em; }
.lay-linklabel { position: absolute; transform: translate(-50%, -50%); font-size: 1.15cqw; line-height: 1.3; background: rgba(255, 255, 255, .92); padding: 0 0.5cqw; border: 1px solid #c3ccd6; border-radius: 0.4cqw; white-space: nowrap; pointer-events: none; color: #18222d; }
.lay-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 2px 0; font-size: 12px; line-height: 1.4; color: #3d4854; }
.lay-legend[hidden] { display: none; }
.lay-legend .lk { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lay-legend svg.sw { width: 30px; height: 8px; flex: none; overflow: visible; }
.lay-legend .nbk { display: inline-block; min-width: 30px; text-align: center; color: #fff; font-weight: 700; border-radius: 4px; padding: 0 4px; font-size: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.lay-el.t-icon { flex-direction: column; transform: translate(-50%, -50%); white-space: nowrap; }
.lay-el.t-icon small { font-size: 1.2cqw; }
.lay-el.t-pin { transform: translate(-50%, -50%); background: var(--brand); color: #fff; border-radius: 999px; padding: 0.3cqw 1cqw; white-space: nowrap; font-weight: 600; }
.lay-el.t-pin.k-desktop { background: #2d6a4f; }
.lay-el.t-pin.k-other { background: #6b4e9b; }
/* 月次レポート（管理画面と同じ） */
.report { max-width: 820px; margin: 0 auto; padding: 20px 18px; background: #fff; color: #18222d; }
.report h1 { font-size: 19px; margin: 0; }
.report .rhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; border-bottom: 2px solid #18222d; padding-bottom: 8px; flex-wrap: wrap; }
.report .rmeta { font-size: 12px; color: #5b6876; text-align: right; }
.report h2 { font-size: 14px; margin: 18px 0 6px; padding-left: 8px; border-left: 4px solid var(--brand); }
.report .rsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
.report .rsum div { border: 1px solid #dde3ea; border-radius: 6px; padding: 8px 10px; }
.report .rsum b { display: block; font-size: 20px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.report .rsum span { font-size: 11px; color: #5b6876; }
.report table { font-size: 13px; }
.report th { background: #f3f5f8; }
.report td.body { white-space: pre-wrap; overflow-wrap: anywhere; }
.report .rnone { color: #5b6876; font-size: 13px; margin: 0; }
.report .rnote { border: 1px solid #dde3ea; border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
.report .rfoot { margin-top: 18px; font-size: 11px; color: #5b6876; text-align: right; }
footer { color: var(--muted); font-size: 12px; text-align: center; }
/* Tips と Windows情報（いちばん上） */
.tipsbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--brand-soft); border: 1px solid #c9daf0; border-radius: 8px; padding: 9px 12px; }
.tipsbar .tag { flex: none; background: var(--brand); color: #fff; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; }
.tipsbar .tip { flex: 1 1 260px; min-width: 0; line-height: 1.5; overflow-wrap: anywhere; }
.tipsbar .tip b { margin-right: 8px; white-space: nowrap; }
.tipsbar .btn { flex: none; min-height: 32px; padding: 3px 12px; font-size: 13px; }
.tipsbar .x { flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 6px; }
.winfo h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.winfo .wi { display: flex; gap: 10px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.winfo h2 + .wi { border-top: 0; }
.winfo .wi .d { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.winfo .wi .t { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.winfo .wi .t b { display: block; }
.winfo .wi .t span { color: var(--muted); font-size: 13px; }
.winfo .wi a { flex: none; font-size: 13px; white-space: nowrap; }
/* まとめて印刷（印刷・PDFにする） */
header { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
header .grow { flex: 1; min-width: 200px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.btn:disabled { opacity: .55; cursor: default; }
.checks { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.checks label { display: flex; gap: 6px; align-items: center; min-height: 32px; }
#printPick h2 { font-size: 15px; margin: 0 0 8px; }
#printPick .note { color: var(--muted); font-size: 12px; margin: 8px 0 12px; }
#printArea { display: none; }
#printArea .phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #18222d; padding-bottom: 8px; margin-bottom: 4px; }
#printArea .phead h1 { font-size: 18px; margin: 0; }
#printArea .phead img { max-height: 36px; max-width: 170px; object-fit: contain; display: block; margin-bottom: 4px; }
#printArea .phead .pmeta { font-size: 11px; color: #5b6876; text-align: right; }
#printArea h2 { font-size: 13px; margin: 16px 0 6px; padding-left: 8px; border-left: 4px solid var(--brand); }
#printArea table { font-size: 11px; }
#printArea th, #printArea td { padding: 5px 7px; }
#printArea .scroll { overflow: visible; }
#printArea .empty { padding: 6px 0; font-size: 12px; }
#printArea .psheet { page-break-before: always; break-before: page; }
#printArea .psheet .lay-canvas { max-width: min(100%, calc(225mm * var(--r, 1.3333))) !important; page-break-inside: avoid; break-inside: avoid; }
#printArea > .phead + .psheet { page-break-before: auto; break-before: auto; }
#printArea > .phead + .psheet > .phead { display: none; }
#printArea .pill { border: 1px solid currentColor; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print {
  body.printing .wrap { display: none !important; }
  body.printing #printArea { display: block; }
  body.printing #printArea a { color: inherit; text-decoration: none; }
  body { background: #fff; }
  header, .notice, .tabs, footer, .noprint, .tipsbar, .winfo { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .panel { border: 0; }
  .report { max-width: none; padding: 0; }
  tr { page-break-inside: avoid; }
}
</style>
</head>

<script>
'use strict';
var PORTAL_TOKEN = '<?= portalToken ?>';
var P = null, TAB = '';
// 会社のロゴ（画像の data URL のときだけ出す）
(function () {
  var logo = document.body.dataset.logo || '';
  var im = document.getElementById('logo');
  if (im && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/]+={0,2}$/.test(logo)) { im.src = logo; im.hidden = false; }
})();

function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/** [表示名](https://…) と https://… を押せるリンクにする。ほかの文字は、そのまま文字として出す */
function linkify(text) {
  var s = String(text === null || text === undefined ? '' : text), out = '', last = 0, m;
  var re = /\[([^\]\n]{1,80})\]\((https?:\/\/[^\s)]{1,500})\)|(https?:\/\/[^\s<>"'）」』]{1,500})/g;
  while ((m = re.exec(s))) {
    var url = m[2] || m[3], tail = '';
    if (!m[2]) { var t = /[.,;:!?、。]+$/.exec(url); if (t) { tail = t[0]; url = url.slice(0, -tail.length); } }
    out += esc(s.slice(last, m.index)) + '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(m[1] || url) + '</a>' + esc(tail);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function pill(text, kind) { return '<span class="pill' + (kind ? ' ' + kind : '') + '">' + esc(text) + '</span>'; }
function daysUntil(ymd) {
  if (!ymd) return null;
  var a = P.today.split('-'), b = String(ymd).split('-');
  return Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000);
}
function expiryHtml(ymd, warnDays) {
  if (!ymd) return '—';
  var d = daysUntil(ymd);
  if (d < 0) return esc(ymd) + ' ' + pill('期限切れ', 'danger');
  if (d <= warnDays) return esc(ymd) + ' ' + pill('あと' + d + '日', 'warn');
  return esc(ymd);
}
function statusPill(s) {
  if (s === '完了') return pill(s, 'ok');
  if (s === '保留中') return pill(s, 'warn');
  if (s === '対応中' || s === '実施中') return pill(s, 'brand');
  return s ? pill(s) : '';
}
function table(heads, rows, empty) {
  if (!rows.length) return '<p class="empty">' + esc(empty) + '</p>';
  return '<div class="scroll"><table><thead><tr>' + heads.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}

var LABEL = { '機器': '機器', 'ライセンス': 'ライセンス', '修理': '修理の状況', '開発': '開発の進み具合', '対応': '対応の履歴', 'レイアウト': 'レイアウト図', '資料': '資料', 'レポート': '月次レポート' };
var LAY = { id: '', data: null, ratio: 4 / 3, failed: false };
var REP = { month: '', data: null, failed: '' };
function fileSizeText(n) {
  if (typeof n !== 'number') return '';
  return n >= 1024 * 1024 ? (Math.round(n / 1024 / 1024 * 10) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}
function gas(fn, params, onOk, onNg) {
  google.script.run.withSuccessHandler(function (r) { if (r && r.ok) onOk(r); else onNg((r && r.message) || '読み込めませんでした。'); })
    .withFailureHandler(function () { onNg('通信に失敗しました。少し待ってから、もう一度試してください。'); })[fn](params);
}
// 幹線図の記号と回線（管理画面と同じ見た目。IP・メモ・機器との結びつきは、サーバーが渡さない）
var NET_KINDS = {
  onu: ['ONU', '回線終端装置（ONU）', '#17508f'], router: ['RT', 'ルーター', '#2d6a4f'], fw: ['FW', 'UTM・ファイアウォール', '#b3261e'],
  hub: ['SW', 'スイッチ・HUB', '#0f766e'], ap: ['AP', '無線アクセスポイント', '#b36b00'], nas: ['NAS', 'NAS', '#6b4e9b'],
  server: ['SV', 'サーバー', '#3d4854'], mfp: ['複合', '複合機', '#7a5c2e'], port: ['LAN', '情報コンセント', '#5b6876']
};
var NET_ORDER = ['onu', 'router', 'fw', 'hub', 'ap', 'nas', 'server', 'mfp', 'port'];
var LINK_ORDER = ['wan', 'trunk', 'lan', 'wifi'];
var LINK_KINDS = { wan: ['外部回線（光など）', '#17508f', 3, ''], trunk: ['幹線', '#b3261e', 4.2, ''], lan: ['LAN', '#2d6a4f', 2, ''], wifi: ['無線', '#b36b00', 2, '8 7'] };
function layoutLegendHtml(data, fit) {
  var nets = {}, links = {}, any = false;
  data.elements.forEach(function (x) { if (x.type === 'net') { nets[x.kind] = true; any = true; } else if (x.type === 'link') { links[x.kind] = true; any = true; } });
  if (!any) return '';
  var html = '<div class="lay-legend" style="' + fit + '">';
  NET_ORDER.filter(function (k) { return nets[k]; }).forEach(function (k) { html += '<div class="lk"><span class="nbk" style="background:' + NET_KINDS[k][2] + '">' + esc(NET_KINDS[k][0]) + '</span>' + esc(NET_KINDS[k][1]) + '</div>'; });
  LINK_ORDER.filter(function (k) { return links[k]; }).forEach(function (k) {
    var s = LINK_KINDS[k];
    html += '<div class="lk"><svg class="sw" viewBox="0 0 36 9" aria-hidden="true"><line x1="0" y1="4.5" x2="36" y2="4.5" stroke="' + s[1] + '" stroke-width="' + (s[2] * 1.2) + '"' + (s[3] ? ' stroke-dasharray="' + s[3] + '"' : '') + '></line></svg>' + esc(s[0]) + '</div>';
  });
  return html + '</div>';
}
/** レイアウト図の中身（管理画面の layoutInnerHtml と同じ描き方。ピンは名前で届く） */
function layoutHtml(data, ratio) {
  var H = 1000 / ratio;
  var html = data.imageBase64 ? '<img class="lay-bg" alt="" src="data:' + esc(data.imageMimeType) + ';base64,' + esc(data.imageBase64) + '">' : '';
  var lines = '', boxes = '';
  var svgZ = function (zi, inner) { return '<svg class="lay-svg" style="z-index:' + zi + '" viewBox="0 0 1000 ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + inner + '</svg>'; };
  var netAt = {};
  data.elements.forEach(function (x) { if (x.type === 'net') netAt[x.id] = x; });
  data.elements.forEach(function (el, i) {
    if (el.hide) return;      // 隠した図形は出さない（v0.105.0）
    if (el.type === 'link') {
      var na = netAt[el.a], nb = netAt[el.b], ls = LINK_KINDS[el.kind] || LINK_KINDS.lan;
      if (!na || !nb || na.hide || nb.hide) return;

  });
  if (r.licenses) {
    var expired = r.licenses.filter(function (l) { var d = daysUntil(l['有効期限']); return d !== null && d < 0; }).length;
    var soon = r.licenses.filter(function (l) { var d = daysUntil(l['有効期限']); return d !== null && d >= 0 && d <= r.licenseWarnDays; }).length;
    if (expired) notes.push('<p class="danger">有効期限が切れているライセンスが ' + expired + ' 件あります。</p>');
    if (soon) notes.push('<p class="warn">' + r.licenseWarnDays + '日以内に有効期限が来るライセンスが ' + soon + ' 件あります。</p>');
  }
  $('notice').innerHTML = notes.join('');
  $('notice').hidden = !notes.length;
  $('state').hidden = true;
  $('page').hidden = false;
  $('printOpen').hidden = !(r.canPrint && printTabs().length);
  if (r.tips && r.tips.length) { var dp = r.today.split('-'); TIP.ix = Math.floor(Date.UTC(+dp[0], +dp[1] - 1, +dp[2]) / 86400000) % r.tips.length; }
  drawTips();
  drawWinInfo();
  enterTab();
}

function enterTab() {
  if (TAB === 'レイアウト' && !LAY.id && P.layouts.length) { openLayout(P.layouts[0].id); return; }
  if (TAB === 'レポート' && !REP.month && P.reportMonths.length) { openReport(P.reportMonths[0]); return; }
  render();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]');
  if (b) { TAB = b.dataset.tab; enterTab(); return; }
  var l = e.target.closest('[data-layout]');
  if (l) { openLayout(l.dataset.layout); return; }
  if (e.target.id === 'repPrint') { clearPrintArea(); window.print(); return; }
  if (e.target.id === 'tipNext') { TIP.ix++; drawTips(); return; }
  if (e.target.id === 'tipHide') { TIP.hidden = true; drawTips(); return; }
  if (e.target.id === 'printOpen') {
    var box = $('printPick');
    box.hidden = !box.hidden;
    if (!box.hidden && !PRINT.busy) box.innerHTML = printPickHtml();   // 読み込みの途中なら、作り直さない（押せないボタンを、押せるように見せない）
    if (!box.hidden) box.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.target.id === 'printCancel') { PRINT.cancelled = true; $('printPick').hidden = true; return; }
  if (e.target.id === 'printGo') {
    if (PRINT.busy) return;
    var picked = Array.prototype.filter.call($('printPick').querySelectorAll('input[data-print]'), function (x) { return x.checked && !x.disabled; }).map(function (x) { return x.dataset.print; });
    var msg = $('printMsg');
    if (!picked.length) { msg.textContent = '印刷するものを、1つ以上選んでください。'; msg.hidden = false; return; }
    PRINT.cancelled = false;
    var go = function () {
      PRINT.busy = false; e.target.disabled = false; msg.hidden = true;
      if (PRINT.cancelled) return;      // 読み込みを待つ間に「やめる」を押した
      $('printPick').hidden = true; printAll(picked);
    };
    if (picked.indexOf('レイアウト') === -1) { go(); return; }
    PRINT.busy = true; e.target.disabled = true;
    msg.textContent = 'レイアウト図を読み込んでいます…'; msg.hidden = false;
    loadPrintLayouts(go, function (m) { PRINT.busy = false; e.target.disabled = false; msg.textContent = 'レイアウト図を読み込めませんでした。' + m; msg.hidden = false; });
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'repMonth') openReport(e.target.value);
});

google.script.run
  .withSuccessHandler(start)
  .withFailureHandler(function () { showError('通信に失敗しました。少し待ってから、もう一度開いてください。'); })
  .getPortalData({ t: PORTAL_TOKEN });
</script>
