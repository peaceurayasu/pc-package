<script>
'use strict';
// AdminJsMobile.html … 管理画面の動き（スマホの一覧・保守・下書き・戻る・設定・変更履歴など）
// Admin.html から読み込む。順番に意味がある（Admin.html の並び順で読み込むこと）
// ===========================================================================
// スマホの一覧（v0.16.0）
//   スマホでは、数字のタイル・グラフ・Windows情報・Tips などのダッシュボードは出さない。
//   探す欄と、押しやすいカードの一覧だけ。押すと、これまでと同じ編集の窓（顧客は顧客の画面）が開く。
// ===========================================================================
var P_STEP = 50;
var P_DEF = { cust: '', act: 'open', rep: 'open', lic: 'soon' };
function pState(key) {
  S.p = S.p || {};
  if (!S.p[key]) S.p[key] = { f: P_DEF[key], q: '', n: P_STEP };
  return S.p[key];
}
function pHead(title, addKey, addLabel) {
  return '<div class="head"><h1>' + esc(title) + '</h1>' + (addKey ? '<button type="button" class="btn primary small" data-act="quickNew" data-key="' + addKey + '">＋ ' + esc(addLabel) + '</button>' : '') + '</div>';
}
function pSearch(key, placeholder) {
  return '<input type="search" id="pq_' + key + '" data-pq="' + key + '" autocomplete="off" placeholder="' + esc(placeholder) + '" value="' + esc(pState(key).q) + '">';
}
function pChips(key, list) {
  var st = pState(key);
  return '<div class="chipset small" id="pf_' + key + '">' + list.map(function (c) {
    return '<button type="button" data-act="pFilter" data-key="' + key + '" data-f="' + c[0] + '" aria-pressed="' + (st.f === c[0]) + '">' + esc(c[1]) + '</button>';
  }).join('') + '</div>';
}
function pCard(act, id, row1, title, body2) {
  return '<button type="button" data-act="' + act + '" data-id="' + esc(id) + '"><span class="row1">' + row1 + '</span><b>' + esc(title) + '</b>' +
    (body2 ? '<span class="body2">' + esc(body2) + '</span>' : '') + '</button>';
}
function pListHtml(key) {
  var st = pState(key), rows = P_ROWS[key](st), shown = rows.slice(0, st.n);
  var cards = shown.map(P_CARD[key]).join('');
  var html = rows.length ? '<div class="hits"><div class="cap">' + rows.length + '件' + (rows.length > shown.length ? '（先頭の' + shown.length + '件）' : '') + '</div>' + cards + '</div>'
    : '<p class="empty">' + (st.q ? '見つかりません。' : '当てはまるものがありません。') + '</p>';
  if (rows.length > shown.length) html += '<button type="button" class="btn" data-act="pMore" data-key="' + key + '">もっと見る（あと' + (rows.length - shown.length) + '件）</button>';
  return html;
}
function pDraw(key) { var box = $('plist_' + key); if (box) box.innerHTML = pListHtml(key); }
function pBody(key, placeholder, chips) {
  return '<section class="panel plist"><div class="hpad">' + pSearch(key, placeholder) + (chips ? pChips(key, chips) : '') +
    '<div id="plist_' + key + '">' + pListHtml(key) + '</div></div></section>';
}
var P_ROWS = {
  cust: function (st) {
    var t = st.q.trim();
    return S.D.customers.filter(function (c) { return c['状態'] !== '無効' || t; })
      .filter(function (c) { return !t || textMatch(t, [c['顧客名'], c['ふりがな'], c['顧客ID'], c['先方担当者'], c['電話']]); })
      .sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
  },
  act: function (st) {
    var t = st.q.trim(), from = st.f === 'month' ? addDaysYmd(S.D.today, -30) : '';
    return S.D.activities.filter(function (a) {
      if (a._pending) return true;
      if (st.f === 'open' && !isOpenActivity(a)) return false;
      if (from && a['受付日'] < from) return false;
      return !t || textMatch(t, [a['内容'], custWords(a['顧客ID']), a['先方担当者'], a['受付スタッフ'], a['対応種別'], devLabel(a['機器ID'])]);
    }).sort(function (a, b) { return cmp(b['受付日'] + b['対応ID'], a['受付日'] + a['対応ID']); });
  },
  rep: function (st) {
    var t = st.q.trim();
    return S.D.repairs.filter(function (r) {
      if (st.f === 'open' && !isOpenRepair(r)) return false;
      return !t || textMatch(t, [r['件名'], r['内容'], custWords(r['顧客ID']), r['型番'], r['シリアル'], r['預かり品'], devLabel(r['機器ID'])]);
    }).sort(function (a, b) { return cmp(b['受付日'] + b['修理ID'], a['受付日'] + a['修理ID']); });
  },
  lic: function (st) {
    var t = st.q.trim(), warn = S.D.licenseWarnDays;
    return S.D.licenses.filter(function (l) {
      if (st.f === 'soon') { var d = daysUntil(l['有効期限']); if (d === null || d > warn) return false; }
      return !t || textMatch(t, [l['製品名'], l['契約期間'], custWords(l['顧客ID']), l['備考']]);
    }).sort(function (a, b) {
      if (st.f === 'soon') return cmp(a['有効期限'], b['有効期限']);
      return cmp(custName(a['顧客ID']) + a['製品名'], custName(b['顧客ID']) + b['製品名']);
    });
  }
};
var P_CARD = {
  cust: function (c) {
    var id = c['顧客ID'], al = IDX.alertCount[id] || 0;
    return pCard('openCustomer', id,
      (c['保守契約'] && c['保守契約'] !== 'なし' ? pill(c['保守契約'], 'brand') : '') + (al ? pill('要対応 ' + al, 'danger') : '') + (c['状態'] === '無効' ? pill('無効') : ''),
      c['顧客名'], ['機器 ' + (IDX.devCount[id] || 0) + '台', IDX.lastMaint[id] ? '前回の保守 ' + IDX.lastMaint[id] : '', c['電話']].filter(function (x) { return x; }).join('・'));
  },
  act: function (a) {
    return pCard('editRecord:activity', a['対応ID'], esc(a['受付日']) + ' ' + statusPill(a['ステータス']) + (a['対応種別'] ? ' ' + esc(a['対応種別']) : '') + photoMark('activity', a['対応ID']),
      custName(a['顧客ID']) + (a['機器ID'] ? '　' + devLabel(a['機器ID']) : ''), a['内容']);
  },
  rep: function (r) {
    return pCard('editRecord:repair', r['修理ID'], esc(r['受付日']) + ' ' + statusPill(r['ステータス']) + (r['種別'] ? ' ' + esc(r['種別']) : '') + photoMark('repair', r['修理ID']),
      r['件名'], [custName(r['顧客ID']), r['預かり品'], r['型番']].filter(function (x) { return x; }).join('・'));
  },
  lic: function (l) {
    return pCard('editRecord:license', l['ライセンスID'], (l['有効期限'] ? '期限 ' + expiryHtml(l['有効期限'], S.D.licenseWarnDays) : '期限なし') + photoMark('license', l['ライセンスID']),
      l['製品名'], [custName(l['顧客ID']), l['数量'] !== '' ? '数量 ' + l['数量'] : '', l['契約期間']].filter(function (x) { return x; }).join('・'));
  }
};
function addDaysYmd(ymd, n) {
  var p = String(ymd).split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
}
var PHONE_VIEWS = {
  customers: function () {
    var alerts = '';
    if (S.ready) {
      var n = pcAlerts().length;
      alerts = '<section class="panel" id="pAlertBox"><div class="hpad"><button type="button" class="btn palerts" data-act="pAlerts" aria-expanded="' + !!S.pAlertsOpen + '">' +
        (n ? pill('要対応 ' + n + '件', 'danger') : pill('要対応なし', 'ok')) + '<span class="grow"></span>' + (n ? (S.pAlertsOpen ? '閉じる' : '見る') : '') + '</button>' +
        (S.pAlertsOpen && n ? alertsHtml() : '') + '</div></section>';
    } else if (S.restFailed) {
      alerts = '<p class="note">要対応を読み込めませんでした。<button type="button" class="btn small" data-act="retryRest">もう一度読み込む</button></p>';
    } else alerts = '<p class="note" id="pAlertWait">要対応を読み込んでいます…</p>';
    var nDev = S.D.devices.filter(function (d) { return d['状況'] !== '廃棄' && !d._pending; }).length;
    var allDev = '<section class="panel" id="pAllDev"><div class="hpad"><button type="button" class="btn palerts" data-act="nav" data-view="devices">' +
      pill('すべての機器 ' + nDev + '台', 'brand') + '<span class="grow"></span>見る</button></div></section>';
    return pHead('PC管理') + allDev + alerts + pBody('cust', '顧客名・ふりがな・電話で探す', null);
  },
  activities: function () {
    return pHead('対応履歴', 'activity', '対応を記録') + pBody('act', '内容・顧客名・担当で探す（ひらがな可）', [['open', '未完了'], ['month', '直近30日'], ['all', 'すべて']]) +
      '<p class="note">' + (S.D.activityTotal > S.D.activities.length ? '古い対応は、パソコンの「対応履歴」か、顧客の画面で見られます。' : '') + '</p>';
  },
  repairs: function () {
    return pHead('修理履歴', 'repair', '修理を受け付け') + pBody('rep', '件名・顧客名・型番・預かり品で探す', [['open', '進行中'], ['all', 'すべて']]);
  },
  licenses: function () {
    return pHead('ライセンス', 'license', 'ライセンスを追加') + pBody('lic', '製品名・顧客名で探す（ひらがな可）', [['soon', '期限が近い・切れた'], ['all', 'すべて']]);
  }
};

// ===========================================================================
// 保守（スマホ向け・v0.15.0）
//   ① 顧客を選ぶ → ② 収集ツールの受信日時が新しい順にPCを並べる → ③ 1台ずつ確認して、備考を書いて「この台は完了」
//   （その機器の保守の記録を1件作る）→ ④ 最後に、紙の報告書を写真で撮って、顧客の保守の記録に付ける。
// ===========================================================================
var MM_SECURITY = /eset|イーセット|ウイルス|ウィルス|セキュリティ|security|antivirus|anti-virus|norton|ノートン|trend ?micro|トレンドマイクロ|mcafee|マカフィー|kaspersky|カスペルスキー|avast|bitdefender|sophos|defender/i;
function mmDevices(customerId) {
  return S.D.devices.filter(function (d) { return d['顧客ID'] === customerId && d['状況'] !== '廃棄' && !d._pending; })
    .sort(byDevStamp);      // 更新（機器を直した日時・収集ツールの受信日時の新しいほう）が新しい順（v0.36.0）
}
/** その機器の、今日の保守の記録（あれば） */
function mmDoneRec(deviceId) {
  var today = S.D.today;
  return S.D.maintenances.filter(function (m) { return m['機器ID'] === deviceId && m['実施日'] === today; })[0] || null;
}
function mmAgo(stamp) {
  if (!stamp) return '';
  var d = daysUntil(String(stamp).slice(0, 10));
  if (d === null || isNaN(d)) return '';
  return d === 0 ? '今日' : d === -1 ? '昨日' : d < 0 ? (-d) + '日前' : '';
}
VIEWS.mmaint = function () {
  var head = function (title, right) { return '<div class="head mmhead"><h1>' + title + '</h1>' + (right || '') + '</div>'; };
  if (!S.ready) return head('保守') + notReadyHtml();
  if (S.mm.cust && !IDX.cust[S.mm.cust]) { S.mm.cust = ''; S.mm.dev = ''; }
  if (!S.mm.cust) {
    return head('保守', '<span class="sub">顧客を選ぶ</span>') +
      '<section class="panel"><div class="hpad">' +
      '<input type="search" id="mmQ" data-mmq="1" autocomplete="off" placeholder="顧客名・ふりがなで探す" value="' + esc(S.mm.q) + '">' +
      '<div id="mmCustList">' + mmCustListHtml() + '</div></div></section>';
  }
  var cname = custName(S.mm.cust);
  if (S.mm.dev && IDX.dev[S.mm.dev]) return mmDeviceHtml(S.mm.dev, cname, head);
  S.mm.dev = '';
  var devs = mmDevices(S.mm.cust);
  var todayCount = devs.filter(function (d) { return mmAgo((IDX.diag[d['機器ID']] || {})['受信日時']) === '今日'; }).length;
  var doneCount = devs.filter(function (d) { return mmDoneRec(d['機器ID']); }).length;
  var list = devs.length ? '<div class="hits" id="mmDevList">' + devs.map(function (d) {
    var id = d['機器ID'], g = IDX.diag[id] || null, done = mmDoneRec(id);
    var when = g ? mmAgo(g['受信日時']) : '';
    var st = devStamp(d), fromTool = g && String(g['受信日時'] || '') >= String(d['更新日時'] || '');
    var sub = [g ? g['コンピューター名'] : '', st ? '更新 ' + st.slice(0, 16) + (fromTool ? '（収集ツール）' : '') : '', g ? '' : '収集ツールの情報なし',
      g && g['イベント重大'] !== '' ? '重大 ' + g['イベント重大'] : '', g && g['イベントエラー'] !== '' ? 'エラー ' + g['イベントエラー'] : ''].filter(function (x) { return x; }).join('・');
    var ago = st ? daysUntil(st.slice(0, 10)) : null; when = st ? mmAgo(st) : '';      // 色・印も、並びと同じ「更新」で
    var cls = [done ? 'mmdone' : '', ago === 0 ? 'fresh0' : ago !== null && ago < 0 && ago >= -7 ? 'fresh7' : ''].filter(function (x) { return x; }).join(' ');
    return '<button type="button" data-act="mmDev" data-id="' + esc(id) + '"' + (cls ? ' class="' + cls + '"' : '') + '><b>' + (done ? '✓ ' : '') + esc(devLabel(id) || id) +
      (when === '今日' ? ' ' + pill('今日', 'ok') : ago !== null && ago < 0 && ago >= -7 ? ' ' + pill(when, 'brand') : '') + (g && Number(g['イベント重大']) > 0 ? ' ' + pill('重大あり', 'danger') : '') + '</b><span>' + esc(sub) + '</span></button>';
  }).join('') + '</div>' : '<p class="empty">この顧客には、使っている機器がありません。</p>';
  return head('保守', '<button type="button" class="btn small" data-act="mmCust" data-id="">顧客を変える</button>') +
    '<section class="panel"><h2>' + esc(cname) + '</h2><div class="hpad">' +
      '<div class="mmsum" id="mmSum">PC ' + devs.length + '台・今日の受信 ' + todayCount + '台・完了 ' + doneCount + '台</div>' + list + '</div></section>' +
    '<section class="panel"><h2>終わったら</h2><div class="hpad"><p class="note">紙の報告書を写真で撮って、この顧客の保守の記録に付けます。</p>' +
      '<button type="button" class="btn primary" id="mmReport" data-act="mmReport">報告書を撮って終わる</button></div></section>';
};
function mmCustListHtml() {
  var text = String(S.mm.q || '').trim();
  var recent = recentCustIds();
  var all = S.D.customers.filter(function (c) { return c['状態'] !== '無効' || recent.indexOf(c['顧客ID']) !== -1; });
  var rows, month = String(S.D.today).slice(0, 7);
  // 今月もう保守をした顧客は、ふだんの一覧には出さない（名前で探せば出る。v0.35.0）
  var doneThisMonth = function (c) { return String(IDX.lastMaint[c['顧客ID']] || '').slice(0, 7) === month; };
  var hiddenN = 0;
  if (text) rows = all.filter(function (c) { return textMatch(text, [c['顧客名'], c['ふりがな'], c['顧客ID']]); });
  else {
    // 「最近選んだ顧客」は出さない（v0.36.0）。保守契約のある顧客を、ふりがな順に
    var rest = all.filter(function (c) { return c['保守契約'] && c['保守契約'] !== 'なし'; })
      .sort(function (a, b) { return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']); });
    rows = rest.filter(function (c) { if (doneThisMonth(c)) { hiddenN++; return false; } return true; });
  }
  var hiddenNote = hiddenN ? '<p class="note" id="mmHidden">今月の保守が済んだ ' + hiddenN + '社は出していません（名前で探すと出ます）。</p>' : '';
  if (!rows.length) return hiddenNote + '<p class="note">' + (text ? '見つかりません。' : hiddenN ? '今月の保守は、全部済んでいます。' : '保守契約のある顧客がありません。名前で探してください。') + '</p>';
  return hiddenNote + '<div class="hits"><div class="cap">' + (text ? '見つかった顧客 ' + rows.length + '件' : '保守契約のある顧客（今月まだのところ）') + '</div>' +
    rows.slice(0, 40).map(function (c) {
      var n = mmDevices(c['顧客ID']).length;
      return '<button type="button" data-act="mmCust" data-id="' + esc(c['顧客ID']) + '"><b>' + esc(c['顧客名']) + '</b><span>' +
        (doneThisMonth(c) ? pill('今月済み', 'ok') + ' ' : '') + esc(['PC ' + n + '台', c['保守契約'] && c['保守契約'] !== 'なし' ? c['保守契約'] : '', IDX.lastMaint[c['顧客ID']] ? '前回の保守 ' + IDX.lastMaint[c['顧客ID']] : ''].filter(function (x) { return x; }).join('・')) + '</span></button>';
    }).join('') + '</div>';
}
/** 1台の確認の画面 */
function mmDeviceHtml(id, cname, head) {
  var d = IDX.dev[id], done = mmDoneRec(id);
  var g = S.mm.diagFor === id ? S.mm.diag : undefined;      // undefined … 読み込み中、null … 届いていない
  var row = function (label, value, warn) { return value === '' || value === undefined || value === null ? '' : '<dt>' + esc(label) + '</dt><dd>' + (warn ? pill(warn, 'warn') + ' ' : '') + esc(value) + '</dd>'; };
  var lics = S.D.licenses.filter(function (l) { return l['顧客ID'] === d['顧客ID'] && !l._pending && MM_SECURITY.test(l['製品名'] || ''); });
  var licHtml = lics.length ? lics.map(function (l) {
    var mine = (IDX.alloc[l['ライセンスID']] || []).some(function (a) { return a['機器ID'] === id; });
    return '<div>' + esc(l['製品名']) + (mine ? ' <span class="sub">（この機器に割当）</span>' : '') + '　期限 ' + expiryHtml(l['有効期限'], S.D.licenseWarnDays) + '</div>';
  }).join('') : '<span class="note">ウイルス対策のライセンスは登録されていません。</span>';
  var diagHtml;
  if (g === undefined && S.mm.diagErr === id) diagHtml = '<p class="note" id="mmDiagWait">収集ツールの情報を読み込めませんでした。<button type="button" class="btn small" data-act="mmRetry" data-id="' + esc(id) + '">もう一度</button></p>';
  else if (g === undefined) diagHtml = '<p class="note" id="mmDiagWait">収集ツールの情報を読み込んでいます…</p>';
  else if (!g) diagHtml = '<p class="note">この機器には、収集ツールの情報がまだ届いていません。</p>';
  else {
    var crit = Number(g['イベント重大']) || 0, err = Number(g['イベントエラー']) || 0;
    var long = function (label, text, open) {
      return text ? '<details' + (open ? ' open' : '') + '><summary>' + esc(label) + '</summary><pre>' + esc(text) + '</pre></details>' : '';
    };
    diagHtml = '<dl class="kv" id="mmKv">' +
      row('受信日時', g['受信日時'] + (mmAgo(g['受信日時']) ? '（' + mmAgo(g['受信日時']) + '）' : '')) +
      row('ウイルス対策', g['ウイルス対策ソフト']) +
      '<dt>ライセンスの期限</dt><dd>' + licHtml + '</dd>' +
      row('Windows Update', g['Windows Update']) +
      row('イベント重大', g['イベント重大'] === '' ? '' : g['イベント重大'] + '件', crit > 0 ? '要確認' : '') +
      row('イベントエラー', g['イベントエラー'] === '' ? '' : g['イベントエラー'] + '件', err > 0 ? '確認' : '') +
      row('ディスク関連', g['ディスク関連イベント']) +
      row('バッテリー', g['バッテリー状態']) +
      row('稼働時間', g['稼働時間']) +
      row('クラッシュダンプ', g['クラッシュダンプ']) +
      row('BitLocker', g['BitLocker']) +
      row('前回メンテナンス', g['前回メンテナンス']) +
      row('Cドライブ空き', g['Cドライブ空き'] === '' || g['Cドライブ空き'] === undefined ? '' : g['Cドライブ空き'] + 'GB') +
      '</dl>' + (reportBtnHtml(g) ? '<div class="row">' + reportBtnHtml(g) + '</div>' : '') +
      long('前回との比較', g['前回との比較'], true) +
      long('スタートアップ', g['スタートアップ'], false) +
      long('イベント重大の内容（' + (g['イベント重大'] === '' ? '—' : g['イベント重大']) + '件）', g['イベント重大（内容）'], crit > 0) +
      long('イベントエラーの内容（' + (g['イベントエラー'] === '' ? '—' : g['イベントエラー']) + '件）', g['イベントエラー（内容）'], false) +
      long('そのほか（OS・CPU・メモリ・ストレージ・プリンター）', ['コンピューター名', 'IPアドレス', 'OS', 'CPU', 'メモリ', 'ストレージ', 'プリンター情報', 'ツールバージョン']
        .filter(function (k) { return g[k] !== '' && g[k] !== undefined; }).map(function (k) { return '■ ' + k + '\n' + g[k]; }).join('\n\n'), false);
  }
  var note = S.mm.notes[id] !== undefined ? S.mm.notes[id] : (done ? done['内容'] : '');
  return head('保守', '<button type="button" class="btn small" data-act="mmList">← 一覧へ</button>') +
    '<section class="panel"><h2>' + (done ? '✓ ' : '') + esc(devLabel(id) || id) + ' <span class="sub">' + esc(cname) + '</span></h2><div class="hpad mmcheck" id="mmDevBox">' +

/** 顧客が、いまの絞り込みに当てはまるか。skip に渡した条件（'contract' か 'region'）は見ない */
function custMatch(c, skip) {

  if (state !== 'all' && c['状態'] !== state) return false;
  if (skip !== 'contract' && contract && (c['保守契約'] || '（未設定）') !== contract) return false;
  if (skip !== 'region' && region && (c['地域'] || '（未設定）') !== region) return false;

/**

function custChipsHtml() {
  var D = S.D;
  var row = function (qName, field, skip, order) {
    var scope = D.customers.filter(function (c) { return custMatch(c, skip); });
    var counts = {};
    scope.forEach(function (c) { var k = c[field] || '（未設定）'; counts[k] = (counts[k] || 0) + 1; });
    var cur = q(qName);
    // 出すのは、1件でもある値と、いま選んでいる値（0件になっても、外せるように残す）
    var keys = order.concat(Object.keys(counts).filter(function (k) { return order.indexOf(k) === -1; }).sort())
      .filter(function (k) { return counts[k] || k === cur; });
    if (cur && keys.indexOf(cur) === -1) keys.push(cur);

  };

  return '<p class="note" style="margin-top:0">新しい PCInfoTool.exe を、このアプリを動かしているアカウントの Google ドライブに置いて、ファイルのURLとバージョンを登録します。収集ツール（v1.2.0 以降）は起動のたびにここを確かめ、いまより新しい版なら自動で入れ替えます。ドライブの共有は「制限付き」のままで大丈夫です。</p>' +
    now +
    '<form id="releaseForm" style="display:flex;flex-direction:column;gap:12px;margin-top:12px">' +
      '<div class="field"><label for="relFile">ドライブのファイル（URL か ID）</label><input type="text" id="relFile" autocomplete="off" placeholder="https://drive.google.com/file/d/…/view" value="' + esc(r ? r.fileId : '') + '"></div>' +
      '<div class="field"><label for="relVersion">バージョン</label><input type="text" id="relVersion" inputmode="decimal" autocomplete="off" maxlength="23" placeholder="1.3.0" value="' + esc(r ? r.version : '') + '"><span class="note">ツールの $script:AppVersion と同じにします。</span></div>' +
      '<div class="field"><label for="relNotes">メモ（更新の確認で表示されます。なくてもよい）</label><textarea id="relNotes" rows="2" maxlength="300">' + esc(r ? r.notes : '') + '</textarea></div>' +
      '<div class="row"><button type="submit" class="btn primary">登録する</button>' +
      (r ? '<button type="button" class="btn danger" data-act="stopRelease">配るのをやめる</button>' : '') + '</div></form>' +
    '<p class="note">ファイルを差し替えたときは、もう一度「登録する」を押してください（中身が登録のときと変わると、安全のため配りません）。</p>';
}
function loadStaff() {
  call('listStaff', {}).then(function (r) {
    S.staff = r.staff;
    var el = $('staffList'); if (el) el.innerHTML = staffHtml();
  }).catch(failToast);
}
function staffHtml() {
  if (!S.staff) return '<p class="empty">読み込んでいます…</p>';
  return tableHtml('staff', [
    { label: 'スタッフID', html: function (s) { return esc(s['スタッフID']); }, key: function (s) { return s['スタッフID']; } },
    { label: '表示名', html: function (s) { return esc(s['表示名']); }, key: function (s) { return s['表示名']; } },
    { label: '権限', html: function (s) { return s['権限'] === '管理者' ? pill('管理者', 'brand') : pill('スタッフ'); }, key: function (s) { return s['権限']; } },
    { label: '状態', html: function (s) { return s['有効'] === 'はい' ? pill('有効', 'ok') : pill('無効'); }, key: function (s) { return s['有効']; } },
    { label: '最終ログイン', html: function (s) { return s['最終ログイン'] ? esc(s['最終ログイン']) : '<span class="sub">まだ</span>'; }, key: function (s) { return s['最終ログイン']; }, cls: 'nowrap' },
    { label: '', cls: 'nowrap', html: function (s) {
      var id = esc(s['スタッフID']);
      return '<button type="button" class="btn small" data-act="editStaff" data-id="' + id + '">編集</button> <button type="button" class="btn small" data-act="resetStaff" data-id="' + id + '">パスワード再設定</button>';
    } }
  ], S.staff, {});
}

</script>
