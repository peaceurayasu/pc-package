<script>
'use strict';
// AdminJsPhoto.html … 管理画面の動き（記録に付ける写真・書類のスキャン）
// Admin.html から読み込む。順番に意味がある（Admin.html の並び順で読み込むこと）
// ===========================================================================
// 記録に付ける写真（対応・修理・機器）

// ===========================================================================
var PHOTO_LABEL = { activity: '対応', repair: '修理', device: '機器', license: 'ライセンス', maintenance: '保守' };
var PHOTO_SIDE = 1600, PHOTO_TARGET_BYTES = 500 * 1024, THUMB_SIDE = 160;
function photoCountKey(key, id) { return PHOTO_LABEL[key] + ':' + id; }
function photoCount(key, id) { return (S.D.photoCounts && S.D.photoCounts[photoCountKey(key, id)]) || 0; }
function bumpPhotoCount(key, id, by) {
  if (!S.D) return;
  var k = photoCountKey(key, id), n = Math.max(0, photoCount(key, id) + by);
  if (n) S.D.photoCounts[k] = n; else delete S.D.photoCounts[k];
}
/** 一覧に出す「写真あり」の印 */
function photoMark(key, id) {
  var n = photoCount(key, id);
  return n ? '<span class="pmark" title="写真が' + n + '枚付いています">写真' + n + '</span>' : '';
}
function photoBoxHtml(key, id) {
  return '<div class="photos" data-photokey="' + key + '" data-photoid="' + esc(id) + '">' +
    '<div class="photos-head"><b>写真</b><span class="note">' + (id ? '選ぶと、すぐに保存されます。' : '保存すると、一緒に付きます。') + '自動で小さくします（' + S.D.photoMax + '枚まで）。</span></div>' +
    '<div class="photo-grid"></div>' +
    '<div class="photo-btns"><button type="button" class="btn small" data-act="pickCamera">カメラで撮る</button>' +
      '<button type="button" class="btn small' + (key === 'maintenance' ? ' primary' : '') + '" data-act="scanOpen">書類をスキャン</button></div>' +
    '<input type="file" accept="image/*" multiple hidden data-photofile="1" aria-label="付ける写真">' +
    '<input type="file" accept="image/*" capture="environment" hidden data-photofile="1" data-camera="1" aria-label="カメラで撮る"></div>';
}
function initPhotos(form, key, id) {
  if (!form.querySelector('.photos')) return;
  form._photos = [];        // まだ送っていない写真（新しい記録）
  form._saved = id ? null : [];   // 付いている写真（null は読み込み中）
  form._sending = 0;
  form._preparing = 0;      // 小さくしている途中の枚数
  form._chain = Promise.resolve();
  drawPhotos(form);
  if (!id) return;
  call('listPhotos', { target: key, targetId: id }, true).then(function (r) {
    form._saved = r.photos; drawPhotos(form);
  }).catch(function (e) { form._saved = []; form._loadFailed = true; drawPhotos(form); failToast(e); });
}
function drawPhotos(form) {
  var grid = form && form.querySelector('.photo-grid');
  if (!grid || !S.D) return;
  if (form._saved === null) { grid.innerHTML = '<span class="note">読み込んでいます…</span>'; return; }

    var t = safeImage(p.thumb);
    var isPdf = p['種類'] === 'application/pdf';
    return '<button type="button" class="ptile' + (isPdf ? ' ppdf' : '') + '" data-act="viewPhoto" data-id="' + esc(p['添付ID']) + '" title="' + (isPdf ? 'PDFを開く' : '大きく見る') + '">' + (t ? '<img src="' + esc(t) + '" alt="' + (isPdf ? 'PDF ' : '写真 ') + esc(p['添付ID']) + '">' : (isPdf ? 'PDF' : '写真') + '<br>' + esc(p['添付ID'])) + (isPdf ? '<span class="pdfmark">PDF</span>' : '') + '</button>';
  });

    return '<span class="ptile' + (p.kind === 'pdf' ? ' ppdf' : '') + '"><img src="' + esc(p.thumb) + '" alt="これから付ける' + (p.kind === 'pdf' ? 'PDF' : '写真') + '">' + (p.kind === 'pdf' ? '<span class="pdfmark">PDF ' + p.pages + '枚</span>' : '') + '<button type="button" class="px" data-act="dropPhoto" data-i="' + i + '" aria-label="これをやめる">×</button></span>';

  for (var i = 0; i < form._sending; i++) waits.push('<span class="ptile wait">送って<br>います…</span>');
  for (var j = 0; j < (form._preparing || 0); j++) waits.push('<span class="ptile wait">準備して<br>います…</span>');

  grid.innerHTML = saved.concat(pending, waits).join('') +

}
/** 画像ファイルを読み込む（読めない形式なら失敗する） */
function loadImageFile(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject({ message: '「' + file.name + '」は画像として読めませんでした。' }); };
    img.src = url;
  });

/** 長辺が side 以下になるように描いて、data URL にする（もとより大きくはしない）。bg を渡すと、その色で下を塗る */
function drawImage(img, side, mime, quality, bg) {
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!w || !h) throw { message: '画像の大きさが分かりませんでした。' };
  var k = Math.min(1, side / Math.max(w, h));
  var cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  var cx = cv.getContext('2d');
  if (bg) { cx.fillStyle = bg; cx.fillRect(0, 0, cv.width, cv.height); }
  cx.drawImage(img, 0, 0, cv.width, cv.height);

function dataUrlBytes(url) { var b = url.slice(url.indexOf(',') + 1); return Math.floor(b.length * 3 / 4); }
/** 写真を小さくする。→ {base64, thumb, bytes} */
function shrinkPhoto(file) {
  return loadImageFile(file).then(function (img) {
    // 大きさと画質を、目安の容量に収まるまで順に下げる
    var steps = [[PHOTO_SIDE, 0.82], [PHOTO_SIDE, 0.7], [1280, 0.7], [1280, 0.55], [1024, 0.55], [800, 0.5]];
    var url = '';
    for (var i = 0; i < steps.length; i++) {
      url = drawImage(img, steps[i][0], 'image/jpeg', steps[i][1], '#ffffff');
      if (dataUrlBytes(url) <= PHOTO_TARGET_BYTES) break;
    }
    if (url.indexOf('data:image/jpeg;base64,') !== 0 || dataUrlBytes(url) > S.D.photoMaxBytes) throw { message: '「' + file.name + '」を小さくできませんでした。' };

    if (thumb.length > S.D.photoThumbMaxChars) thumb = drawImage(img, 96, 'image/jpeg', 0.5, '#ffffff');

  });
}
/** 写真を選んだとき */
function onPhotoFiles(input) {
  var form = input.form, box = input.closest('.photos');
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  addPhotoFiles(form, box, files);
}
/** 写真を足す（選んだ写真・スキャンしたページ）。足した枚数を返す */
function addPhotoFiles(form, box, files) {
  if (!form || !box || !files.length || form._saved === null) return 0;
  var key = box.dataset.photokey, id = box.dataset.photoid;
  var room = S.D.photoMax - form._saved.length - form._photos.length - form._sending - (form._preparing || 0);
  if (files.length > room) { toast('写真は1つの記録に' + S.D.photoMax + '枚までです。' + (room > 0 ? '最初の' + room + '枚だけ付けます。' : ''), true); files = files.slice(0, Math.max(0, room)); }

  var chain = form._chain || Promise.resolve();
  form._preparing = (form._preparing || 0) + files.length;
  drawPhotos(form);
  files.forEach(function (file) {
    chain = chain.then(function () { return shrinkPhoto(file); }).then(function (p) {
      form._preparing--;
      if (!id) { form._photos.push(p); drawPhotos(form); return null; }
      form._sending++; drawPhotos(form);
      return call('uploadPhoto', { target: key, targetId: id, base64: p.base64, thumb: p.thumb }, true).then(function (r) {
        form._sending--; form._saved.push(r.photo); bumpPhotoCount(key, id, 1); S.files = null;
        drawPhotos(form); softRender();      // 窓を閉じたあとに送り終わっても、一覧の「写真N」が変わるように
      }, function (e) { form._sending--; drawPhotos(form); throw e; });
    }, function (e) { form._preparing--; drawPhotos(form); throw e; }).catch(failToast);
  });

  return files.length;
}
/** 新しい記録の写真：保存の返事でIDが決まってから、順に送る */
function takePendingPhotos(form) { return ((form && form._photos) || []).slice(); }
function restorePendingPhotos(form, photos) { if (form && form.querySelector('.photos')) { form._photos = photos.slice(); drawPhotos(form); } }
function uploadPhotos(key, rec, photos) {
  var id = rec[S.D.schema[key].idField], done = 0, failed = 0, why = '';
  var chain = Promise.resolve();
  photos.forEach(function (p) {
    chain = chain.then(function () {
      return call('uploadPhoto', { target: key, targetId: id, base64: p.base64, thumb: p.thumb, kind: p.kind || '', pages: p.pages || 0 }, true).then(function () { done++; bumpPhotoCount(key, id, 1); },
        function (e) { failed++; why = (e && e.message) || ''; });
    });
  });
  return chain.then(function () {
    if (!S.D) return;
    S.files = null;
    if (failed) toast('写真 ' + failed + '枚を付けられませんでした。記録を開いて、もう一度付けてください。' + (why ? '（' + why + '）' : ''), true);

    softRender();
  });

// ===========================================================================
// 書類のスキャン（v0.18.0）
//   カメラの映像から用紙の四隅を見つけ、止まったら自動で撮る（使える端末だけ。GAS の画面は Google の枠の中なので、
//   カメラを直接使えない端末もある。そのときは端末のカメラアプリで撮って、同じ補正をかける）。
//   撮ったあとは、四隅を指で直せる。用紙をまっすぐにして、白黒くっきり／カラー／そのまま を選んで、写真として付ける。
//   画像の処理はすべてこの端末の中で行う（外のサービスには送らない）。
// ===========================================================================
var SCAN = null;
var SCAN_SRC_MAX = 2400;        // 補正に使う元の画像の長辺（スマホのメモリに収める）
var SCAN_OUT_MAX = 1800;        // 補正したあとの長辺
var SCAN_DETECT_W = 320;        // 用紙を探すときの幅（小さくして速く）
var SCAN_STEADY_MS = 1200;      // この時間、四隅が止まっていたら自動で撮る
var SCAN_MODES = [['bw', '白黒くっきり'], ['color', 'カラー'], ['raw', 'そのまま']];

/** 明るさ（0〜255）の配列 */
function scanGray(data, n) {
  var g = new Uint8ClampedArray(n);
  for (var i = 0, j = 0; i < n; i++, j += 4) g[i] = (data[j] * 77 + data[j + 1] * 150 + data[j + 2] * 29) >> 8;

/** 大津の方法で、明るい・暗いの境目を決める */
function scanOtsu(g) {
  var hist = new Array(256).fill(0), n = g.length, i;
  for (i = 0; i < n; i++) hist[g[i]]++;

  var sumB = 0, wB = 0, best = 0, th = 128;
  for (i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    var wF = n - wB; if (!wF) break;
    sumB += i * hist[i];
    var mB = sumB / wB, mF = (sum - sumB) / wF, v = wB * wF * (mB - mF) * (mB - mF);

}
/**
 * 用紙（まわりより明るい四角）の四隅を探す。
 * @return {Array<{x:number,y:number}>|null} 左上・右上・右下・左下（0〜1の割合）。見つからなければ null

// ---- 画面
function openScanner(form) {
  if (!form || !form.querySelector('.photos')) return;
  closeScanner();
  var box0 = form.querySelector('.photos');
  SCAN = { form: form, stream: null, timer: null, quad: null, steadySince: 0, mode: 'bw', src: null, corners: null, added: 0, live: false,

    else if (f.type === 'number') v = v === '' || !isFinite(Number(v)) ? '' : Number(v);
    else v = String(v).trim();
    rec[f.name] = v;
  });
  if (!before) rec[schema.idField] = 'tmp-' + (++tmpSeq);
  rec._pending = true;
  return rec;
}
/** 窓が開いていたら、閉じたときに描き直す。開いていなければ、すぐ描き直す */
function softRender() {
  if ($('modals').children.length) S.renderPending = true; else render();
}


// ---- 割当 ----
function openAlloc(licenseId) {
  var l = IDX.lic[licenseId];
  if (!l) return;
  openModal('<header><h2>割当 <span class="sub">' + esc(l['製品名']) + '</span></h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
    '<div class="body" id="allocBody" data-license="' + esc(licenseId) + '">' + allocHtml(licenseId) + '</div>' +
    '<footer><span class="grow"></span><button type="button" class="btn primary" data-act="closeModal">閉じる</button></footer>');
}
function allocHtml(licenseId) {
  var l = IDX.lic[licenseId];
  var allocs = IDX.alloc[licenseId] || [];
  var used = {};
  allocs.forEach(function (a) { used[a['機器ID']] = a; });
  var devs = S.D.devices.filter(function (d) { return d['顧客ID'] === l['顧客ID'] && (d['状況'] !== '廃棄' || used[d['機器ID']]); });
  var full = typeof l['数量'] === 'number' && l['数量'] > 0 && allocs.length >= l['数量'];
  return '<p class="note">' + esc(custName(l['顧客ID'])) + '　割当 ' + allocs.length + ' / 数量 ' + (l['数量'] === '' ? '—' : esc(l['数量'])) + '</p>' +
    (devs.length ? '<div class="scroll"><table><tbody>' + devs.map(function (d) {
      var a = used[d['機器ID']];
      return '<tr><td>' + esc(devLabel(d['機器ID'])) + '<span class="minor">' + esc(d['種類']) + (d['シリアル'] ? ' / ' + esc(d['シリアル']) : '') + '</span></td>' +
        '<td class="nowrap" style="text-align:right">' + (a
          ? pill('割当済み', 'ok') + ' <button type="button" class="btn small" data-act="removeAlloc" data-id="' + esc(a['割当ID']) + '">外す</button>'
          : '<button type="button" class="btn small"' + (full ? ' disabled title="数量を超えるので割り当てられません"' : '') + ' data-act="addAlloc" data-device="' + esc(d['機器ID']) + '">割り当てる</button>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<p class="note">この顧客には、割り当てられる機器がありません。</p>');
}
function refreshAlloc() {
  var el = $('allocBody');
  if (el) el.innerHTML = allocHtml(el.dataset.license);
  refreshList();
  if (S.view === 'customer') render();
}

    '<div class="grid2"><div class="field"><label for="st_role">権限</label><select id="st_role" name="権限">' + optionsHtml(S.D.roles, s['権限']) + '</select></div>' +

function openPasswordForm() {
  openModal('<header><h2>パスワード変更</h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
    '<form data-form="password" novalidate><div class="body"><p class="msg" hidden></p>' +

    '<div class="field"><label for="pw_new2">新しいパスワード（もう一度）</label><input type="password" id="pw_new2" autocomplete="new-password"></div>' +
    '</div><footer><span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button><button type="submit" class="btn primary">変更する</button></footer></form>', true);
}
