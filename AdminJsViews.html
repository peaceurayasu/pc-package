<script>
'use strict';
// AdminJsViews.html … 管理画面の動き（画面の切り替え・表・各画面・入力の画面・ミーティング）
// Admin.html から読み込む。順番に意味がある（Admin.html の並び順で読み込むこと）
// ===========================================================================
// 画面の切り替え
// ===========================================================================
// 上のメニュー。最初の3つは、前のダッシュボードと同じ並び（PC管理・対応履歴・修理履歴）
var NAV = [
  ['customers', 'PC管理'], ['activities', '対応履歴'], ['repairs', '修理履歴'], ['meeting', 'ミーティング'],
  ['licenses', 'ライセンス'], ['rentals', 'レンタル'], ['notices', 'お知らせ'], ['settings', '設定']
];
// rest が届くまで中身を出せない画面
var NEEDS_REST = { devices: 1, meeting: 1, activities: 1, repairs: 1, licenses: 1, rentals: 1, notices: 1, settings: 1 };
function navVisible(view) {
  if (view === 'settings' || view === 'audit') return S.D.me.isAdmin;
  if (view === 'rentals') return S.D.rentalOn;
  return true;
}
function mtgFullOff() {
  document.body.classList.remove('mtgfull');
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) { /* 何もしない */ }
}
document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement) document.body.classList.remove('mtgfull'); });
function go(view, opts) {
  S.restoreY = 0; S.restoreRec = '';      // 自分で画面を移ったら、読み直し前の場所へは戻さない
  guardLayout(function () {
    if (view !== 'meeting' && document.body.classList.contains('mtgfull')) mtgFullOff();
    S.view = view;
    if (opts) Object.keys(opts).forEach(function (k) { S[k] = opts[k]; });
    render();
    window.scrollTo(0, 0);
    armBack();
  });
}
// ---- スタッフごとに、絞り込み・並び替え・期間の種類を覚える（スタッフのシートの「画面設定」に入る。どの端末でも同じ状態で始まる）
var VIEW_SAVE_DELAY = 2500;      // 操作が止まってから保存するまで（ミリ秒）。押すたびには送らない
var viewSaved = '', viewTimer = null, viewOff = false;
function viewSnapshot() {
  var out = { q: {}, sort: {}, per: {} };
  Object.keys(S.q).forEach(function (k) { if (typeof S.q[k] === 'string' && S.q[k].length <= 100 && /^[a-z]{2,12}\.[A-Za-z]{2,16}$/.test(k)) out.q[k] = S.q[k]; });
  Object.keys(S.sort).forEach(function (k) { var v = S.sort[k]; if (v && /^[A-Za-z]{2,20}$/.test(k)) out.sort[k] = { i: v.i, dir: v.dir }; });
  Object.keys(S.per).forEach(function (k) { if (S.per[k] && S.per[k].mode) out.per[k] = { mode: S.per[k].mode }; });
  return out;
}
/** 覚えてあった状態を、画面に入れる（ログインした直後） */
function applyViewState(vs) {
  vs = vs || {};
  S.q = {}; S.sort = {}; S.per = {};
  Object.keys(vs.q || {}).forEach(function (k) { if (typeof vs.q[k] === 'string') S.q[k] = vs.q[k]; });
  Object.keys(vs.sort || {}).forEach(function (k) { var v = vs.sort[k]; if (v && (v.dir === 1 || v.dir === -1) && v.i >= 0) S.sort[k] = { i: v.i, dir: v.dir }; });
  Object.keys(vs.per || {}).forEach(function (k) { var v = vs.per[k]; if (v && S.D.viewPeriodModes.indexOf(v.mode) !== -1) perState(k).mode = v.mode; });
  viewSaved = JSON.stringify(viewSnapshot());
  viewOff = false;
}
function sendView() {
  clearTimeout(viewTimer); viewTimer = null;
  if (!S.D || viewOff) return Promise.resolve();
  var snap = viewSnapshot(), json = JSON.stringify(snap);
  if (json === viewSaved) return Promise.resolve();
  viewSaved = json;
  return call('saveMyView', { view: snap }, true).catch(function (e) {
    // 列がまだ無い（初期設定をやり直していない）ときは、このあとは送らない。ほかの失敗は、次の操作でまた送る
    if (e && e.error === 'setup') viewOff = true; else viewSaved = '';
  });
}
/** 絞り込みなどが変わっていたら、少し待ってから保存する */
function rememberView() {
  if (!S.D || viewOff || viewTimer) return;
  if (JSON.stringify(viewSnapshot()) === viewSaved) return;
  viewTimer = setTimeout(sendView, VIEW_SAVE_DELAY);
}

// ---- Tips（Windows の便利機能）。いちばん上に1件ずつ。日替わりで変わる。× で、その日は出さない ----
var TIPS_VIEWS = { customers: 1, activities: 1, repairs: 1, licenses: 1, rentals: 1, notices: 1 };
function tipIndex() {
  var n = S.D.tips.length;
  if (S.tipIx === undefined || S.tipIx === null) {
    var p = S.D.today.split('-');
    S.tipIx = Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000) % n;
  }
  return ((S.tipIx % n) + n) % n;
}
function tipsBarHtml() {
  var D = S.D;
  if (!D.tips || !D.tips.length || !TIPS_VIEWS[S.view] || q('tips.hide') === D.today || isPhone()) return '';
  var t = D.tips[tipIndex()];
  return '<div class="tipsbar" id="tipsBar"><span class="tag">Tips</span><span class="tip"><b>' + esc(t.t) + '</b>' + esc(t.b) + '</span>' +
    '<button type="button" class="btn small" data-act="tipNext">次のTips</button>' +
    '<button type="button" class="x" data-act="tipHide" aria-label="今日は出さない" title="今日は出さない">×</button></div>';
}
/** リンクは https:// で始まるものだけを出す */
function safeLink(url) { return typeof url === 'string' && /^https:\/\/[^\s"'<>\\]+$/.test(url) ? url : ''; }
/** 日付の新しい順（同じ日は、あとから登録したものが先） */
function winInfoSorted() {
  return (S.D.wininfo || []).slice().sort(function (a, b) { return cmp(String(b['日付']) + b['情報ID'], String(a['日付']) + a['情報ID']); });
}
function winInfoPinned(w) { return (S.D.wininfoPins || []).indexOf(String(w['情報ID'])) !== -1; }
function winInfoRecent() {
  var D = S.D, from = addDays(D.today, -D.wininfoShowDays), pins = D.wininfoPins || [];
  var all = winInfoSorted(), pinned = [];
  pins.forEach(function (id) { for (var i = 0; i < all.length; i++) if (String(all[i]['情報ID']) === id) { pinned.push(all[i]); break; } });
  return pinned.concat(all.filter(function (w) { return !winInfoPinned(w) && w['日付'] >= from && w['日付'] <= D.today; }).slice(0, D.wininfoShowMax));
}
/** 配信（自動更新）の状態。お知らせの画面に出す */
function feedStatusHtml() {
  var f = S.D.feed;
  if (!f) return '';
  if (!f.on) return '<p class="note" id="feedStatus">自動更新：まだ設定していません。「設定」→「基本設定」→「配信フォルダー」に、配信ファイルが入る Google ドライブのフォルダーを入れると、Windows情報と Tips が自動で入ります。</p>';
  var st = f.status;
  var hidden = (S.D.wininfo || []).filter(function (w) { return w['顧客に見せる'] !== 'はい'; }).length;
  return '<div class="box" id="feedStatus">自動更新：' + pill('設定済み', 'ok') +
    (st ? '　最後に確かめたのは ' + esc(st.at) + '　' + (st.ok ? '' : pill('うまくいきませんでした', 'danger') + ' ') + '<span class="note">' + esc(st.message) + '</span>'
        : '　<span class="note">まだ確かめていません。</span>') +
    '<div class="note">配信フォルダーは、画面を開いたとき（' + Number(f.hours) + '時間に1回まで）と、毎朝の通知の処理のときに確かめます。自動で入った Windows情報は「社内だけ」で入ります。確かめてから「顧客に見せる」を押してください' +
    (hidden ? '（いま社内だけ：' + hidden + '件）' : '') + '。</div></div>';
}
function winInfoItemHtml(w) {
  var link = safeLink(w['リンク']);
  return '<div class="wi"><span class="d">' + esc(String(w['日付']).slice(5).replace('-', '/')) + '</span>' +
    '<span class="t"><b>' + (winInfoPinned(w) ? '📌 ' : '') + (w['重要度'] === '重要' ? pill('重要', 'danger') + ' ' : '') + esc(w['タイトル']) + (w['顧客に見せる'] === 'はい' ? '' : ' ' + pill('社内だけ', 'warn')) + '</b>' + (w['内容'] ? '<span>' + esc(w['内容']) + '</span>' : '') + '</span>' +
    (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">くわしく</a>' : '') + '</div>';
}
/** PC管理に出す、新しい Windows情報 */
function winInfoPanelHtml() {
  if (!S.ready) return '';
  var list = winInfoRecent();
  if (!list.length) return '';
  return '<section class="panel" id="winInfoPanel"><h2><span class="grow">Windows情報（更新プログラム・ドライバーの不具合）</span><button type="button" class="btn small" data-act="nav" data-view="notices">すべて見る</button></h2>' +
    '<div class="winfo">' + list.map(winInfoItemHtml).join('') + '</div></section>';
}

// ---- 各ページの使い方（短く） ----
var HELP = {
  mmaint: ['保守', ['顧客を選ぶと、収集ツールの情報が新しい順にPCが並びます。', 'PCを押すと、イベント・ウイルス対策・更新などをまとめて確認できます。', '備考を書いて「この台は完了」。すぐ ✓ が付き、保守の記録ができます。', '最後に「報告書を撮って終わる」→「書類をスキャン」で報告書を付けます。', '「戻る」は、PC → 一覧 → 顧客を選ぶ、の順に戻ります。']],
  home: ['入力', ['「保守をはじめる」で、保守を1台ずつ進めます。', '大きいボタンで、対応・修理・ライセンス・機器・メモを記録します。', '「探して直す」で、機器やライセンスを探して開けます。', '入力の途中で閉じても、下書きに残ります（「続きから」で戻せます）。', '一覧は下のメニュー、設定・ログアウトは右上の「☰ メニュー」から。']],
  meeting: ['ミーティング', ['毎週の会議用。上から話す順に並んでいます。', '②その週の対応 ⑤前回決まったこと ⑥議題メモ。', '月初は「先月のまとめ」とPCの健康チェックも出ます。', '週は上の矢印で切替。行を押すと編集が開きます。', '⑥のメモは「社内メモに残す」で、次回の⑤に出ます。']],
  customers: ['PC管理', ['要対応はPCと契約のことだけ。赤は急ぎのときだけ。', '検索欄で、全社の機器をシリアル・利用者・顧客名から探せます。', '顧客の行を押すと、その顧客の機器や履歴が開きます。', '右上の名前を押すと、自分の設定・ログアウト。', 'いちばん下に、開く速さと最後の保存の時間が出ます。']],
  customer: ['顧客の画面', ['タブで、機器・対応履歴・修理・ライセンスなどを切り替えます。', 'スキャンは何枚かを1つのPDFにまとめて付けられます。', '機器の窓の「別の顧客へ移す」で、納品先へ移せます（管理者）。', '「レポート」の月を、お客様ページに出せます（管理者）。', '「1年の振り返り」で、12か月の対応・修理・保守の回数を見られます。']],
  devices: ['機器の一覧', ['全社の機器を、文字・種類・状況で絞れます。', '見出しを押すと、並び替えできます。', '行を押すと、機器の編集と写真の窓が開きます。', '機器の窓の「別の顧客へ移す」で、顧客を付け替えられます（管理者）。']],
  activities: ['対応履歴', ['上で期間（週・月・期間指定・すべて）を選びます。', '検索はひらがなでも探せます。', '「顧客ごとにまとめる」で、顧客別に並びます。', '行を押すと編集。写真も付けられます（カメラ・書類のスキャンも）。', '「印刷・PDFにする」で、ミーティング用の資料になります。']],
  repairs: ['修理履歴', ['進行中の修理は、期間に関係なく上に出ます。', 'ステータスを「完了」にすると、完了日が入ります。', '「顧客ごとにまとめる」で、顧客別に並びます。', '行を押すと編集。写真も付けられます（カメラ・書類のスキャンも）。']],
  licenses: ['ライセンス', ['期限が近い・切れたものを、右のプルダウンで絞れます。', '「割当」で、どの機器で使っているかを登録します。', '「顧客ごとにまとめる」で、顧客別に並びます。', '編集の窓で、ID・パスワード・シリアルキーも入れられます。', 'パスワードは、空のまま保存すると今のままです。']],
  rentals: ['レンタル機器', ['「貸し出す」で貸出を記録、「返却を記録」で返却します。', '返却が近い・過ぎた貸出は、状態に色つきで出ます。', '下の貸出記録は、「顧客ごとにまとめる」で顧客別に並びます。']],
  notices: ['お知らせ・Windows情報', ['お知らせは、お客様ページの上に出ます。', 'Windows情報は、更新プログラムやドライバーの不具合のメモです。', '配信フォルダーを設定すると、自動で入ります（最初は「社内だけ」）。', '確かめたら「顧客に見せる」を押すと、お客様ページに出ます。', '手で足すときは「まとめて貼り付け」か「＋ 追加」。']],
  settings: ['設定', ['左の目次で、見たいまとまりへ移れます。', '要対応に出す種類は「要対応と通知」で選びます。', '選択肢（機器の種類・定型文など）は「選択肢」で足します。', '「収集ツールの配布」で、新しいツールを全部のPCに配れます。', 'スタッフの追加・パスワードの再設定は、いちばん下です。']],
  audit: ['変更履歴', ['だれが・いつ・何を変えたかを見られます。', '見られるのは新しい500件まで。それより前は、スプレッドシートの「変更履歴」です。', '古いものは毎朝、保管用のスプレッドシートへ移します（設定の「変更履歴を残す日数」）。']]
};
// スマホの一覧は、作りがちがうので説明も分ける（v0.19.0）
var HELP_PHONE = {
  customers: ['PC管理', ['上の「要対応 ○件」を押すと、要対応の一覧が開きます。', '顧客名・ふりがな・電話で探せます。', '顧客を押すと、その顧客の機器や履歴が開きます。', 'ダッシュボード（数字・グラフ）は、パソコンで見ます。']],
  activities: ['対応履歴', ['「未完了／直近30日／すべて」で絞れます。', '内容・顧客名・担当で探せます（ひらがな可）。', '押すと編集。右上の「＋ 対応を記録」で足します。', '古い対応は、パソコンか顧客の画面で見られます。']],
  repairs: ['修理履歴', ['「進行中／すべて」で絞れます。', '件名・顧客名・型番・預かり品で探せます。', '押すと編集。右上の「＋ 修理を受け付け」で足します。']],
  licenses: ['ライセンス', ['最初は、期限が近い・切れたものが、期限の近い順に出ます。', '「すべて」で全部。製品名・顧客名で探せます。', '押すと編集。ID・パスワード・シリアルキーも入れられます。', '右上の「＋ ライセンスを追加」で足します。']]
};
function helpFor(view) { return (isPhone() && HELP_PHONE[view]) || HELP[view]; }
function helpButtonHtml(view) {
  return HELP[view] ? '<button type="button" class="btn small" data-act="help" data-view="' + view + '" title="このページの使い方">？ 使い方</button>' : '';
}
// ---- 顧客ごとにまとめる（対応履歴・修理履歴・ライセンス・貸出記録） ----
var GROUP_Q = { activities: 'act.group', repairs: 'rep.group', licenses: 'lic.group', loans: 'loan.group' };
function groupButtonHtml(qName) {
  return '<button type="button" class="btn small" data-act="toggleGroup" data-q="' + qName + '" aria-pressed="' + (q(qName) === '1') + '">顧客ごとにまとめる：' + (q(qName) === '1' ? 'する' : 'しない') + '</button>';
}
function groupOf(tableId, r) {
  if (tableId === 'loans') return r['顧客ID'] ? { key: 'c:' + r['顧客ID'], label: custName(r['顧客ID']), sort: custWords(r['顧客ID']) } : { key: 't:' + (r['貸出先'] || ''), label: r['貸出先'] || '（貸出先なし）', sort: '\uffff' + (r['貸出先'] || '') };
  return r['顧客ID'] ? { key: 'c:' + r['顧客ID'], label: custName(r['顧客ID']), sort: (IDX.cust[r['顧客ID']] || {})['ふりがな'] || custName(r['顧客ID']) } : { key: '', label: '（顧客なし）', sort: '\uffff' };
}

function render() {
  saveLocSoon();
  // 自分のメニューは、画面が変わったときだけ閉じる（裏で読み直して描き直しても、開いたまま）
  var acct = document.getElementById('acct'), viewKey = S.view + '|' + (S.customerId || '');
  if (acct && acct.open && S.menuView !== viewKey) acct.open = false;
  S.menuView = viewKey;
  // 「探して直す」に打っている間は、画面を作り直さない（欄が入れ替わると、キーボードが閉じて続きが打てない）
  if (S.view === 'home' && document.activeElement && document.activeElement.id === 'homeQ' && $('homeHits')) {
    rememberView();
    S.renderPending = false;
    $('homeHits').innerHTML = homeHitsHtml();
    $('homeRecent').innerHTML = homeRecentHtml();
    var oldBar = $('draftBar');
    if (oldBar) oldBar.remove();
    $('main').insertAdjacentHTML('afterbegin', draftBarHtml());
    return;
  }
  // スマホの一覧の探す欄に打っている途中なら、描き直したあとも、その欄に戻す（キーボードを閉じない）
  var pqAct = document.activeElement, pqKey = pqAct && pqAct.dataset ? pqAct.dataset.pq || '' : '', pqPos = pqKey ? pqAct.selectionStart : 0;
  rememberView();
  var current = S.view === 'customer' || S.view === 'devices' ? 'customers' : S.view === 'audit' ? 'settings' : S.view;
  S.renderPending = false;
  $('nav').innerHTML = NAV.filter(function (n) { return navVisible(n[0]); }).map(function (n) {
    return '<button type="button" data-act="nav" data-view="' + n[0] + '"' + (n[0] === current ? ' aria-current="page"' : '') + '>' + n[1] + '</button>';
  }).join('');
  $('bnav').innerHTML = [['customers', 'PC管理'], ['activities', '対応'], ['', ''], ['repairs', '修理'], ['licenses', 'ライセンス']].map(function (n) {
    if (!n[0]) return '<button type="button" class="add" data-act="plusInput"' + (current === 'home' || current === 'mmaint' ? ' aria-current="page"' : '') + '><i>＋</i>入力</button>';
    return '<button type="button" data-act="nav" data-view="' + n[0] + '"' + (n[0] === current ? ' aria-current="page"' : '') + '>' + n[1] + '</button>';
  }).join('');
  $('main').innerHTML = !S.ready && NEEDS_REST[S.view]
    ? '<div class="head"><h1>' + esc((NAV.filter(function (n) { return n[0] === S.view; })[0] || ['', ''])[1]) + '</h1></div>' + notReadyHtml()
    : VIEWS[S.view]();
  // 「入力」の画面のほかは、残りのデータを使う。まだ読んでいなければ（スマホ）、ここで読み始める
  if (!S.ready && !S.restFailed && S.view !== 'home') ensureRest();
  // いちばん上に Tips と、入力しかけの下書き。見出しの右に「使い方」
  if (S.D.tips && S.D.tips.length) $('main').insertAdjacentHTML('afterbegin', tipsBarHtml());
  $('main').insertAdjacentHTML('afterbegin', draftBarHtml());
  var headEl = $('main').querySelector('.head');
  if (headEl) headEl.insertAdjacentHTML('beforeend', helpButtonHtml(S.view));
  // タブが多くて横に流れるので、開いているタブが見える位置まで寄せる
  var activeTab = document.querySelector('.tabs [aria-selected="true"]');
  if (activeTab) activeTab.parentNode.scrollLeft = Math.max(0, activeTab.offsetLeft - 48);
  if (S.ready && S.alertsStale && !S.alertsLoading && (S.view === 'customers' || S.view === 'customer')) loadAlerts();
  if (S.view === 'customer' && S.sub === 'credentials') loadCredentials();
  if (S.ready && S.view === 'customer' && (S.sub === 'activities' || S.sub === 'year')) loadCustomerActivities();
  if (S.ready && S.view === 'activities') loadActivityRange();
  if (S.view === 'settings' && !S.staff) loadStaff();
  if (S.view === 'settings' && S.D && S.D.me.isAdmin && S.release === undefined && !S.releaseLoading) loadRelease();
  if (S.view === 'audit' && !S.audit) loadAudit(200);
  if (S.view === 'customer' && S.sub === 'files') loadAttachments();
  if (S.view === 'customer' && S.sub === 'layout') loadLayouts();
  if (S.view === 'customer' && S.sub === 'report') loadReport();
  if (S.view === 'mmaint' && S.ready && S.mm.dev) mmLoadDiag(S.mm.dev);
  var pqBack = pqKey && $('pq_' + pqKey);
  if (pqBack && !$('modals').children.length) { try { pqBack.focus(); pqBack.setSelectionRange(pqPos, pqPos); } catch (e) { /* そのまま */ } }
}
/** 記録を変えたあとは、要対応が変わっているかもしれないので取り直す（ダッシュボードなどを開いたときに） */
function loadAlerts() {

/** 縦の棒グラフ。items: [{label, sub, value, value2}]。value2 があれば2本ならべる（凡例つき） */

  var two = opt.legend && opt.legend.length === 2;

  var bar = function (v, cls, name, x) {
    var h = v ? Math.max(4, Math.round(v / max * 100)) : 0;

      '<em' + (v ? '' : ' class="zero"') + '>' + (v || (dense ? '' : 0)) + '</em><i style="height:' + h + '%"' + (v ? '' : ' class="zero"') + '></i></div>';
  };
  return (two ? '<div class="legend"><span><i class="k1"></i>' + esc(opt.legend[0]) + '</span><span><i class="k2"></i>' + esc(opt.legend[1]) + '</span></div>' : '') +
    '<div class="vbars' + (dense ? ' dense' : '') + '">' + items.map(function (x) {
      return '<div class="vcol"><div class="vpair">' + bar(x.value, '', two ? opt.legend[0] : '', x) + (two ? bar(x.value2 || 0, 's2', opt.legend[1], x) : '') + '</div>' +

/** 期間を、グラフの棒の単位（日ごと。長いときは月ごと）に分ける */
function periodBuckets(from, to) {
  var days = Math.round((ymdUtc(to) - ymdUtc(from)) / 86400000) + 1, out = [];
  if (days <= 45) {
    for (var i = 0; i < days; i++) {
      var d = addDays(from, i);
      out.push({ key: d, label: days <= 10 ? DOW[dowOf(d)] : String(Number(d.slice(8, 10))), sub: days <= 10 ? md(d) : '', tip: mdw(d) });
    }
    return { unit: 'day', list: out };
  }
  for (var m = from.slice(0, 7); m <= to.slice(0, 7) && out.length < 60; m = addMonths(m, 1)) out.push({ key: m, label: Number(m.slice(5, 7)) + '月', sub: m.slice(5, 7) === '01' || !out.length ? m.slice(0, 4) : '', tip: m });
  return { unit: 'month', list: out };
}
/** 直近 n か月（今月を含む）の 'YYYY-MM' を古い順に */

  D.repairs.forEach(function (r) { if (inM(r['受付日'])) at(r['顧客ID']).r++; });
  D.maintenances.forEach(function (r) { if (inM(r['実施日'])) { var x = at(r['顧客ID']); x.m++; x.reg = true; } });      // 種別は問わない（移行データの表記ゆれ対策。v0.38.0）

  });
  var tot = rows.reduce(function (t, x) { t.a += x.a; t.r += x.r; t.m += x.m; return t; }, { a: 0, r: 0, m: 0 });
  var missed = rows.filter(function (x) { return x.reg && !x.regDone; });
  var shown = rows.filter(function (x) { return x.a || x.r || x.m || x.reg; })
    .sort(function (a, b) { return (b.a + b.r + b.m) - (a.a + a.r + a.m) || cmp(a.c['ふりがな'] || a.c['顧客名'], b.c['ふりがな'] || b.c['顧客名']); });

  D.licenses.forEach(function (l) { if (inDue(l['有効期限'])) due.push({ d: l['有効期限'], kind: 'ライセンス', cust: l['顧客ID'], text: l['製品名'], key: 'license', id: l['ライセンスID'] }); });

      '<div class="mtile"><span class="ml">修理の受付</span><b>' + tot.r + '<small>件</small></b></div>' +
      '<div class="mtile"><span class="ml">保守の実施</span><b>' + tot.m + '<small>件</small></b></div>' +
      '<div class="mtile' + (missed.length ? ' warn' : '') + '"><span class="ml">定期保守をやれていない</span><b>' + missed.length + '<small>社</small></b>' +
        '<span class="ms">' + (missed.length ? missed.map(function (x) { return esc(x.c['顧客名']); }).join('・') : '全社できました') + '</span></div>' +

function mtgMemoKey() { return mtgWeek(mtgState().off).from; }

// 小さい推移グラフ（v0.22.0）。values は古い→新しい。最後の点を強調

  if (n < 2) return '';
  var pt = function (v, i) { return [(i * (W - 4) / (n - 1) + 2).toFixed(1), (H - 3 - v / mx * (H - 6)).toFixed(1)]; };

  // ⑥ 議題メモ

    '<textarea id="mtgMemo" data-mtgmemo="1" rows="5" maxlength="3000" placeholder="例：A社のPC入れ替えは来月。B社の修理は部品待ち。">' + esc(st.memos[w.from] || '') + '</textarea>' +
    '<div class="row"><span class="note grow">「社内メモに残す」で、この週のメモとして保存します（あとで社内メモから見られます）。</span><button type="button" class="btn primary" data-act="mtgSaveMemo">社内メモに残す</button></div></div></section>';

  return head + '<div class="mtggrid">' + sum + staleHtml + mtgRepairsHtml(w, st) + (mtgShowMonthly() ? mtgMonthlyHtml() : '') +
    '<div class="mtg2">' + maintHtml + soonHtml + '</div>' + mtgLastDecisionsHtml(w) + memoHtml + '</div>';
};

</script>
