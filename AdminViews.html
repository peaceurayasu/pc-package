// ---- スタッフごとに、絞り込み・並び替え・期間の種類を覚える（スタッフのシートの「画面設定」に入る。どの端末でも同じ状態で始まる）
var VIEW_SAVE_DELAY = 2500;      // 操作が止まってから保存するまで（ミリ秒）。押すたびには送らない
var viewSaved = '', viewTimer = null, viewOff = false;
function viewSnapshot() {
  var out = { q: {}, sort: {}, per: {} };
  Object.keys(S.q).forEach(function (k) { if (typeof S.q[k] === 'string' && S.q[k].length <= 100 && /^[a-z]{2,12}\.[A-Za-z]{2,16}$/.test(k)) out.q[k] = S.q[k]; });
  Object.keys(S.sort).forEach(function (k) { var v = S.sort[k]; if (v && /^[A-Za-z]{2,20}$/.test(k)) out.sort[k] = { i: v.i, dir: v.dir }; });
  Object.keys(S.per).forEach(function (k) { if (S.per[k] && S.per[k].mode) out.per[k] = { mode: S.per[k].mode }; });
  return out;
}
/** 覚えてあった状態を、画面に入れる（ログインした直後） */
function applyViewState(vs) {
  vs = vs || {};
  S.q = {}; S.sort = {}; S.per = {};
  Object.keys(vs.q || {}).forEach(function (k) { if (typeof vs.q[k] === 'string') S.q[k] = vs.q[k]; });
  Object.keys(vs.sort || {}).forEach(function (k) { var v = vs.sort[k]; if (v && (v.dir === 1 || v.dir === -1) && v.i >= 0) S.sort[k] = { i: v.i, dir: v.dir }; });
  Object.keys(vs.per || {}).forEach(function (k) { var v = vs.per[k]; if (v && S.D.viewPeriodModes.indexOf(v.mode) !== -1) perState(k).mode = v.mode; });
  viewSaved = JSON.stringify(viewSnapshot());
  viewOff = false;
}
function sendView() {
  clearTimeout(viewTimer); viewTimer = null;
  if (!S.D || viewOff) return Promise.resolve();
  var snap = viewSnapshot(), json = JSON.stringify(snap);
  if (json === viewSaved) return Promise.resolve();
  viewSaved = json;
  return call('saveMyView', { view: snap }, true).catch(function (e) {
    // 列がまだ無い（初期設定をやり直していない）ときは、このあとは送らない。ほかの失敗は、次の操作でまた送る
    if (e && e.error === 'setup') viewOff = true; else viewSaved = '';
  });
}
/** 絞り込みなどが変わっていたら、少し待ってから保存する */
function rememberView() {
  if (!S.D || viewOff || viewTimer) return;
  if (JSON.stringify(viewSnapshot()) === viewSaved) return;
  viewTimer = setTimeout(sendView, VIEW_SAVE_DELAY);
}

  if (!pts.length) return '';
  var last = pts[pts.length - 1];
  values = values.map(function (v) { return v === null ? '－' : v; });
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(title || '推移') + '"><title>' + esc((title || '') + '：' + values.join('→')) + '</title>' +
    '<polyline fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '"/>' +
    '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.6" fill="currentColor"/></svg>';
}
/** 週ごとの件数（endOff の週まで n 週ぶん、古い→新しい）。1回なめるだけで数える。
 *  対応履歴を一部しか読んでいない古い週は null（線を引かない） */
function weekSeries(endOff, n) {
  var D = S.D, start = mtgWeek(endOff - n + 1).from, s0 = ymdUtc(start), end = mtgWeek(endOff).to;
  var mk = function () { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; };
  var o = { acts: mk(), repIn: mk(), repDone: mk(), maint: mk() };
  var put = function (arr, d) { d = String(d || '').slice(0, 10); if (d.length === 10 && d >= start && d <= end) arr[Math.floor((ymdUtc(d) - s0) / 604800000)]++; };
  D.activities.forEach(function (a) { put(o.acts, a['受付日']); });
  D.repairs.forEach(function (r) { put(o.repIn, r['受付日']); if (!isOpenRepair(r)) put(o.repDone, r['完了日']); });
  D.maintenances.forEach(function (m) { put(o.maint, m['実施日']); });
  var after = actLoadedAfter();
  if (after) for (var i = 0; i < n; i++) if (mtgWeek(endOff - n + 1 + i).from <= after) o.acts[i] = null;
  return o;
}
/** その週の対応履歴を、ぜんぶ読み込めているか */
function actsComplete(w) { var after = actLoadedAfter(); return !after || w.from > after; }
var SPARK_WEEKS = 8;
function mtgDays(ymd) { return Math.round((ymdUtc(S.D.today) - ymdUtc(String(ymd).slice(0, 10))) / 86400000); }
VIEWS.meeting = function () {
  var D = S.D, st = mtgState(), w = mtgWeek(st.off), pw = mtgWeek(st.off - 1);
  var title = (st.off === -1 ? '先週' : st.off === 0 ? '今週' : '') + '　' + mdw(w.from) + '〜' + mdw(w.to);
  var head = '<div class="head"><h1>ミーティング</h1>' +
      '<button type="button" class="btn" data-act="mtgWeek" data-d="-1">← 前の週</button><span class="mweek">' + esc(title) + '</span>' +
      '<button type="button" class="btn" data-act="mtgWeek" data-d="1"' + (st.off >= 0 ? ' disabled' : '') + '>次の週 →</button>' +
      '<button type="button" class="btn" data-act="mtgMonthly" aria-pressed="' + mtgShowMonthly() + '">先月のまとめ</button>' +
      '<button type="button" class="btn" data-act="mtgFull">全画面</button><button type="button" class="btn" data-act="mtgPrint">印刷・PDFにする</button></div>';
  if (!S.ready) return head + notReadyHtml();
  var c = mtgCounts(w), p = mtgCounts(pw);
  var openActsAll = D.activities.filter(isOpenActivity), openRepsAll = D.repairs.filter(isOpenRepair);
  var wActs0 = D.activities.filter(function (a) { return inWeek(a['受付日'], w); });
  var weeks = weekSeries(st.off, SPARK_WEEKS);
  var ser = function (k) { return weeks[k]; };
  // 対応履歴を一部しか読んでいない古い週は、数が少なく出るので断り書きを付ける
  var partial = !actsComplete(w), pPartial = !actsComplete(pw);

  // ① まとめ
  var sum = '<section class="panel mtg"><h2><span class="grow">① 週のまとめ</span><span class="sub mtgweek">' + esc(title) + '</span></h2><div class="pad"><div class="mtiles">' +
    mtgTile('受けた対応', c.acts, pPartial ? null : p.acts, partial ? 'この週は読み込んだ分だけの数です' : 'うち完了 ' + c.actsDone + '件', ser('acts')) +
    mtgAvgTile(wActs0) +
    mtgOpenTile('未完了の対応', openActsAll, 'activity') +
    mtgOpenTile('未完了の修理', openRepsAll, 'repair') +
    mtgMaintTile() +
    '</div>' + mtgMaintTodoHtml() + '</div></section>';

  // ② その週の対応履歴（v0.23.0。前は「7日以上止まっている持ち越し」）
  //   その週に受けた対応を日付順に。終わっていないものは色を付けて上に。週より前からの未完了は件数だけ下に添える
  var wActs = D.activities.filter(function (a) { return inWeek(a['受付日'], w); })
    .sort(function (a, b) { return (isOpenActivity(b) - isOpenActivity(a)) || cmp(String(a['受付日']), String(b['受付日'])) || cmp(a['対応ID'], b['対応ID']); });
  var wOpen = wActs.filter(isOpenActivity).length;
  var olderActs = D.activities.filter(function (a) { return isOpenActivity(a) && String(a['受付日']).slice(0, 10) < w.from; }).length;
  var olderReps = D.repairs.filter(function (r) { return isOpenRepair(r) && String(r['受付日']).slice(0, 10) < w.from; }).length;
  var MTG_ACT_MAX = 30;
  var staleHtml = '<section class="panel mtg"><h2><span class="grow">② ' + esc(st.off === -1 ? '先週' : st.off === 0 ? '今週' : 'この週') + 'の対応履歴</span>' +
    pill(wActs.length + '件', '') + (wOpen ? pill('未完了 ' + wOpen, 'warn') : '') + '</h2><div class="pad">' +
    (wActs.length ? '<table class="mtbl"><thead><tr><th>受付日</th><th>顧客</th><th>内容</th><th>種別</th><th>担当</th><th>時間</th><th>状態</th></tr></thead><tbody>' + wActs.slice(0, MTG_ACT_MAX).map(function (a) {
      return '<tr class="' + (isOpenActivity(a) ? 'mopen' : '') + (a['会議で共有'] === 'はい' ? ' mshare' : '') + '" data-act="editRecord:activity" data-id="' + esc(a['対応ID']) + '"' + memoAttr(a) + '><td class="nowrap">' + esc(mdw(String(a['受付日']).slice(0, 10))) + '</td><td>' + esc(custName(a['顧客ID'])) + '</td><td class="clamp" title="' + esc(a['内容']) + '"><span>' + (a['会議で共有'] === 'はい' ? pill('共有', 'brand') + ' ' : '') + linkify(a['内容']) + '</span></td><td class="nowrap">' + esc(a['対応種別'] || '') + '</td><td class="nowrap">' + esc(a['受付スタッフ'] || '') + '</td><td class="nowrap">' + mtgTimeHtml(a) + '</td><td>' + statusPill(a['ステータス']) + '</td></tr>';
    }).join('') + '</tbody></table>' + (wActs.length > MTG_ACT_MAX ? '<p class="note">ほか ' + (wActs.length - MTG_ACT_MAX) + '件（対応履歴の画面で見られます）</p>' : '')
      : '<p class="mempty">この週に受けた対応はありません。</p>') +
    (olderActs || olderReps ? '<p class="mcarry">この週より前からの未完了：対応 <b>' + olderActs + '</b>件・修理 <b>' + olderReps + '</b>件<button type="button" class="btn small" data-act="tileOpenActs">対応を見る</button><button type="button" class="btn small" data-act="tileOpenReps">修理を見る</button></p>' : '') +
    '</div></section>';

  // ④ この先に気をつけること（今月の定期保守の状況は、① のタイルに入れた。v0.72.0）
  var until = addDays(D.today, MTG_AHEAD_DAYS), soon = [];
  var dueIn = function (ymd) { return ymd ? Math.round((ymdUtc(ymd) - ymdUtc(D.today)) / 86400000) : null; };
  D.licenses.forEach(function (l) { if (l['不使用'] !== 'はい' && l['有効期限'] && l['有効期限'] <= until && l['有効期限'] >= addDays(D.today, -30)) soon.push({ d: l['有効期限'], kind: 'ライセンス期限', cust: l['顧客ID'], text: l['製品名'], key: 'license', id: l['ライセンスID'] }); });
  D.devices.forEach(function (dv) { if (dv['状況'] !== '廃棄' && dv['保証期限'] && dv['保証期限'] >= D.today && dv['保証期限'] <= until) soon.push({ d: dv['保証期限'], kind: '保証期限', cust: dv['顧客ID'], text: devLabel(dv['機器ID']), key: 'device', id: dv['機器ID'] }); });
  D.loans.forEach(function (ln) { if (!ln['返却日'] && ln['返却予定日'] && ln['返却予定日'] <= until) soon.push({ d: ln['返却予定日'], kind: 'レンタルの返却', cust: ln['顧客ID'], text: (IDX.rental[ln['レンタルID']] || {})['名称'] || ln['レンタルID'], key: 'loan', id: ln['貸出ID'] }); });
  if (D.bizOn) {
    (D.projects || []).forEach(function (pj) {
      var stp = pj['状態'], inDev = D.bizStates.projectActive.indexOf(stp) !== -1 || D.bizStates.project.indexOf(stp) === -1;
      if (pj['納期'] && pj['納期'] <= until && inDev) soon.push({ d: pj['納期'], kind: '案件の納期（テスト版）', cust: pj['顧客ID'], text: pj['案件名'] + '（' + stp + '）', key: 'project', id: pj['案件ID'], over: true });
      if (pj['次の連絡日'] && pj['次の連絡日'] <= until && D.bizStates.sales.indexOf(stp) !== -1) soon.push({ d: pj['次の連絡日'], kind: '商談の連絡日（テスト版）', cust: pj['顧客ID'], text: (pj['先方名'] || pj['案件名']) + '（' + stp + '）', key: 'project', id: pj['案件ID'], over: true });
    });
    (D.saleslogs || []).forEach(function (sl) { if (sl['次回予定日'] && sl['次回予定日'] <= until && sl['アクション完了'] !== 'はい' && (sl['次回アクション'] || sl['内容'])) soon.push({ d: sl['次回予定日'], kind: '営業の次回アクション（テスト版）', cust: sl['顧客ID'], text: (sl['相手先'] ? sl['相手先'] + '：' : '') + (sl['次回アクション'] || sl['内容']), key: 'saleslog', id: sl['営業ID'], over: true }); });
  }
  soon.sort(function (a, b) { return cmp(a.d, b.d); });
  // 終わっていない修理も出す（受付の古い順。日付の予定ではないので、期限のものの後ろに）
  D.repairs.filter(isOpenRepair).sort(function (a, b) { return cmp(String(a['受付日']), String(b['受付日'])); }).forEach(function (r) {
    soon.push({ d: String(r['受付日']).slice(0, 10), kind: '修理（未完了）', cust: r['顧客ID'], text: r['件名'] || r['修理ID'], key: 'repair', id: r['修理ID'], since: true });
  });
  // 未割り当て（仮受付）のPCがあれば、いちばん上に出す（顧客を選び直すまで残る。v0.112.1）
  var pend = D.devices.filter(function (dv) { return !dv._pending && isPendingCust(dv['顧客ID']) && dv['状況'] !== '廃棄'; })
    .sort(function (a, b) { return cmp(String(a['登録日時']), String(b['登録日時'])); })
    .map(function (dv) { return { d: String(dv['登録日時'] || D.today).slice(0, 10), kind: '仮受付（未割り当て）のPC', cust: '', text: devLabel(dv['機器ID']) + '：顧客を選んでください', key: 'device', id: dv['機器ID'], past: true }; });
  soon = pend.concat(soon);
  var soonHtml = '<section class="panel mtg"><h2><span class="grow">④ この先' + MTG_AHEAD_DAYS + '日に気をつけること</span>' + pill(soon.length + '件', soon.length ? 'warn' : 'ok') + '</h2><div class="pad">' +
    (soon.length ? '<table class="mtbl"><thead><tr><th>いつ</th><th>種類</th><th>顧客</th><th>内容</th></tr></thead><tbody>' + soon.slice(0, 20).map(function (x) {
      var n = dueIn(x.d);
      var when = x.since ? pill('受付から' + Math.max(0, -n) + '日', -n >= MTG_STALE_DAYS ? 'warn' : '') : x.past ? esc(md(x.d)) + ' 受信' : n < 0 ? pill((x.over ? '過ぎて' : '切れて') + (-n) + '日', 'danger') : n === 0 ? pill('今日', 'danger') : pill('あと' + n + '日', n <= 7 ? 'warn' : '');
      return '<tr data-act="editRecord:' + x.key + '" data-id="' + esc(x.id) + '"' + memoAttr(memoOfRec(x.key, x.id)) + '><td class="nowrap">' + when + '</td><td class="nowrap">' + esc(x.kind) + '</td><td>' + esc(custName(x.cust)) + '</td><td class="clamp" title="' + esc(x.text) + '"><span>' + esc(x.text) + '</span></td></tr>';
    }).join('') + '</tbody></table>' : '<p class="mempty">この先' + MTG_AHEAD_DAYS + '日に気をつけることはありません。</p>') + '</div></section>';

  // ⑥ 議題メモ
  var memoHtml = '<section class="panel mtg noprint-edit"><h2><span class="grow">⑥ 今週の議題・決まったこと</span></h2><div class="pad">' +
    '<textarea id="mtgMemo" data-mtgmemo="1" rows="5" maxlength="3000" placeholder="例：A社のPC入れ替えは来月。B社の修理は部品待ち。">' + esc(st.memos[w.from] || '') + '</textarea>' +
    '<div class="row"><span class="note grow">「社内メモに残す」で、この週のメモとして保存します（あとで社内メモから見られます）。</span><button type="button" class="btn primary" data-act="mtgSaveMemo">社内メモに残す</button></div></div></section>';

  return head + '<div class="mtggrid">' + sum + mtgCalHtml(mtgWeek(st.off + 1)) + staleHtml + mtgRepairsHtml(w, st) + (mtgShowMonthly() ? mtgMonthlyHtml() : '') +
    soonHtml + mtgLastDecisionsHtml(w) + memoHtml + '</div>';
};

</script>
