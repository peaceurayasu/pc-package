/**

function layoutPlace(items, stagger) {

  var H = 1000 / L.ratio, list = L.data.elements, x0 = Infinity, y0 = Infinity, x1 = 0, y1 = 0;

    else if (it[0] === 'icon') x = { type: 'icon', x: px(it[1]), y: py(it[2]), icon: it[3], size: Math.min(80, Math.max(12, Math.round(28 * k))), text: it[4] || '' };

function resetLayoutState() {

function layClone(x) { return JSON.parse(JSON.stringify(x)); }

/** 動かすときに図の中へ収める点の範囲 [左, 上, 右, 下]（箱・文字・ピンは基準の1点、線は両端、折れ線は全部の点） */
function layAnchorBounds(el) {

    el.points.forEach(function (p) { b[0] = Math.min(b[0], p[0]); b[1] = Math.min(b[1], p[1]); b[2] = Math.max(b[2], p[0]); b[3] = Math.max(b[3], p[1]); });

function layCenter(el) {

/** el を「元の形 o から (mx, my) だけ動かした形」にする */
function layShift(el, o, mx, my) {
  if (layIsLine(o)) { el.x1 = layR2(o.x1 + mx); el.x2 = layR2(o.x2 + mx); el.y1 = layR2(o.y1 + my); el.y2 = layR2(o.y2 + my); }
  else if (o.type === 'poly') el.points = o.points.map(function (p) { return [layR2(p[0] + mx), layR2(p[1] + my)]; });

/** まとめて動かす量を決める。形と並びを保ったまま、図からはみ出すぶんだけ戻す */

  origs.forEach(function (o) { var a = layAnchorBounds(o); b[0] = Math.min(b[0], a[0]); b[1] = Math.min(b[1], a[1]); b[2] = Math.max(b[2], a[2]); b[3] = Math.max(b[3], a[3]); });
  var mx = layoutSnapNum(dx), my = layoutSnapNum(dy);

/** 回した箱のつまみの位置。大きさのつまみは右下の角、向きのつまみは上（図の外に出るときは下） */
function layBoxHandles(el, H) {
  var r = layRot(el) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  var cx = (el.x + el.w / 2) * 10, cy = (el.y + el.h / 2) * H / 100, hw = el.w * 5, hh = el.h * H / 200;

  var corner = pt(hw, hh), turn = pt(0, -(hh + 30));

function layoutChanged() { L.dirty = true; drawLayoutBox(); }

/** 名前などを1つ入れてもらう小さい窓 */
function askText(title, label, value, max) {

      '<form novalidate><div class="body"><div class="field"><label for="askInput">' + esc(label) + '</label><input type="text" id="askInput" maxlength="' + max + '" value="' + esc(value || '') + '"></div></div>' +
      '<footer><span class="grow"></span><button type="button" class="btn" data-answer="no">やめる</button><button type="submit" class="btn primary">決定</button></footer></form>', true, true);

// ---- ドラッグ（動かす・大きさを変える・回す・線の端や折れ線の点を動かす・囲んで選ぶ）
//   どれも「つかんだときの形（orig）＋ポインターが動いた量」で決める。途中の形から足していくと、ずれが積もるため。
document.addEventListener('pointerdown', function (e) {
  if (!L || !L.edit || !L.data) return;

  var handle = e.target.closest('.lay-handle');

  var additive = e.shiftKey || e.ctrlKey || e.metaKey || L.multi;
  var start = function (g) {
    var live = $('layCanvas');

  };

    L.textUndo = -1;
    var mode = handle.dataset.h;
    if (mode === 'pt') { var was = L.pt; L.pt = Number(handle.dataset.pi); if (was !== L.pt) drawLayoutCanvas(); }
    start({ mode: mode, i: L.sel, pi: Number(handle.dataset.pi), orig: layClone(list[L.sel]) });
    return;
  }

  if (i < 0 || !list[i]) {
    // 何もない所：引っぱれば囲んで選ぶ。押しただけなら選択をやめる

  else if (L.sels.indexOf(i) === -1) L.sels = [i];     // まとめて選んだ中の1つを押したときは、選択を保ったまま全部を動かす

    else if (g.mode === 'p1') { el.x1 = P(o.x1 + dx); el.y1 = P(o.y1 + dy); }

      el.points[g.pi] = [P(g.orig.points[g.pi][0] + dx), P(g.orig.points[g.pi][1] + dy)];
    }
    else if (g.mode === 'pt') { el.points[g.pi] = [P(o.points[g.pi][0] + dx), P(o.points[g.pi][1] + dy)]; }

  }
  if (!g.moved) {

    if (g.mode === 'move' && g.toggleOff >= 0) { L.sels = L.sels.filter(function (k) { return k !== g.toggleOff; }); drawLayoutBox(); }

    var dep = sel.dataset.dep;

      return S.D.devices.filter(function (d) { return d['顧客ID'] === cid && (d['状況'] !== '廃棄' || d['機器ID'] === keep); })

    };

        .map(function (a) { return [a['対応ID'], a['受付日'] + ' ' + String(a['内容']).replace(/\s+/g, ' ').slice(0, 30)]; });

    '" data-base="' + esc(rec && rec['更新日時'] ? rec['更新日時'] : '') + '" novalidate>' +
    '<div class="body"><p class="msg" hidden></p>' + offerHtml + html + extra + (PHOTO_LABEL[key] && S.D.photoKinds.indexOf(key) !== -1 ? photoBoxHtml(key, id) : '') +
    (rec && rec['更新日時'] ? '<p class="note">最後の更新：' + esc(rec['更新日時']) + '</p>' : '') + '</div>' +
    '<footer>' + (canDelete ? '<button type="button" class="btn danger" data-act="deleteRecord" data-key="' + key + '" data-id="' + esc(id) + '">削除</button>' : '') +
    '<span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button>' +
    (key === 'device' && isNew ? '<button type="button" class="btn" data-act="saveNext">保存して次の機器</button>' : '') +
    '<button type="submit" class="btn primary">保存</button></footer></form>');
  var form = wrap.querySelector('form');
  var custEl = form.elements['顧客ID'];
  Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.cid = custEl ? custEl.value : ''; });
  refreshDependents(form);
  initPhotos(form, key, id);
  form._initial = formSnapshot(form);     // 開いたときの中身（ここから変わっていたら「入力の途中」）
  if (key === 'license' && S.D.canReveal && !isNew) loadLicCred(form, id, rec['顧客ID']);
  return wrap;
}

// ---- ライセンスの ID・パスワード・シリアルキー（v0.15.0）。入れ先は「認証情報」（対象区分＝ライセンス）
//   パスワードとシリアルキーは、画面に読み込まない（空のままなら今のまま）。下書きにも残さない。
var LIC_CRED = [['loginId', 'ログインID', 'text'], ['password', 'パスワード', 'password'], ['serialKey', 'シリアルキー', 'password']];
function licCredBoxHtml(isNew) {
  return '<div class="box credbox" id="licCredBox"><b>ID・パスワード</b> <span class="note">「認証情報」に入ります。パスワードは保存のあと「認証情報」のタブで表示できます。</span>' +
    '<div class="grid2">' + LIC_CRED.map(function (c) {
      return '<div class="field"><label for="lc_' + c[0] + '">' + c[1] + '</label><input type="text" id="lc_' + c[0] + '" data-cred="' + c[0] + '" data-orig="" autocomplete="off"' + (c[2] === 'password' ? ' class="secret"' : '') + ' maxlength="' + (c[0] === 'serialKey' ? 300 : 200) + '"' +
        (isNew ? '' : ' disabled') + '></div>';
    }).join('') + '</div><p class="note" id="licCredNote">' + (isNew ? '' : '読み込んでいます…') + '</p></div>';
}
function loadLicCred(form, licenseId, customerId) {
  call('listCredentials', { customerId: customerId, audit: false }, true).then(function (r) {
    if (!form.isConnected) return;
    var all = r.credentials.filter(function (c) { return c['対象区分'] === 'ライセンス' && c['対象ID'] === licenseId; });
    var c = all[0] || null;
    var inputs = form.querySelectorAll('[data-cred]');
    Array.prototype.forEach.call(inputs, function (i) { i.disabled = false; });
    var idEl = form.querySelector('[data-cred="loginId"]');
    if (c && !idEl.value) { idEl.value = c['ログインID'] || ''; idEl.dataset.orig = idEl.value; }
    ['password', 'serialKey'].forEach(function (k) {
      var el = form.querySelector('[data-cred="' + k + '"]'), field = k === 'password' ? 'パスワード' : 'シリアルキー';
      if (!c) return;
      if (r.withSecrets && c[field] !== undefined) { if (!el.value) { el.value = c[field]; el.dataset.orig = el.value; } }     // 管理者は、そのまま見える（v0.20.0）
      else if (c[field + 'あり']) el.placeholder = '登録済み（変えるときだけ入れる）';
    });
    form._credId = c ? c['認証ID'] : '';
    $('licCredNote').textContent = c ? (all.length > 1 ? 'ほかにも' + (all.length - 1) + '件、このライセンスの認証情報があります（「認証情報」のタブで見られます）。' : '') : 'まだ登録されていません。';
  }).catch(function () {
    if (!form.isConnected) return;
    var n = $('licCredNote'); if (n) n.textContent = 'IDとパスワードを読み込めませんでした。ここでは変えられません（「認証情報」のタブから直せます）。';
  });
}
/** 打ったIDとパスワード。何も変えていなければ null（送らない） */
function licCredOf(form) {
  var inputs = form.querySelectorAll('[data-cred]');
  if (!inputs.length) return null;
  var out = {}, changed = false;
  Array.prototype.forEach.call(inputs, function (i) {
    out[i.dataset.cred] = i.value;
    if (!i.disabled && i.value !== (i.dataset.orig || '')) changed = true;
    if (i.dataset.cred !== 'loginId' && i.dataset.orig && !i.value) out.clear = true;     // 見えていたパスワードを消したら、消す
  });
  return changed ? out : null;
}
function licCredRestore(form, cred) {
  if (!form || !cred) return;
  Object.keys(cred).forEach(function (k) { var i = form.querySelector('[data-cred="' + k + '"]'); if (i) i.value = cred[k]; });
}

// ---- 機器を別の顧客へ移す（管理者・v0.15.0）
function openMoveDevice(deviceId) {
  var d = IDX.dev[deviceId];
  if (!d) return;
  var recent = recentCustIds();
  var others = S.D.customers.filter(function (c) { return c['顧客ID'] !== d['顧客ID']; })
    .sort(function (a, b) {
      var ra = recent.indexOf(a['顧客ID']), rb = recent.indexOf(b['顧客ID']);
      if (ra !== rb) return (ra === -1 ? 99 : ra) - (rb === -1 ? 99 : rb);
      return cmp(a['ふりがな'] || a['顧客名'], b['ふりがな'] || b['顧客名']);
    });
  var wrap = openModal('<header><h2>別の顧客へ移す <span class="sub">' + esc(deviceId) + '</span></h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
    '<div class="body"><p class="msg" hidden id="moveMsg"></p>' +
    '<p><b>' + esc(devLabel(deviceId) || deviceId) + '</b>　いまの顧客：' + esc(custName(d['顧客ID'])) + '</p>' +
    '<div class="field"><label for="moveTo">移す先の顧客</label><select id="moveTo"><option value="">選んでください</option>' + others.map(function (c) {
      return '<option value="' + esc(c['顧客ID']) + '">' + esc(c['顧客名'] + (c['状態'] === '無効' ? '（無効）' : '')) + '</option>';
    }).join('') + '</select></div>' +
    '<p class="note">一緒に移るもの：機器の写真・この機器の認証情報・機器診断・この機器を選んである対応履歴／修理／保守の記録。<br>外れるもの：ライセンスの割当（前の顧客のライセンスなので）。<br>' +
    '収集ツールの設定（APIトークン）も、移す先の顧客のものに入れ替えてください。入れ替えないと、次に送ったときに前の顧客に新しい機器ができます。</p></div>' +
    '<footer><span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button><button type="button" class="btn primary" id="moveGo">移す</button></footer>', true);
  wrap.querySelector('#moveGo').addEventListener('click', function () {
    var to = $('moveTo').value, btn = this, msg = $('moveMsg');
    if (!to) { msg.textContent = '移す先の顧客を選んでください。'; msg.hidden = false; return; }
    btn.disabled = true;
    call('moveDevice', { deviceId: deviceId, customerId: to }).then(function (r) {
      closeModal(btn);
      noteRecentCust(to);
      var m = r.moved;
      toast(custName(to) + 'へ移しました（対応' + m.activities.length + '・修理' + m.repairs.length + '・保守' + m.maintenances.length + '件も一緒に）');
      // 関係する一覧がいくつも変わるので、最新を読み込み直す
      ACT.refreshAll();
    }).catch(function (e) {
      btn.disabled = false;
      if (e && e.error === 'unauthorized') return;
      msg.textContent = (e && e.message) || '移せませんでした。'; msg.hidden = false;
    });
  });
}

// 保存の前に、変えたところを見せる種類（v0.30.0）
var DIFF_KEYS = { device: 1, license: 1, customer: 1, repair: 1, rental: 1, loan: 1, maintenance: 1, staff: 0 };
/** 項目の値を、画面で見る形にする（顧客・機器はIDでなく名前） */
function diffText(f, v) {
  if (Array.isArray(v)) v = v.join('・');
  v = v === null || v === undefined ? '' : String(v);
  if (v === '') return '（空）';
  if (f.type === 'customer') return custName(v) || v;
  if (f.type === 'device') return devLabel(v) || v;
  if (f.type === 'rental') return ((IDX.rental || {})[v] || {})['名称'] || v;
  if (f.type === 'datetime') v = v.replace('T', ' ');
  v = v.replace(/\s+/g, ' ');
  return v.length > 60 ? v.slice(0, 60) + '…' : v;
}
function sameValue(a, b) {
  var n = function (v) { return Array.isArray(v) ? v.slice().sort().join(',') : v === null || v === undefined ? '' : String(v).replace('T', ' ').replace(/\r\n/g, '\n').trim(); };
  return n(a) === n(b);
}
/** 前の記録と、窓に入っている値の違い → [{label, before, after}] */
function recordChanges(key, orig, data) {
  var out = [];
  S.D.schema[key].fields.forEach(function (f) {
    if (f.type === 'secret' || !Object.prototype.hasOwnProperty.call(data, f.name)) return;
    var b = orig[f.name], a = data[f.name];
    if (f.type === 'multi' && !Array.isArray(b)) b = String(b || '').split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x; });
    // 空の古い値は、窓に出していた形（はい／いいえ の「いいえ」、必須の選択の最初の値）として比べる
    if ((b === '' || b === undefined || b === null) && f.type === 'yesno') b = 'いいえ';
    if ((b === '' || b === undefined || b === null) && f.type === 'select' && f.required && f.choices && a === f.choices[0]) return;
    if (sameValue(b, a)) return;
    out.push({ label: FIELD_LABEL[f.name] || f.name, before: diffText(f, b), after: diffText(f, a) });
  });
  return out;
}
/** ライセンスの窓の ID・パスワード欄に、何か打ったか */
function licCredChanged(form) {
  return Array.prototype.some.call(form.querySelectorAll('.credbox input, .credbox textarea'), function (el) { return el.type !== 'hidden' && el.value !== el.defaultValue; });
}
function collectForm(form, key) {
  var data = {};
  var schema = S.D.schema[key];
  schema.fields.forEach(function (f) {
    if (f.adminOnly && !S.D.me.isAdmin) return;
    if (f.type === 'multi') {
      data[f.name] = Array.prototype.filter.call(form.querySelectorAll('input[data-multi]'), function (x) { return x.dataset.multi === f.name && x.checked; })
        .map(function (x) { return x.value; });
      return;
    }
    var el = form.elements[f.name];
    if (!el) return;
    data[f.name] = f.type === 'datetime' ? el.value.replace('T', ' ') : el.value;
  });
  if (form.dataset.id) data[schema.idField] = form.dataset.id;
  return data;
}

function upsert(list, idField, rec) {
  for (var i = 0; i < list.length; i++) if (list[i][idField] === rec[idField]) { list[i] = rec; return; }
  list.unshift(rec);
}

function submitRecordForm(form, next) {
  var key = form.dataset.form;
  var schema = S.D.schema[key];
  var msg = form.querySelector('.msg');
  // 必須の空欄は、サーバーに送る前に知らせる
  var missing = schema.fields.filter(function (f) {
    var el = form.elements[f.name];
    return f.required && el && !el.disabled && !String(el.value).trim();
  })[0];
  var showMsg = function (text) {
    msg.textContent = text; msg.hidden = false;
    if (msg.scrollIntoView) msg.scrollIntoView({ block: 'nearest' });
  };
  if (missing) {
    showMsg('「' + (FIELD_LABEL[missing.name] || missing.name) + '」を' + (missing.type === 'text' || missing.type === 'longtext' ? '入れて' : '選んで') + 'ください。');
    var box = form.querySelector('[data-field="' + missing.name + '"]');
    if (box && box.closest('details')) box.closest('details').open = true;
    var target = box && box.querySelector('input:not([type="hidden"]):not([disabled]), select, textarea, button');
    if (target) target.focus();
    return;
  }
  var data = collectForm(form, key);
  var buttons = form.querySelectorAll('footer button');
  msg.hidden = true;
  // 直したときは、保存の前に「何をどう変えたか」を見せる（v0.30.0）
  var diffOk = form._diffOk; form._diffOk = false;      // 「保存する」を押した1回だけ有効（失敗して直したときは、また見せる）
  if (DIFF_KEYS[key] && form.dataset.id && !diffOk) {
    var orig = findRecord(key, form.dataset.id);
    if (orig && !orig._pending) {
      var changes = recordChanges(key, orig, data);
      var extra = (form._photos && form._photos.length) || (key === 'license' && !!licCredOf(form));
      if (!changes.length && !extra) {
        // 空白だけ変えた・前の下書きから開いた、などで「入力の途中」に見えても、下書きには残さない
        var ov = form.closest('.overlay'); if (ov) ov._noDraft = true;
        if (form._draftId) draftDropId(form._draftId);
        toast('変更はありません'); closeModal(form); return;
      }
      if (changes.length) {
        confirmDialog('この内容で保存しますか', changes.map(function (c) { return '■ ' + c.label + '\n　' + c.before + '\n　→ ' + c.after; }).join('\n'), '保存する', false, '戻って直す').then(function (yes) {
          if (!yes || !form.isConnected) return;
          form._diffOk = true;
          submitRecordForm(form, next);
        });
        var dw = $('modals').lastElementChild; if (dw) dw.classList.add('diffconfirm');
        return;
      }
    }
  }
  var draftId = form._draftId || '';
  // 写真を小さくしている途中なら、終わるのを待ってから保存する（待たずに保存すると、その写真が付かない）
  if (form._preparing > 0) {
    if (form._waitingPhotos) return;
    form._waitingPhotos = true;
    Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
    showMsg('写真を準備しています。終わったら、そのまま保存します…');
    form._chain.then(function () {
      form._waitingPhotos = false;
      form._diffOk = diffOk;      // 確かめ済みなら、写真を待ったあとにもう一度は聞かない
      Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
      if (form.isConnected) submitRecordForm(form, next);
    });
    return;
  }
  var carryNext = function () {
    // 同じ場所で何台も続けて登録するとき用。人ごとに違う項目（利用者・シリアルなど）だけ空にして開き直す
    var carry = { lockCustomer: form.dataset.lock === '1' };
    ['顧客ID', '種類', 'メーカー', '機種名', '設置場所', '部署', '購入日', '購入元', '保証期限', '状況'].forEach(function (k) { carry[k] = data[k]; });
    openForm(key, null, carry);
  };
  if (key === 'credential') {
    // 認証情報は、返事を待ってから閉じる（パスワードを画面に持たないため）
    Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
    call(SAVE_FN[key], { data: data }).then(function (r) {
      if (S.creds) { upsert(S.creds.list, schema.idField, r.record); delete S.creds.shown[r.record[schema.idField]]; }
      if (S.D.me.isAdmin) S.creds = null;      // 管理者は、読み直してパスワードも見えるようにする
      closeModal(form);
      toast(r.created ? schema.label + 'を追加しました' : '保存しました');
      S.alertsStale = true;
      render();
    }).catch(function (e) {
      Array.prototype.forEach.call(buttons, function (b) { b.disabled = false; });
      if (e && e.error === 'unauthorized') return;
      if (form.querySelector('details.rest')) form.querySelector('details.rest').open = true;
      showMsg((e && e.message) || '保存できませんでした。');
    });
    return;
  }

  // ---- 先に画面へ出す：窓を閉じて一覧に入れ、サーバーの返事は裏で待つ。だめだったら、元に戻して窓を開き直す
  var idField = schema.idField;
  // 一覧は、使うたびに取り直す（返事を待つ間に、残りのデータが届いて一覧が入れ替わることがある）
  var listNow = function () { return S.D[COLLECTION[key]]; };
  var id = data[idField] || '';
  var before = id ? findRecord(key, id) : null;
  var prov = provisionalRecord(key, before, data);
  var lock = form.dataset.lock === '1';
  var photos = takePendingPhotos(form);
  var cred = key === 'license' ? licCredOf(form) : null;
  // 手元に全部は持っていない一覧（対応履歴は新しい1000件まで）に、古い記録を足すと、「どこまで読んだか」が狂う。
  // 新しい記録か、すでに一覧にある記録のときだけ、一覧に入れる
  var inList = !before || listNow().some(function (r) { return r[idField] === id; });
  var putIn = function (rec) {
    if (inList) upsert(listNow(), idField, rec);
    if (key === 'activity') {
      Object.keys(S.custActs).forEach(function (c) {
        var l = S.custActs[c], at = -1;
        for (var i = 0; i < l.length; i++) if (l[i][idField] === rec[idField]) { at = i; break; }
        if (c === rec['顧客ID']) { if (at === -1) l.unshift(rec); else l[at] = rec; }
        else if (at !== -1) l.splice(at, 1);      // 顧客を変えたときは、前の顧客の一覧から外す
      });
      Object.keys(S.actRange).forEach(function (k) {
        var l = S.actRange[k];
        if (Array.isArray(l)) for (var i = 0; i < l.length; i++) if (l[i][idField] === rec[idField]) l[i] = rec;
      });
    }
  };
  var takeOut = function (recId) {
    var drop = function (l) { for (var i = l.length - 1; i >= 0; i--) if (l[i][idField] === recId) l.splice(i, 1); };
    drop(listNow());
    if (key === 'activity') Object.keys(S.custActs).forEach(function (c) { drop(S.custActs[c]); });
  };
  putIn(prov);
  if (key === 'activity' && !before) S.D.activityTotal += 1;
  reindex();
  // 下書きは、サーバーの返事が「保存できた」で返ってから消す。
  // それまでは「保存の途中」として残しておく（返事の前にページが閉じた・時間切れだった、のときに、打ったものが消えないように）
  if (draftable(form)) { draftPut(form, true); draftId = form._draftId || ''; if (draftId) S.sending[draftId] = true; }
  form.closest('.overlay')._noDraft = true;
  if (data['顧客ID']) noteRecentCust(data['顧客ID']);
  closeModal(form);
  render();
  if (next) carryNext();
  var saveT0 = Date.now();
  var saveTok = S.token;
  call(SAVE_FN[key], cred ? { data: data, cred: cred } : { data: data }).then(function (r) {
    if (!S.D || S.token !== saveTok) return;     // ログアウト・入り直しのあとに届いた返事は、新しいログインには入れない
    S.timing.save = Date.now() - saveT0;     // いちばん下の「読み込み：…」の行に、最後の保存にかかった時間を出す（v0.18.0）
    if (r.cred && S.creds && S.creds.customerId === r.cred['顧客ID']) { upsert(S.creds.list, '認証ID', r.cred); delete S.creds.shown[r.cred['認証ID']]; }
    if (!before) takeOut(prov[idField]);
    putIn(r.record);
    if (key === 'activity') S.actRange = {};
    reindex();
    S.alertsStale = true;
    toast(r.created ? schema.label + 'を追加しました' : '保存しました');
    if (draftId) { draftDropId(draftId); delete S.sending[draftId]; }
    S.savedAt[key + ':' + r.record[idField]] = Date.now();
    noteSaved(key, r.record);
    softRender();
    if (photos.length) uploadPhotos(key, r.record, photos);
  }).catch(function (e) {
    if (!S.D || S.token !== saveTok) return;          // 時間切れなどでログイン画面に戻った。下書き（保存の途中）は残してあるので、入り直すと上の帯に出る
    if (draftId) delete S.sending[draftId];
    // 元に戻す
    if (before) putIn(before); else { takeOut(prov[idField]); if (key === 'activity') S.D.activityTotal -= 1; }
    reindex();
    softRender();
    if (e && e.error === 'unauthorized') return;
    // 入れた内容のまま、窓を開き直して理由を出す
    var draft = {};
    Object.keys(prov).forEach(function (k) { if (k !== '_pending') draft[k] = prov[k]; });
    if (!before) delete draft[idField];
    draft.lockCustomer = lock;
    var wrap = openForm(key, before ? draft : null, before ? null : draft);
    var again = wrap && wrap.querySelector('form');
    if (again) {
      // 保存できなかった内容は「入力の途中」として扱う（閉じても下書きに残る）。下書きも、すぐ書き直す
      again._forceDirty = true;
      if (draftId) again._draftId = draftId;
      if (before) {
        again._draftFields = {};
        Object.keys(draft).forEach(function (k) { if (k !== idField && k !== 'lockCustomer' && String(draft[k]) !== String(before[k] === undefined ? '' : before[k])) again._draftFields[k] = true; });
        again.dataset.base = before['更新日時'] || '';
      }
      draftPut(again);
      restorePendingPhotos(again, photos);
      licCredRestore(again, cred);
      if (again.querySelector('details.rest')) again.querySelector('details.rest').open = true;
      var m = again.querySelector('.msg');
      m.textContent = (e && e.message) || '保存できませんでした。'; m.hidden = false;
      if (m.scrollIntoView) m.scrollIntoView({ block: 'nearest' });
    }
  });
}
</script>
