<script>
'use strict';
// AdminJsActions.html … 管理画面の動き（操作（ボタンの動き）・起動）
// Admin.html から読み込む。順番に意味がある（Admin.html の並び順で読み込むこと）
// ===========================================================================
// 操作
// ===========================================================================
var ACT = {
  nav: function (el) { go(el.dataset.view); },
  sub: function (el) { var next = el.dataset.sub; guardLayout(function () { S.sub = next; render(); }); },
  sort: function (el) {
    var t = el.dataset.table, i = Number(el.dataset.i), st = S.sort[t];
    S.sort[t] = st && st.i === i ? { i: i, dir: -st.dir } : { i: i, dir: 1 };
    render();
  },
  closeModal: function (el) { closeModal(el); },
  logout: function () {
    var token = S.token;
    // まだ送っていない絞り込みがあれば、先に覚えてからログアウトする
    var saved = viewTimer ? sendView() : Promise.resolve();
    // この端末の「ログインしたまま」も取り消す（スタッフIDは、次のログインのために残す）
    var secret = rememberNow(), ticket = S.ticket || '';
    keepSet(REMEMBER_KEY, '');
    if (!Object.keys(S.sending || {}).length) keepSet(DRAFT_KEY, '');        // ログアウトしたら、この端末の下書きも消す（保存の途中のものがあれば残す）
    toLogin('');
    var bye = function () { google.script.run.withFailureHandler(function () {}).logout({ token: token, remember: secret, ticket: ticket }); };
    saved.then(bye, bye);
  },
  /**
   * 控えを使わずに、シートから読み直す（いま見ている画面のまま）。
   * 読み直している間は、画面を覆って操作を止める（途中で保存や移動をすると、古い返事で上書きしてしまうため）。
   */
  refreshAll: function () {
    if (!S.D || refreshBusy) return;
    refreshBusy = true;
    $('blocker').hidden = false;
    var token = S.token;
    var pending = viewTimer ? sendView() : Promise.resolve();
    var done = function () { refreshBusy = false; $('blocker').hidden = true; };
    var run = function () {
      if (!S.D || S.token !== token) return null;
      S.timing = { t0: Date.now() };
      return call('getBootstrap', { part: 'core', fresh: true }).then(function (core) {
        // 待っている間にログアウトした・ログインし直したときは、何もしない
        if (!S.D || S.token !== token) return null;
        S.custActs = {}; S.actRange = {}; S.creds = null; S.staff = null; S.release = undefined; S.audit = null; S.files = null; S.report = null;
        Object.keys(REST_EMPTY).forEach(function (k) { core[k] = Array.isArray(REST_EMPTY[k]) ? [] : REST_EMPTY[k] && typeof REST_EMPTY[k] === 'object' ? {} : REST_EMPTY[k]; });
        S.D = core;
        S.alerts = []; S.ready = false; S.restFailed = false;
        reindex();
        showBrand();
        if (S.view === 'customer' && !IDX.cust[S.customerId]) { S.view = 'customers'; S.customerId = ''; S.sub = 'devices'; }
        S.timing.first = Date.now() - S.timing.t0;
        S.timing.coreMs = core.coreMs; S.timing.coreCache = core.coreCache;
        render();
        return loadRest();
      }).then(function () { if (S.D && S.ready && S.token === token) toast('最新のデータを読み込みました'); }).catch(failToast);
    };
    pending.then(run, run).then(done, done);
  },
  forgetView: function (el) {
    closeModal(el);
    S.q = {}; S.sort = {}; S.per = {};
    sendView();
    toast('覚えていた絞り込み・並び替えを消しました');
    render();
  },
  openPassword: function (el) { if (el && el.closest('.overlay')) closeModal(el); openPasswordForm(); },
  retryRest: function () { render(); loadRest(); },
  printYear: function () {
    var c = IDX.cust[S.customerId], box = $('yearBox');
    if (!c || !box) return;
    printHtml('<h1>' + esc(c['顧客名']) + '　1年の振り返り</h1>' + box.innerHTML);
  },
  printCustomer: function () {
    if (!S.ready) { toast('読み込みが終わってから、もう一度押してください。', true); return; }
    var c = IDX.cust[S.customerId];
    if (!c) return;
    var box = function (name, label, checked, note) {
      return '<label class="check"><input type="checkbox" name="' + name + '"' + (checked ? ' checked' : '') + '> ' + label + (note ? '<span class="note">　' + note + '</span>' : '') + '</label>';
    };
    openModal('<header><h2>印刷・PDFにする <span class="sub">' + esc(c['顧客名']) + '</span></h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
      '<form data-form="printcustomer" novalidate><div class="body"><p class="msg" hidden></p>' +
      '<div class="field"><span class="lab">印刷するもの</span><div class="checks">' +
        box('info', '会社の情報', true) + box('devices', '機器の一覧', true) + box('licenses', 'ライセンス', true) + box('layouts', 'レイアウト図', true, '1枚ずつ、ページを分けます') +
      '</div></div>' +
      '<div class="field"><span class="lab">細かい指定</span><div class="checks">' +
        box('gone', '廃棄した機器も入れる', false) + box('notes', '備考も入れる', false, '社内用。お客様に渡すときは外したままに') +
      '</div><span class="note">ID・パスワードなどの認証情報は、印刷に入りません。</span></div>' +
      '</div><footer><span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button><button type="submit" class="btn primary">印刷する</button></footer></form>', true);
  },
  openMyPrefs: function (el) {
    if (el && el.closest('.overlay')) closeModal(el);
    var D = S.D, common = START_KEY[D.settings['開いた直後の画面']] ? D.settings['開いた直後の画面'] : D.startViews[0];
    openModal('<header><h2>自分の設定</h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
      '<form data-form="myprefs" novalidate><div class="body"><p class="msg" hidden></p>' +
      '<div class="field"><label for="my_start">開いた直後の画面</label><select id="my_start">' +
        optionsHtml([['', '全体の設定に合わせる（いまは「' + common + '」）']].concat(D.startViews), D.me.startView || '') + '</select>' +
        '<span class="note">ログインした直後に開く画面です。自分のぶんだけ変わります。スマホでは、いつも「入力」の画面から始まります。</span></div>' +
      '<div class="field"><label>絞り込み・並び替え</label>' +
        '<span class="note">各画面の絞り込み・検索の文字・並び替え・期間の種類（週ごと／月ごと など）は、自動で覚えます。次に開いたとき、パソコンでもスマホでも同じ状態で始まります。</span>' +
        '<div><button type="button" class="btn small" data-act="forgetView">覚えた絞り込み・並び替えを消す</button></div></div>' +
      '</div><footer><span class="grow"></span><button type="button" class="btn" data-act="closeModal">やめる</button><button type="submit" class="btn primary">保存</button></footer></form>', true);
  },
  quickAdd: function () {
    var c = S.view === 'customer' ? IDX.cust[S.customerId] : null;
    var item = function (key, title, sub, primary) {
      return '<button type="button" class="btn' + (primary ? ' primary' : '') + '" data-act="quickNew" data-key="' + key + '">' + title + '<span>' + sub + '</span></button>';
    };
    openModal('<header><h2>記録する' + (c ? ' <span class="sub">' + esc(c['顧客名']) + '</span>' : '') + '</h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
      '<div class="body"><div class="sheet-list">' +
      item('activity', '対応を記録', '訪問・リモート・電話などの対応', true) +
      item('repair', '修理を受け付け', '預かった機器と状況') +
      item('maintenance', '保守を記録', '定期保守・スポット保守の実施') +
      item('license', 'ライセンスを追加', '製品名・数量・有効期限') +
      item('device', '機器を追加', 'PCやプリンターを台帳に足す') +
      item('memo', 'メモを書く', 'スタッフどうしの連絡。お客様には見えません') +
      item('customer', '顧客を追加', '新しい取引先') +
      '</div></div>', true, true);
  },
  quickNew: function (el) {
    if (el.closest('.overlay')) closeModal(el);
    var preset = S.view === 'customer' && el.dataset.key !== 'customer' ? { '顧客ID': S.customerId, lockCustomer: true } : null;
    openForm(el.dataset.key, null, preset);
  },
  draftOpen: function (el) {
    var d = draftById(el.dataset.draft);
    var wrap = el.closest('.overlay');
    if (wrap) { wrap._noDraft = true; closeModal(el); }
    if (d) openDraft(d); else render();
  },
  draftDrop: function (el) {
    draftDropId(el.dataset.draft);
    var offer = el.closest('.draft-offer');
    if (offer) offer.remove(); else render();
  },
  /** 下のメニューのまん中。顧客の画面では、その顧客の記録を選ぶ窓。ほかでは「入力」の画面へ */
  plusInput: function () { if (S.view === 'customer') ACT.quickAdd(); else go('home'); },
  homeClear: function () { S.homeQ = ''; var i = $('homeQ'); if (i) i.value = ''; drawHomeHits(); },
  openMenu: function () {
    var go2 = function (view, title) { return '<button type="button" class="btn" data-act="menuGo" data-view="' + view + '">' + title + '</button>'; };
    openModal('<header><h2>メニュー <span class="sub">' + esc(S.D.me.name) + '（' + esc(S.D.me.role) + '）</span></h2><button type="button" class="x" data-act="closeModal" aria-label="閉じる">×</button></header>' +
      '<div class="body"><div class="sheet-list">' + go2('licenses', 'ライセンス') +
      (S.D.rentalOn ? go2('rentals', 'レンタル') : '') + go2('notices', 'お知らせ') +
      (S.D.me.isAdmin ? go2('settings', '設定') + go2('audit', '変更履歴') : '') +
      '<button type="button" class="btn" data-act="openMyPrefs">自分の設定</button>' +
      '<button type="button" class="btn" data-act="openPassword">パスワード変更</button>' +
      '<button type="button" class="btn" data-act="logout">ログアウト</button></div></div>', true, true);
  },
  mmStart: function () { go('mmaint'); },
  mtgWeek: function (el) { var st = mtgState(); st.off = Math.min(0, st.off + Number(el.dataset.d)); st.monthly = null; render(); },
  reloadHealth: function () { S.health = null; S.healthFailed = false; var box = $('mtgHealth'); if (box) box.innerHTML = mtgHealthHtml(); },
  mtgMonthly: function () { var st = mtgState(); st.monthly = !mtgShowMonthly(); render(); },
  mtgFull: function () {
    var on = !document.body.classList.contains('mtgfull');
    document.body.classList.toggle('mtgfull', on);
    try { if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* 枠の中では全画面にできないことがある。文字を大きくするだけにする */ }
  },
  mtgPrint: function () {
    var st = mtgState(), w = mtgWeek(st.off);
    var box = document.querySelector('.mtggrid');
    if (!box) return;
    printHtml('<h1 class="ptitle">' + printLogoHtml() + 'ミーティング資料　' + esc(mdw(w.from) + '〜' + mdw(w.to)) + '　<small>' + esc(S.D.settings['自社名']) + '　' + esc(S.D.today) + ' 作成</small></h1>' +
      '<div class="mtggrid mprint">' + box.innerHTML.replace(/<textarea[^>]*>[\s\S]*?<\/textarea>/, function () { var t = ($('mtgMemo') || {}).value || ''; return '<div class="mmemo">' + (t.trim() ? esc(t) : '（なし）') + '</div>'; }) + '</div>');
  },
  mtgSaveMemo: function (el) {
    var st = mtgState(), w = mtgWeek(st.off), t = ($('mtgMemo') || {}).value || '';
    if (!t.trim()) { toast('メモを書いてください。', true); return; }
    el.disabled = true;
    call('saveMemo', { data: { '顧客ID': '', '本文': '【ミーティング ' + w.from + '〜' + w.to + '】\n' + t } }).then(function (r) {
      el.disabled = false; upsert(S.D.memos, 'メモID', r.record); delete st.memos[w.from]; toast('社内メモに残しました'); render();
    }).catch(function (e) { el.disabled = false; failToast(e); });
  },
  pFilter: function (el) { var st = pState(el.dataset.key); st.f = el.dataset.f; st.n = P_STEP; render(); },
  pMore: function (el) { var st = pState(el.dataset.key); st.n += P_STEP; pDraw(el.dataset.key); },
  pAlerts: function () { S.pAlertsOpen = !S.pAlertsOpen; render(); },
  mmCust: function (el) {
    var id = el.dataset.id || '';
    S.mm.cust = id; S.mm.dev = ''; S.mm.diag = null; S.mm.diagFor = '';
    if (id) noteRecentCust(id);
    render(); window.scrollTo(0, 0); armBack(); saveLocSoon();
  },
  mmDev: function (el) {
    var id = el.dataset.id;
    if (!IDX.dev[id]) return;
    S.mm.dev = id;
    if (S.mm.diagFor !== id) { S.mm.diagFor = ''; S.mm.diag = null; }
    render(); window.scrollTo(0, 0); armBack(); saveLocSoon();
  },
  mmRetry: function (el) { if (S.mm.diagErr === el.dataset.id) S.mm.diagErr = ''; mmRedraw(); },
  mmList: function () {
    var t = $('mmNote'); if (t) S.mm.notes[t.dataset.mmnote] = t.value;
    S.mm.dev = ''; render(); armBack(); saveLocSoon();
  },
  mmDone: function (el) {
    var id = el.dataset.id, d = IDX.dev[id];
    if (!d || S.mm.saving[id]) return;        // 返事を待っている間に、もう一度押しても送らない（記録が2つできないように）
    var t = $('mmNote'), note = t ? t.value : '';
    var done = mmDoneRec(id);
    var data = done ? { '実施ID': done['実施ID'], '内容': note }
      : { '顧客ID': d['顧客ID'], '機器ID': id, '実施日': S.D.today, '種別': S.D.maintKindRegular, '内容': note, '担当スタッフ': S.D.me.name };
    // 先に画面へ出す（v0.18.0）：すぐ一覧に戻って ✓ を付ける。サーバーの返事は裏で待ち、だめだったら元に戻す
    var before = done ? Object.assign({}, done) : null;
    var prov = done ? Object.assign({}, done, { '内容': note }) : Object.assign({ '実施ID': 'tmp' + (++tmpSeq), _pending: true }, data);
    upsert(S.D.maintenances, '実施ID', prov);
    reindex();
    S.mm.saving[id] = true;
    var token = S.token;
    delete S.mm.notes[id];
    toast(done ? '備考を直しました' : '✓ ' + (devLabel(id) || id) + ' を完了にしました');
    if (S.view === 'mmaint' && S.mm.dev === id) { S.mm.dev = ''; render(); window.scrollTo(0, 0); }
    var putBack = function () {
      var list = S.D.maintenances;
      for (var i = list.length - 1; i >= 0; i--) if (list[i]['実施ID'] === prov['実施ID']) list.splice(i, 1);
      if (before && !list.some(function (m) { return m['実施ID'] === before['実施ID']; })) list.unshift(before);    // 待っている間に読み直していたら、入れ直さない
    };
    var redraw = function () { if (S.view === 'mmaint' && !$('modals').children.length) mmRedraw(); else S.renderPending = true; };
    call('saveMaintenance', { data: data }).then(function (r) {
      if (!S.D || S.token !== token) return;     // ログインし直したあとに届いた返事は捨てる
      delete S.mm.saving[id];
      putBack();
      if (before) { for (var i = 0; i < S.D.maintenances.length; i++) if (S.D.maintenances[i]['実施ID'] === before['実施ID']) { S.D.maintenances.splice(i, 1); break; } }
      upsert(S.D.maintenances, '実施ID', r.record);
      reindex();
      noteSaved('maintenance', r.record);
      S.alertsStale = true;
      redraw();
    }).catch(function (e) {
      if (!S.D || S.token !== token) return;
      delete S.mm.saving[id];
      putBack();
      reindex();
      if (S.mm.notes[id] === undefined) S.mm.notes[id] = note;    // 打った備考は消さない
      redraw();
      if (e && e.error === 'unauthorized') return;
      toast('「' + (devLabel(id) || id) + '」の完了を保存できませんでした。もう一度開いて押してください。' + (e && e.message ? '（' + e.message + '）' : ''), true);
    });
  },
  mmReport: function () {
    if (!S.mm.cust) return;
    openForm('maintenance', null, { '顧客ID': S.mm.cust, '種別': S.D.maintKindRegular, '内容': mmSummaryText(), lockCustomer: true });
  },
  moveDevice: function (el) {
    var id = el.dataset.id, form = el.closest('form');
    var go2 = function () { var w = form && form.closest('.overlay'); if (w) { w._noDraft = true; closeModal(form); } openMoveDevice(id); };
    if (form && formDirty(form)) {
      confirmDialog('機器の編集の途中です', '保存していない変更は消えます。\n先に保存するときは「やめる」を押してください。', '移す画面へ', false, 'やめる').then(function (yes) { if (yes) go2(); });
    } else go2();
  },
  recordMaint: function (el) { openForm('maintenance', null, { '顧客ID': el.dataset.id, '種別': S.D.maintKindRegular, lockCustomer: true }); },
  openCustomerMaint: function (el) { S.creds = null; go('customer', { customerId: el.dataset.id, sub: 'maint' }); },
  lendRental: function (el) { openForm('loan', null, { 'レンタルID': el.dataset.id, lockRental: true }); },
  returnLoan: function (el) {
    var loan = findRecord('loan', el.dataset.id);
    if (!loan) return;
    var name = (IDX.rental[loan['レンタルID']] || {})['名称'] || loan['レンタルID'];
    confirmDialog('返却を記録', name + '（' + loanWho(loan) + '）の返却日を、今日（' + S.D.today + '）で記録します。', '返却を記録', false).then(function (yes) {
      if (!yes) return;
      call('saveLoan', { data: { '貸出ID': loan['貸出ID'], '返却日': S.D.today } }).then(function (r) {
        upsert(S.D.loans, '貸出ID', r.record); reindex(); S.alertsStale = true; toast('返却を記録しました'); render();
      }).catch(failToast);
    });
  },
  auditMore: function () { loadAudit(500); },
  layoutOpen: function (el) { var id = el.dataset.id; if (id !== L.id) guardLayout(function () { if (!L.list) { loadLayouts(); return; } loadLayout(id); }); },
  layoutNew: function () {
    guardLayout(function () {
      askText('新しいレイアウト', '名前（例：本社2F）', '', 40).then(function (name) {
        if (name === null) return;
        call('createLayout', { customerId: S.customerId, name: name }).then(function (r) {
          if (!L.list || L.customerId !== S.customerId) { L.customerId = ''; loadLayouts(); return; }
          L.list.push(r.layout);
          loadLayout(r.layout['レイアウトID']);
          toast('レイアウトを作りました。「編集する」から図形を置けます');
        }).catch(failToast);
      });
    });
  },
  layoutRename: function () {
    var cur = L.list.filter(function (l) { return l['レイアウトID'] === L.id; })[0];
    askText('名前を変える', 'レイアウトの名前', cur ? cur['名前'] : '', 40).then(function (name) {
      if (name === null) return;
      call('renameLayout', { layoutId: L.id, name: name }).then(function (r) {
        upsert(L.list, 'レイアウトID', r.layout); L.data['名前'] = r.layout['名前']; drawLayoutBox(); toast('名前を変えました');
      }).catch(failToast);
    });
  },
  layoutDelete: function () {
    var cur = L.list.filter(function (l) { return l['レイアウトID'] === L.id; })[0];
    confirmDialog('レイアウトを削除', '「' + (cur ? cur['名前'] : L.id) + '」を削除します。元には戻せません。', '削除する', true).then(function (yes) {
      if (!yes) return;
      var id = L.id;
      call('deleteLayout', { layoutId: id }).then(function () {
        L.list = L.list.filter(function (l) { return l['レイアウトID'] !== id; });
        toast('削除しました');
        if (L.list.length) loadLayout(L.list[0]['レイアウトID']); else { L.id = ''; L.data = null; drawLayoutBox(); }
      }).catch(failToast);
    });
  },
  layoutEdit: function () { L.edit = true; L.sels = []; L.pt = -1; L.multi = false; L.undo = []; L.redo = []; L.dirty = false; drawLayoutBox(); },
  layoutStop: function () {
    if (!L.dirty) { L.edit = false; L.sels = []; drawLayoutBox(); return; }
    confirmDialog('編集をやめる', '保存していない変更があります。保存せずにやめると、変更は消えます。', '保存せずにやめる', true).then(function (yes) { if (yes) loadLayout(L.id); });
  },
  layoutSave: function (el) {
    el.disabled = true;
    var id = L.id;
    call('saveLayout', { layoutId: id, elements: L.data.elements, backgroundColor: L.data.backgroundColor }).then(function (r) {
      if (L.id !== id) return;
      L.data.elements = r.elements; L.data['更新日時'] = r.updatedAt; L.dirty = false; L.sels = []; L.pt = -1; L.undo = []; L.redo = [];
      var cur = L.list.filter(function (l) { return l['レイアウトID'] === id; })[0];
      if (cur) { cur.count = r.elements.length; cur['更新日時'] = r.updatedAt; }
      toast('レイアウト図を保存しました'); drawLayoutBox();
    }).catch(function (e) { el.disabled = false; failToast(e); });
  },
  layoutAdd: function (el) {
    var type = el.dataset.type, list = L.data.elements, off = (list.length % 6) * 2;
    if (el.closest('.overlay')) closeModal(el);
    if (!layoutRoom(1)) return;
    layoutPushUndo();
    if (type === 'line' || type === 'arrow') list.push({ type: type, x1: 35, y1: 46 + off, x2: 65, y2: 46 + off, color: '', width: 2 });
    else if (type === 'poly') list.push({ type: 'poly', points: [[35, 40 + off], [52, 40 + off], [52, 56 + off]], color: '', width: 2 });
    else if (type === 'text') list.push({ type: 'text', x: 40 + off, y: 44 + off, text: '文字', size: 16, color: '' });

  deleteRecord: function (el) {
    var key = el.dataset.key, id = el.dataset.id, schema = S.D.schema[key];
    confirmDialog(schema.label + 'を削除', id + ' を削除します。元には戻せません。\n（削除した内容は、変更履歴シートに残ります）', '削除する', true).then(function (yes) {
      if (!yes) return;
      var idField = schema.idField;
      if (key === 'credential') {
        // 認証情報は、返事を待ってから消す
        call(DELETE_FN[key], { id: id }).then(function () {
          if (S.creds) S.creds.list = S.creds.list.filter(function (c) { return c[idField] !== id; });
          closeModal(el); toast('削除しました'); S.alertsStale = true; render();
        }).catch(failToast);
        return;
      }
      // ---- 先に画面から消す。サーバーでだめだったら、元の場所に戻す
      var listNow = function () { return S.D[COLLECTION[key]]; };
      var list = listNow();
      var at = -1, rec = null;
      for (var i = 0; i < list.length; i++) if (list[i][idField] === id) { at = i; rec = list[i]; break; }
      var kept = { custActs: [], allocations: null };
      if (at !== -1) list.splice(at, 1);
      if (key === 'activity') {
        S.D.activityTotal -= 1;
        Object.keys(S.custActs).forEach(function (c) {
          var l = S.custActs[c];
          for (var j = l.length - 1; j >= 0; j--) if (l[j][idField] === id) kept.custActs.push([c, j, l.splice(j, 1)[0]]);
        });
      }
      if (key === 'license') { kept.allocations = S.D.allocations; S.D.allocations = S.D.allocations.filter(function (a) { return a['ライセンスID'] !== id; }); }
      reindex();
      // 削除する記録の窓は、下書きに残さない（その記録の下書きがあれば、それも消す）
      var dwrap = el.closest('.overlay');

      draftsAll().forEach(function (d) { if (d.key === key && d.id === id) draftDropId(d.did); });
      closeModal(el);
      render();
      call(DELETE_FN[key], { id: id }).then(function (r) {
        if (!S.D) return;
        if (key === 'activity') {
          S.actRange = {};
          (r.clearedRepairIds || []).forEach(function (rid) { var rep = findRecord('repair', rid); if (rep) rep['元の対応ID'] = ''; });

        if (PHOTO_LABEL[key]) { if (photoCount(key, id)) S.files = null; delete S.D.photoCounts[photoCountKey(key, id)]; }

        softRender();
      }).catch(function (e) {
        if (!S.D) return;
        if (rec && at !== -1 && !listNow().some(function (r) { return r[idField] === id; })) listNow().splice(Math.min(at, listNow().length), 0, rec);
        if (key === 'activity') {
          S.D.activityTotal += 1;
          kept.custActs.forEach(function (k) { if (S.custActs[k[0]]) S.custActs[k[0]].splice(Math.min(k[1], S.custActs[k[0]].length), 0, k[2]); });
        }
        if (kept.allocations) S.D.allocations = kept.allocations;
        reindex();
        softRender();
        if (e && e.error === 'unauthorized') return;
        toast('削除できませんでした。' + ((e && e.message) || ''), true);
      });
    });
  },

document.addEventListener('click', function (e) {
  var chip = e.target.closest('[data-chip]');
  if (chip) {
    var set = chip.closest('.chipset'), cform = chip.closest('form');
    var hidden = cform.elements[set.dataset.chips];
    var on = chip.getAttribute('aria-pressed') === 'true';
    clearFormMsg(cform);
    if (on && set.dataset.required) return;          // 必須の項目は、選び直しだけ（外せない）
    hidden.value = on ? '' : chip.dataset.chip;
    Array.prototype.forEach.call(set.querySelectorAll('[data-chip]'), function (b) { b.setAttribute('aria-pressed', String(!on && b === chip)); });
    if (set.dataset.chips === '対象区分') {
      Array.prototype.forEach.call(cform.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
      refreshDependents(cform);
    }
    return;
  }
  var pick = e.target.closest('[data-pick]');
  if (pick) {
    var picker = pick.closest('.picker'), pform = pick.closest('form');
    picker.querySelector('input[type="hidden"]').value = pick.dataset.pick;
    picker.querySelector('.picked b').textContent = custName(pick.dataset.pick);
    picker.querySelector('.picked').hidden = false;
    picker.querySelector('.pick-search').hidden = true;
    clearFormMsg(pform);
    Array.prototype.forEach.call(pform.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
    refreshDependents(pform);
    var nextEl = pform.querySelector('select[data-dep]:not(:disabled), [data-chip], textarea');
    if (nextEl) nextEl.focus();
    return;
  }
  var tok = e.target.closest('[data-token]');
  if (tok) {
    var sug = tok.closest('.suggest');
    var inputEl = tok.closest('form').elements[sug.dataset.suggest];
    var list = splitTokens(inputEl.value), at = list.indexOf(tok.dataset.token);
    if (at === -1) list.push(tok.dataset.token); else list.splice(at, 1);
    inputEl.value = list.join('、');
    tok.setAttribute('aria-pressed', String(at === -1));
    return;
  }
  // 行の中のリンク（「開く」など）を押したときは、行を押した扱いにしない
  var anchor = e.target.closest('a[href]');
  if (anchor && !anchor.dataset.act) return;
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var parts = el.dataset.act.split(':');
  var fn = ACT[parts[0]];
  if (fn) fn(el, parts[1]);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('modals').children.length) { closeModal(null); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.click')) e.target.click();
  // レイアウト図：選んだ図形を、キーで消す・少し動かす。Ctrl+A で全部を選ぶ（文字を打っている間は効かせない）
  if (L && L.edit && L.data && !$('modals').children.length && !(e.target.matches && e.target.matches('input, textarea, select'))) {
    var move = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault();
      L.sels = L.data.elements.map(function (x, i) { return i; }); L.pt = -1;
      drawLayoutBox();
    } else if (e.key === 'Escape' && L.sels.length) { ACT.layoutSelectNone(); }
    else if (L.sels.length && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); ACT.layoutRemove(); }
    else if (L.sels.length && move) {
      e.preventDefault();
      var picked = L.sels.map(function (i) { return L.data.elements[i]; });
      var origs = picked.map(layClone);
      var wasSnap = L.snap; L.snap = true;            // キーは、いつも1マスずつ
      var m = layGroupDelta(origs, move[0], move[1]);
      L.snap = wasSnap;
      if (!m[0] && !m[1]) return;
      layoutPushUndo();
      picked.forEach(function (x, n) { layShift(x, origs[n], m[0], m[1]); });
      layoutChanged();
    }
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.picksearch) {
    e.preventDefault();
    var only = e.target.parentNode.querySelectorAll('[data-pick]');
    if (only.length === 1) only[0].click();   // 候補が1件に絞れていたら、それを選ぶ
  }
});

// 絞り込み
function clearFormMsg(form) {
  var m = form && form.dataset && form.dataset.form ? form.querySelector('.msg') : null;
  if (m) m.hidden = true;
}
function onFilter(e) {
  var t = e.target;
  if (t.dataset && t.dataset.q) {
    // 同じ値なら作り直さない。入力欄からカーソルが外れたときの change で一覧を作り直すと、
    // そのとき押していた行が差し替わって、1回目のクリックが効かなくなる
    if (q(t.dataset.q, null) === t.value) return;
    S.q[t.dataset.q] = t.value; refreshList(); return;
  }
  if (t.dataset && (t.dataset.permonth || t.dataset.perfrom || t.dataset.perto)) {
    if (e.type !== 'change') return;                 // 打っている途中では動かさない
    var per = perState(t.dataset.permonth || t.dataset.perfrom || t.dataset.perto);
    if (t.dataset.permonth) { if (/^\d{4}-\d{2}$/.test(t.value)) per.month = t.value; }
    else if (isYmd(t.value)) { if (t.dataset.perfrom) per.from = t.value; else per.to = t.value; }
    render();
    return;
  }
  if (t.dataset && t.dataset.layprop && L.data && L.data.elements[L.sel]) {
    if (L.textUndo !== L.sel) { layoutPushUndo(); L.textUndo = L.sel; }   // 1つの図形の文字を打っている間は、元に戻す1回ぶん
    L.data.elements[L.sel].text = t.value;
    if (!L.dirty) { L.dirty = true; var saveBtn = document.querySelector('[data-act="layoutSave"]'); if (saveBtn) saveBtn.disabled = false; }
    drawLayoutCanvas();
    return;
  }
  if (t.dataset && t.dataset.reportnote) {
    S.reportNote = t.value;
    var sheet = $('reportSheet');
    if (sheet && S.report && S.report.data) sheet.innerHTML = reportHtml(S.report.data, S.reportNote);
    return;
  }
  if (e.type === 'input') clearFormMsg(t.form);
  if (t.dataset && t.dataset.picksearch) {
    t.parentNode.querySelector('.pick-list').innerHTML = pickListHtml(t.value);
    return;
  }
  if (t.name === '預かり品' && t.form) {
    var tokens = splitTokens(t.value);
    Array.prototype.forEach.call(t.form.querySelectorAll('.suggest[data-suggest="預かり品"] [data-token]'), function (b) {
      b.setAttribute('aria-pressed', String(tokens.indexOf(b.dataset.token) !== -1));
    });
  }
}
document.addEventListener('input', onFilter);
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.dataset && t.dataset.homeq) { S.homeQ = t.value; drawHomeHits(); }
  if (t && t.dataset && t.dataset.pq) { var pst = pState(t.dataset.pq); pst.q = t.value; pst.n = P_STEP; pDraw(t.dataset.pq); }
  if (t && t.dataset && t.dataset.mtgmemo) mtgState().memos[mtgMemoKey()] = t.value;
  if (t && t.dataset && t.dataset.mmq) { S.mm.q = t.value; var box = $('mmCustList'); if (box) box.innerHTML = mmCustListHtml(); }
  if (t && t.dataset && t.dataset.mmnote) S.mm.notes[t.dataset.mmnote] = t.value;
});
// 入力の途中の内容を、端末に下書きとして残す（打つ・選ぶ・押すのあと、少し待ってから）
['input', 'change', 'click'].forEach(function (type) {
  document.addEventListener(type, function (e) {
    var form = e.target && e.target.closest ? e.target.closest('form[data-form]') : null;
    if (form) draftLater(form);
  });
});
// ページが隠れる・閉じられる前に、待っている下書きをすぐ書く（スマホは、ほかのアプリに切り替えるとページが捨てられることがある）
window.addEventListener('pagehide', draftFlush);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') draftFlush(); });
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset && (t.dataset.q || t.dataset.permonth || t.dataset.perfrom || t.dataset.perto)) { onFilter(e); return; }
  if (t.dataset && t.dataset.optcat) { S.optCat = t.value; render(); return; }
  if (t.dataset && t.dataset.photofile) { onPhotoFiles(t); return; }
  if (t.dataset && t.dataset.scanfile) { var sf = t.files && t.files[0]; t.value = ''; scanUseFile(sf); return; }
  if (t.id === 'logoFile') {
    var logoFile = t.files && t.files[0];
    t.value = '';
    if (!logoFile) return;
    shrinkLogo(logoFile).then(function (dataUrl) { return call('saveLogo', { dataUrl: dataUrl }); }).then(function (r) {
      S.D.logo = r.logo; showBrand(); toast('ロゴを入れました'); render();
    }).catch(failToast);
    return;
  }
  if (t.id === 'layImage') {
    var file = t.files && t.files[0];
    if (!file) return;
    if (['image/png', 'image/jpeg', 'image/gif', 'image/webp'].indexOf(file.type) === -1) { toast('背景に使える画像は PNG・JPEG・GIF・WebP です。', true); return; }
    if (file.size > S.D.layoutImageMaxBytes) { toast('画像が大きすぎます。' + Math.floor(S.D.layoutImageMaxBytes / 1024 / 1024) + 'MBまでにしてください。', true); return; }
    var layoutId = L.id;
    readFileBase64(file).then(function (base64) { return call('saveLayoutImage', { layoutId: layoutId, mimeType: file.type, base64: base64 }); }).then(function (r) {
      if (L.id !== layoutId) return;
      L.data.imageBase64 = r.imageBase64; L.data.imageMimeType = r.imageMimeType; L.data.imageMissing = false;
      var cur = L.list.filter(function (l) { return l['レイアウトID'] === layoutId; })[0]; if (cur) cur.hasImage = true;
      toast('背景の画像を入れました'); drawLayoutBox(); measureLayoutImage();
    }).catch(failToast);
    return;
  }
  if (t.dataset && t.dataset.reportmonth) {
    if (/^\d{4}-\d{2}$/.test(t.value) && t.value <= S.D.today.slice(0, 7)) { S.reportMonth = t.value; $('reportBox').innerHTML = reportBoxHtml(); loadReport(); }
    return;
  }
  var form = t.form;
  if (form && form.dataset.form && S.D.schema[form.dataset.form]) {
    if (t.dataset.dep) t.dataset.touched = '1';
    if (t.name === '対象区分') {
      Array.prototype.forEach.call(form.querySelectorAll('select[data-dep]'), function (sel) { sel.dataset.touched = '1'; });
      refreshDependents(form);
    }
    // 修理：機器を選んだら、空いている型番とシリアルを台帳から入れる
    if (t.name === '機器ID' && form.dataset.form === 'repair' && IDX.dev[t.value]) {
      var picked = IDX.dev[t.value];
      if (form.elements['型番'] && !form.elements['型番'].value) form.elements['型番'].value = picked['機種名'] || '';
      if (form.elements['シリアル'] && !form.elements['シリアル'].value) form.elements['シリアル'].value = picked['シリアル'] || '';
    }
  }
});

document.addEventListener('submit', function (e) {
  var form = e.target;
  if (form.id === 'loginForm') return;
  e.preventDefault();
  if (form.classList.contains('settings-form')) {
    var values = {};
    Array.prototype.forEach.call(form.querySelectorAll('[data-setting]'), function (el) { values[el.dataset.setting] = el.value; });
    var catBoxes = form.querySelectorAll('input[data-alertcat]');
    if (catBoxes.length) values['要対応に出さない種類'] = Array.prototype.filter.call(catBoxes, function (x) { return !x.checked; }).map(function (x) { return x.dataset.alertcat; }).join(',');
    call('saveSettings', { values: values }).then(function (r) {
      var D = S.D;
      D.settings = r.settings;
      D.licenseWarnDays = Number(r.settings['ライセンス期限の手前日数']);
      D.warrantyWarnDays = Number(r.settings['保証期限の手前日数']);
      D.canReveal = D.me.isAdmin || r.settings['スタッフに認証情報を見せる'] !== 'いいえ';
      showBrand();
      D.rentalOn = r.settings['レンタル機器を使う'] !== 'いいえ';
      D.repairLongDays = Number(r.settings['修理の長期化の日数']) || 0;
      if (!D.me.startView) D.startView = START_KEY[r.settings['開いた直後の画面']] ? r.settings['開いた直後の画面'] : D.startViews[0];
      S.alertsStale = true; S.files = null;
      // 配信フォルダーを入れた・変えたときは、すぐ確かめにいく
      var feedWas = D.feed && D.feed.on;
      D.feed = { on: !!r.settings['配信フォルダー'], status: D.feed ? D.feed.status : null, hours: (function (h) { h = parseInt(h, 10); return h >= 1 && h <= 6 ? h : 6; })(r.settings['配信を確かめる間隔（時間）']) };
      toast(form.dataset.done); render();
      if (D.feed.on && (!feedWas || form.id === 'settingsForm')) checkFeed(false);
    }).catch(failToast);
    return;
  }
  if (form.id === 'releaseForm') {
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    call('saveToolRelease', { file: $('relFile').value, version: $('relVersion').value, notes: $('relNotes').value }).then(function (r) {
      S.release = r.release || null; if (r.release) toast('v' + r.release.version + ' を登録しました');
      var box = $('releaseBox'); if (box) box.innerHTML = releaseHtml();
    }).catch(function (e) { btn.disabled = false; failToast(e); });
    return;
  }
  if (form.id === 'optionForm') {
    var value = $('optValue').value;
    call('addOption', { category: S.optCat || S.D.optionCategories[0], value: value }).then(function (r) {
      S.D.options = r.options; toast('足しました'); render();
    }).catch(failToast);
    return;
  }
  var kind = form.dataset.form;
  var msg = form.querySelector('.msg');
  var showErr = function (err) { if (err && err.error === 'unauthorized') return; msg.textContent = (err && err.message) || 'うまくいきませんでした。'; msg.hidden = false; };
  if (kind === 'staff') {
    var isNew = form.dataset.new === '1';
    var data = { 'スタッフID': form.elements['スタッフID'].value, '表示名': form.elements['表示名'].value, '権限': form.elements['権限'].value, '有効': form.elements['有効'].value };
    call('saveStaff', { isNew: isNew, data: data }).then(function (r) {
      closeModal(form);
      if (S.staff) upsert(S.staff, 'スタッフID', r.staff);
      S.D.staffNames = (S.staff || []).filter(function (s) { return s['有効'] === 'はい'; }).map(function (s) { return s['表示名']; });
      render();
      if (r.tempPassword) tempPasswordDialog(r.staff['スタッフID'], r.tempPassword); else toast('保存しました');
    }).catch(showErr);
    return;
  }
  if (kind === 'printcustomer') {
    var popt = {};
    ['info', 'devices', 'licenses', 'layouts', 'gone', 'notes'].forEach(function (n) { popt[n] = form.querySelector('[name="' + n + '"]').checked; });
    if (!popt.info && !popt.devices && !popt.licenses && !popt.layouts) { showErr({ message: '印刷するものを、1つは選んでください。' }); return; }
    var pid = S.customerId;
    var submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    (popt.layouts ? loadLayoutsForPrint(pid) : Promise.resolve([])).then(function (layouts) {
      if (S.customerId !== pid || !IDX.cust[pid]) return;
      if (popt.layouts && !layouts.length && !popt.info && !popt.devices && !popt.licenses) { submitBtn.disabled = false; showErr({ message: 'この顧客には、レイアウト図がまだありません。' }); return; }
      closeModal(form);
      printHtml(customerPrintHtml(pid, popt, layouts));
    }).catch(function (e) { submitBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'wininfopaste') {
    var pasteBtn = form.querySelector('button[type="submit"]');
    if (pasteBtn.disabled) return;
    pasteBtn.disabled = true;
    // 送った時点の行（返事の行番号は、これに対するもの）
    var lines = $('wi_text').value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l && l.charAt(0) !== '#'; });
    call('importWinInfo', { text: lines.join('\n') }).then(function (r) {
      pasteBtn.disabled = false;
      S.D.wininfo = r.wininfo;
      if (r.errors.length) {
        // 読めなかった行だけを残して、理由を出す（直して、もう一度「登録する」）
        $('wi_text').value = r.errors.map(function (e) { return lines[e.line - 1] || ''; }).join('\n');
        showErr({ message: r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : '') + '。読めなかった ' + r.errors.length + '行を残しています：' + r.errors.map(function (e) { return e.message; }).filter(function (m, i, all) { return all.indexOf(m) === i; }).join(' ／ ') });
        S.renderPending = true;
        return;
      }
      closeModal(form);
      toast(r.added + '件を登録しました' + (r.skipped ? '（登録済み ' + r.skipped + '件は飛ばしました）' : ''));
      render();
    }).catch(function (e) { pasteBtn.disabled = false; showErr(e); });
    return;
  }
  if (kind === 'myprefs') {
    call('saveMyStartView', { startView: $('my_start').value }).then(function (r) {
      var D = S.D;
      D.me.startView = r.startView;
      D.startView = r.startView || (START_KEY[D.settings['開いた直後の画面']] ? D.settings['開いた直後の画面'] : D.startViews[0]);
      closeModal(form); toast('保存しました。次に開いたときは「' + D.startView + '」から始まります');
    }).catch(showErr);
    return;
  }
  if (kind === 'password') {
    if ($('pw_new').value !== $('pw_new2').value) { showErr({ message: '新しいパスワードが2回で違っています。' }); return; }
    call('changeMyPassword', { current: $('pw_cur').value, next: $('pw_new').value, remember: rememberNow(), ticket: S.ticket || '' }).then(function (r) {
      if (r && r.resume) { urlTicketWrite(r.resume); ticketAt = Date.now(); }
      closeModal(form); toast('パスワードを変更しました');
    }).catch(showErr);
    return;
  }
  if (S.D && S.D.schema[kind]) submitRecordForm(form, false);
});

// ===========================================================================
// 起動
// ===========================================================================
(function start() {
  showBrand();
  var saved = '';
  try { saved = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { saved = ''; }
  fillLoginForm();
  if (/^[0-9a-f]{64}$/.test(saved)) {
    // セッションが切れていたら、call() の中で自動ログイン（覚えてあれば）かログイン画面に進む
    // URLの券を先に読んでから始める（読む前に終わってログイン画面になると、古い券が残るため）
    urlTicketRead(function (t) {
      S.ticket = t;
      boot(saved).catch(function () { if (!autoBusy && !resumeBusy) toLogin(''); });
    });
  } else {
    // 画面の中の保存が使えない・消えていたら、URLの券で戻す（v0.19.0）
    urlTicketRead(function (ticket) {
      if (ticket) { resumeFromTicket(ticket); return; }
      if (!autoLogin()) { toLogin(''); ($('loginId').value ? $('loginPw') : $('loginId')).focus(); }
    });
  }
})();
</script>
